/* ---------- the kitty ledger ---------- */
function kittyOf(y){
  const d=DATA[y]; if(!d) return null;
  if (!d.kitty) d.kitty={currency:"€", start:null, days:{}};
  if (!d.kitty.days) d.kitty.days={};
  return d.kitty;
}
function money(y,v){
  const k=kittyOf(y), c=(k&&k.currency)||"€";
  if (v==null || isNaN(v)) return "—";
  const neg=v<0, a=Math.abs(v);
  const str=(Math.round(a*100)/100).toLocaleString("en-GB",{minimumFractionDigits:(a%1?2:0),maximumFractionDigits:2});
  return (neg?"−":"")+c+str;
}
/* running ledger: closing balance is what Justin posts each night; spend is derived */
function kittyLedger(y){
  const d=DATA[y], k=kittyOf(y);
  const rows=[]; let prev=(typeof k.start==="number")?k.start:null;
  const nP=(d.players||[]).length||0;
  (d.days||[]).forEach(x=>{
    const rec=k.days[x.day]||{};
    const bal=(typeof rec.bal==="number")?rec.bal:null;
    const spend=(bal!=null && prev!=null)?Math.round((prev-bal)*100)/100:null;
    rows.push({day:x.day, meta:x, bal, spend, note:rec.note||"", perPlayer:(spend!=null&&nP)?spend/nP:null});
    if (bal!=null) prev=bal;
  });
  const latest=prev;
  const start=(typeof k.start==="number")?k.start:null;
  const spentTotal=(start!=null&&latest!=null)?Math.round((start-latest)*100)/100:null;
  const daysWith=rows.filter(r=>r.spend!=null);
  return { rows, start, latest, spentTotal, nP,
    avgDay: daysWith.length?spentTotal/daysWith.length:null,
    perPlayerTotal:(spentTotal!=null&&nP)?spentTotal/nP:null,
    perPlayerDay:(daysWith.length&&nP)?(spentTotal/daysWith.length)/nP:null,
    daysLeft:(d.days||[]).length-daysWith.length, daysDone:daysWith.length };
}

function vKitty(y){

  let out='<h2 class="sec-t">The Kitty</h2>'

  // the balance plaque

    +'</div>';

      +'<div class="erow"><span class="en">Starting pot</span>'
      +'<input inputmode="decimal" style="width:110px" value="'+(L.start!=null?L.start:"")+'" onchange="setKittyStart(this)">'

        +'<input inputmode="decimal" style="width:110px" value="'+(typeof rec.bal==="number"?rec.bal:"")+'" onchange="setKittyBal('+x.day+',this)">'
        +'</div>'
        +'<div class="erow" style="border:0;padding-top:0"><input style="flex:1;width:auto;text-align:left;font-size:13px" '
        +'placeholder="what it went on (optional)" value="'+esc(rec.note||"")+'" onchange="setKittyNote('+x.day+',this)"></div>';
    });
    out+='<div class="note">Post the balance at the end of each night; the spend works itself out.</div></div>';
  }
  return out+kittyPanel();
}

    });
    cy+=30;
  } else { T("No rounds entered yet.",W/2,cy+20,"italic 20px "+SER,FAINT,"center"); cy+=40; }
  /* ---- 4 · ammunition ---- */
  const A=awards(y);
  if (A.length){
    divider(); secTitle("Dinner Ammunition","The unofficial awards · computed from the scores");
    RRECT(L-10,cy-6,CW+20,10,0,null,null,0);   // no-op spacing marker
    A.forEach(([t,w2,cls,stat,q])=>{
      const who=String(w2).replace(/&amp;/g,"&").replace(/<[^>]*>/g,"");
      const quote="“"+q+"”";
      const qf="italic 19px "+SER;
      const qLines=wrapTxt(qf,quote,CW-120);
      const cardH=118+qLines.length*26;
      RRECT(L,cy,CW,cardH,8,CARD,HAIR,2);
      LINE(W/2-16,cy+22,W/2+16,cy+22,GOLD,2);
      T(t.replace(/&amp;/g,"&"),W/2,cy+52,"700 24px "+SER,NAVY,"center");
      const whoCol=cls==="who-red"?RED:(cls==="who-blue"?BLUE:GOLD);
      T(who.toUpperCase(),W/2,cy+78,"700 16px "+SAN,whoCol,"center");
      T(stat.replace(/&amp;/g,"&"),W/2,cy+102,"400 17px "+SAN,MUT,"center");
      qLines.forEach((ln,k)=>T(ln,W/2,cy+128+k*26,qf,INK,"center"));
      cy+=cardH+16;
    });
  }
  /* ---- 5 · records ---- */
  divider(); secTitle("The Record Book","Since the tour began");
  const t2=tallyAfter(9999);
  T(String(t2.BLUE),W/2-70,cy+44,"700 64px "+SER,BLUE,"center");
  T("–",W/2,cy+44,"400 34px "+SER,FAINT,"center");
  T(String(t2.RED),W/2+70,cy+44,"700 64px "+SER,RED,"center");
  cy+=72;
  T("TROPHIES, BLUE V RED · NEXT: TOUR "+(LEGACY.tourNumbering["2026"]||11),W/2,cy,"600 15px "+SAN,MUT,"center");
  cy+=34;
  Object.keys(DATA).sort().forEach(yy=>{
    const dd2=DATA[yy]; const o2=ttOrder(yy);
    if (!o2.length||!played(yy,o2[0]).length) return;
    const ds2=dayScores(yy);
    cy+=32;
    T(yy,L+8,cy,"700 21px "+SER,GOLD);
    T(nm(yy,o2[0])+"  "+best3(yy,o2[0]),L+110,cy,"700 21px "+SAN,INK);
    T("Team "+half(ds2.red)+"–"+half(ds2.blue)+" · Spoon: "+sur(yy,o2[o2.length-1]),W-L-8,cy,"400 18px "+SAN,MUT,"right");
    LINE(L,cy+10,W-L,cy+10,HAIR,1);
  });
  cy+=54;
  T("OFFICIAL RECORD OF NOT THE RYDER CUP · "+y,W/2,cy,"600 15px "+SAN,FAINT,"center");
  cy+=50;
  /* ---- paint ---- */
  let cw2=W, ch2=cy, scale=1;
  const MAXA=16000000;
  if (cw2*ch2>MAXA){ scale=Math.sqrt(MAXA/(cw2*ch2)); cw2=Math.floor(cw2*scale); ch2=Math.floor(ch2*scale); }
  const cv=document.createElement("canvas"); cv.width=cw2; cv.height=ch2;
  const x=cv.getContext("2d");
  x.scale(scale,scale);
  x.fillStyle=IVORY; x.fillRect(0,0,W,cy);
  function rr2(x0,y0,w2,h2,r2){ x.beginPath(); x.moveTo(x0+r2,y0); x.arcTo(x0+w2,y0,x0+w2,y0+h2,r2);
    x.arcTo(x0+w2,y0+h2,x0,y0+h2,r2); x.arcTo(x0,y0+h2,x0,y0,r2); x.arcTo(x0,y0,x0+w2,y0,r2); x.closePath(); }
  ops.forEach(p=>{
    if (p.o==="t"){ x.font=p.f; x.fillStyle=p.fill; x.textAlign=p.align; x.fillText(p.txt,p.x,p.y); }
    else if (p.o==="r"){
      if (p.fill){ rr2(p.x,p.y,p.w,p.h,p.r);
        if (p.fill.grad){ const g=x.createLinearGradient(0,p.y,0,p.y+p.h);
          g.addColorStop(0,p.fill.grad[0]); g.addColorStop(1,p.fill.grad[1]); x.fillStyle=g; }
        else x.fillStyle=p.fill;
        x.fill(); }
      if (p.stroke){ rr2(p.x,p.y,p.w,p.h,p.r); x.strokeStyle=p.stroke; x.lineWidth=p.lw||1; x.stroke(); }
    }
    else if (p.o==="l"){ x.strokeStyle=p.stroke; x.lineWidth=p.lw||1;
      x.beginPath(); x.moveTo(p.x1,p.y1); x.lineTo(p.x2,p.y2); x.stroke(); }
  });
  cv.toBlob(async blob=>{
    if (!blob){ st("Image too large for this browser — board image instead."); shareBoard(); return; }
    const file=new File([blob],"ntrc-"+y+"-full-report.png",{type:"image/png"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:"NTRC "+y+" — full report"}); st("Shared."); return; } catch(e){}
    }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="ntrc-"+y+"-full-report.png"; a.click();
    st("Full report saved to Downloads — send it to the WhatsApp group.");
  },"image/png");
}
function discIdx(y,i){
  const v=DATA[y].rounds[i]||[];
  const nums=v.filter(x2=>typeof x2==="number");
  if (nums.length<4) return -1;
  return v.indexOf(Math.min.apply(null,nums));
}

/* ---------- publish to team site (GitHub Pages) ---------- */
function pubCfg(){ try{ return JSON.parse(localStorage.getItem("ntrc.publish")||"null"); }catch(e){ return null; } }
window.pubSave = () => {
  const v=id=>{const el=document.getElementById(id); return el?el.value.trim():"";};
  const o={owner:v("pubOwner"), repo:v("pubRepo"), token:v("pubToken")};
  if(!o.owner||!o.repo||!o.token){ alert("Need account, repository and token."); return; }
  localStorage.setItem("ntrc.publish", JSON.stringify(o)); render();
};
window.publishNow = async () => {
  const cfg=pubCfg();
  const st=m=>{const el=document.getElementById("pubStatus"); if(el) el.textContent=m;};
  if(!cfg){ st("Set up GitHub first (open the settings above)."); return; }
  st("Publishing…");
  try{
    const payload={ publishedAt:new Date().toISOString(), build:BUILD };
    Object.keys(DATA).forEach(k=>{ if(+k>=EDIT_FROM) payload[k]=DATA[k]; });
    const body=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    const url="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/data.json";
    const hdr={ "Authorization":"Bearer "+cfg.token, "Accept":"application/vnd.github+json" };
    let sha=null;
    const g=await fetch(url,{headers:hdr});
    if (g.ok){ sha=(await g.json()).sha; }
    const put=await fetch(url,{ method:"PUT", headers:hdr,
      body:JSON.stringify({ message:"NTRC publish "+new Date().toISOString().slice(0,16),
        content:body, ...(sha?{sha}:{}) }) });
    if (put.ok) st("Published — the team site updates within a minute or two.");
    else st("Publish failed ("+put.status+") — check the settings, or show me this number.");
  } catch(e){ st("No connection — try again when there's signal. The WhatsApp image never fails."); }
};

/* ---------- clock & weather strip ----------
   Time comes from the device, so it is right in the UK and right in Spain.
   When the two differ, the venue clock is shown alongside. Weather is the
   VENUE's (what matters for golf), from Open-Meteo — no API key, so nothing
   secret sits in a public repo. Cached 15 min; silently absent when offline. */
const VENUE={name:"Empordà", lat:42.03, lon:3.09, tz:"Europe/Madrid"};
let WX=null;
function wmo(c){
  const m={0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",
    51:"Drizzle",53:"Drizzle",55:"Drizzle",56:"Freezing drizzle",57:"Freezing drizzle",
    61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",
    71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",
    80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",
    95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"};
  const i={0:"☀",1:"🌤",2:"⛅",3:"☁",45:"🌫",48:"🌫",51:"🌦",53:"🌦",55:"🌦",56:"🌦",57:"🌦",
    61:"🌧",63:"🌧",65:"🌧",66:"🌧",67:"🌧",71:"🌨",73:"🌨",75:"🌨",77:"🌨",
    80:"🌦",81:"🌦",82:"⛈",85:"🌨",86:"🌨",95:"⛈",96:"⛈",99:"⛈"};
  return {t:m[c]||"", i:i[c]||""};
}
function wxCached(){
  try{ const c=JSON.parse(localStorage.getItem("ntrc.wx")||"null");
    return (c&&c.d)?c:null; }catch(e){ return null; }
}
async function loadWeather(force){
  const c=wxCached();
  if (c){ WX=c.d; if(!force && (Date.now()-c.t)<15*60*1000){ paintBar(); return; } }
  paintBar();
  try{
    const u="https://api.open-meteo.com/v1/forecast?latitude="+VENUE.lat+"&longitude="+VENUE.lon
      +"&current=temperature_2m,weather_code,wind_speed_10m"
      +"&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1";
    const r=await fetch(u); if(!r.ok) return;
    const j=await r.json();
    WX={ temp:Math.round(j.current.temperature_2m), code:j.current.weather_code,
         wind:Math.round(j.current.wind_speed_10m),
         hi:Math.round((j.daily.temperature_2m_max||[])[0]),
         lo:Math.round((j.daily.temperature_2m_min||[])[0]) };
    try{ localStorage.setItem("ntrc.wx", JSON.stringify({t:Date.now(), d:WX})); }catch(e){}
    paintBar();
  }catch(e){ /* no signal — the strip just shows the clock */ }
}
function barHTML(){
  const now=new Date();
  let devTz=""; try{ devTz=Intl.DateTimeFormat().resolvedOptions().timeZone||""; }catch(e){}
  const date=now.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  const time=now.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  let out='<b>'+esc(date)+'</b><span class="sep">·</span><b>'+esc(time)+'</b>';
  let named=false;                                   // has the venue been named yet?
  if (devTz && devTz!==VENUE.tz){
    let vt=""; try{ vt=now.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",timeZone:VENUE.tz}); }catch(e){}
    if (vt && vt!==time){ out+='<span class="sep">·</span>'+esc(VENUE.name)+' <b>'+esc(vt)+'</b>'; named=true; }
  }
  if (WX && typeof WX.temp==="number"){
    const w=wmo(WX.code);
    const here=(devTz===VENUE.tz);                   // standing on the course
    out+='<span class="sep">·</span><span class="wx">'+((named||here)?"":esc(VENUE.name)+" ")
      +w.i+' '+WX.temp+'°'+(w.t?' '+esc(w.t):"")+'</span>';
  }
  return out;
}
function paintBar(){
  const el=document.getElementById("wxbar");
  if (el) el.innerHTML=barHTML();
}

/* ---------- add to home screen ---------- */
let deferredPrompt=null;
if (READONLY && location.protocol.indexOf("http")===0){
  if ("serviceWorker" in navigator){
    // updateViaCache:none => the worker script itself is never HTTP-cached,
    // and a controller change means a new build took over: reload once into it.
    let swReloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(swReloaded) return; swReloaded=true; location.reload();
    });
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"})
      .then(reg=>{ reg.update(); setInterval(()=>reg.update(), 60*60*1000); })
      .catch(()=>{});
  }
  window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt=e; render(); });
  window.addEventListener("appinstalled", ()=>{ deferredPrompt=null; render(); });
}
function isStandalone(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
      || navigator.standalone===true;
}
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent||""); }
function isAndroid(){ return /Android/.test(navigator.userAgent||""); }
window.doInstall = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  try { await deferredPrompt.userChoice; } catch(e){}
  deferredPrompt=null; render();
};
window.copyLink = () => {
  const u=location.href.split("#")[0];
  const done=()=>{ const el=document.getElementById("cpMsg"); if(el) el.textContent="Link copied — paste it into "+(isIOS()?"Safari":"Chrome")+"."; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(done).catch(done);
  else done();
};
function installPanel(){
  if (!READONLY || isStandalone() || location.protocol.indexOf("http")!==0) return "";
  let steps;
  if (deferredPrompt){
    steps='<button class="kitty-btn" onclick="doInstall()">Add NTRC to my home screen</button>';
  } else if (isIOS()){
    steps='<ol class="ins"><li>Tap <b>Share</b> <span class="ic">&#x2191;</span> at the bottom of Safari</li>'
      +'<li>Scroll and tap <b>Add to Home Screen</b></li><li>Tap <b>Add</b></li></ol>'
      +'<div class="ins-w">Don\'t see Share? You\'re in WhatsApp\'s browser — tap <b>&#x22EF;</b> or the compass icon and choose <b>Open in Safari</b> first.</div>'
      +'<button class="btn-quiet" onclick="copyLink()">Copy link</button> <span class="note" id="cpMsg"></span>';
  } else if (isAndroid()){
    steps='<ol class="ins"><li>Tap the <b>&#x22EE;</b> menu in Chrome</li>'
      +'<li>Tap <b>Install app</b> or <b>Add to Home screen</b></li><li>Tap <b>Install</b></li></ol>'
      +'<div class="ins-w">No menu? You\'re in WhatsApp\'s browser — tap <b>&#x22EE;</b> and choose <b>Open in Chrome</b> first.</div>'
      +'<button class="btn-quiet" onclick="copyLink()">Copy link</button> <span class="note" id="cpMsg"></span>';
  } else {
    return "";
  }
  return '<section class="kitty"><div class="kitty-in">'
    +'<div class="kitty-t">Keep NTRC on your phone</div>'
    +'<div class="kitty-s">Full screen, one tap, works even when the wifi doesn\'t</div>'
    +steps+'</div></section>';
}

/* ---------- shell ---------- */
function render(){
  const yrs=Object.keys(DATA).sort();
  if (!DATA[curYear]) curYear=yrs[yrs.length-1];
  const yearless = curTab==="records" || curTab==="setup" || curTab==="players";
  document.getElementById("yearPills").innerHTML = yearless ? "" :
    yrs.map(v=>'<button class="yr-pill'+(v===curYear?" on":"")+'" onclick="setYr(\''+v+'\')">'+v+'</button>').join("");
  document.getElementById("tabbar").innerHTML = TABS.map(([k,l])=>
    '<button class="tab'+(k===curTab?" on":"")+'" onclick="go(\''+k+'\')">'+l+'</button>').join("");
  const v=document.getElementById("view");
  try{
    if (curTab==="board") v.innerHTML=vBoard(curYear);
    else if (curTab==="match") v.innerHTML=vMatch(curYear);
    else if (curTab==="trophy") v.innerHTML=vTrophy(curYear);
    else if (curTab==="ammo") v.innerHTML=vAmmo(curYear);
    else if (curTab==="records") v.innerHTML=vRecords();
    else if (curTab==="players") v.innerHTML=vPlayers();
    else if (curTab==="kitty") v.innerHTML=vKitty(curYear);
    else if (curTab==="setup") v.innerHTML=vSetup();
    else if (curTab==="draw") v.innerHTML=vDraw(curYear);
    else v.innerHTML=vEnter(curYear);
  }catch(e){ v.innerHTML='<div class="empty">Something went wrong rendering this view: '+esc(e.message)+'</div>'; }
  v.innerHTML += '<footer class="foot">Official record of Not the Ryder Cup · Tour '+(LEGACY.tourNumbering[curYear]||"")+'<br><span style="opacity:.55">'+(READONLY?'team edition':'admin')+' · build '+BUILD+'</span></footer>';
}
window.go = t => { curTab=t; render(); window.scrollTo(0,0); };
window.setYr = y => { curYear=y; render(); };
render();
paintBar();
if (typeof setInterval==="function"){
  setInterval(paintBar, 20000);                 // clock ticks without touching the view
  setInterval(()=>loadWeather(true), 15*60*1000);
}
loadWeather(false);
</script>
