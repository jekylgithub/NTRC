<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NTRC — Not the Ryder Cup</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NTRC 2026">
<meta name="theme-color" content="#122341">
<style>
:root{
  --paper:#f7f4ec; --card:#fdfcf8; --ink:#1c2740; --navy:#122341; --navy2:#1a2f54;
  --mut:#7a7466; --faint:#a49d8d; --hair:#e2dccb; --hair2:#cfc7ae;
  --gold:#a8863c; --gold-pale:#d9c89a; --gold-wash:rgba(168,134,60,.07);
  --red:#a32636; --blue:#1e4f8f;
  --serif:"Charter","Bitstream Charter","Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--navy);}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;line-height:1.45;min-height:100vh;}
.t-r{color:var(--red);} .t-b{color:var(--blue);} .mutd{color:var(--mut);}

/* app chrome */
.chrome{position:sticky;top:0;z-index:20;background:var(--navy);color:#f4f1e8;
  box-shadow:0 2px 10px rgba(18,35,65,.25);
  /* installed on iPhone the page runs under the clock / Dynamic Island / signal:
     let the navy fill that strip, and push our own content clear of it */
  padding-top:env(safe-area-inset-top,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);}
.chrome-in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 14px 4px;flex-wrap:wrap;}
.brand{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.04em;}
.brand em{font-style:normal;color:var(--gold-pale);}
.yearsel{margin-left:auto;}
.yearsel select{font-family:var(--sans);font-size:13px;background:var(--navy2);color:#f4f1e8;
  border:1px solid rgba(217,200,154,.4);border-radius:4px;padding:5px 8px;}
.tabs{max-width:960px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:6px 8px 0;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:none;color:rgba(244,241,232,.66);font-family:var(--sans);
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  padding:9px 12px 11px;cursor:pointer;border-bottom:2px solid transparent;}
.tab.on{color:var(--gold-pale);border-bottom-color:var(--gold);}
.wxbar{max-width:960px;margin:0 auto;text-align:center;padding:2px 14px 9px;
  font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:rgba(244,241,232,.6);
  font-variant-numeric:tabular-nums;line-height:1.7;}
.wxbar b{font-weight:600;color:rgba(244,241,232,.9);}
.wxbar .wx{color:var(--gold-pale);}
.wxbar .sep{opacity:.4;margin:0 6px;}
@media(max-width:420px){ .wxbar{font-size:10px;letter-spacing:.1em;} }
.yrs{max-width:960px;margin:0 auto;display:flex;justify-content:center;gap:7px;
  padding:9px 10px 11px;flex-wrap:wrap;border-top:1px solid rgba(217,200,154,.14);}
.yr-pill{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;font-weight:600;
  color:rgba(244,241,232,.55);background:none;border:1px solid rgba(217,200,154,.28);
  border-radius:999px;padding:5px 13px;cursor:pointer;font-variant-numeric:tabular-nums;}
.yr-pill.on{color:var(--gold-pale);border-color:var(--gold);background:rgba(217,200,154,.1);}
.wrap{max-width:960px;margin:0 auto;
  padding-top:clamp(22px,4vw,44px);
  padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));
  padding-left:max(clamp(14px,4vw,40px), env(safe-area-inset-left,0px));
  padding-right:max(clamp(14px,4vw,40px), env(safe-area-inset-right,0px));}

/* masthead / plaque / shared (approved design) */
.mast{text-align:center;}
.kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
.mast h1{margin:0;font-family:var(--serif);font-weight:700;color:var(--navy);
  font-size:clamp(28px,6vw,46px);line-height:1.05;text-wrap:balance;}
.mast-rule{display:flex;align-items:center;gap:14px;margin:14px auto 10px;max-width:400px;}
.mast-rule span{flex:1;height:1px;background:var(--hair2);}
.mast-rule em{font-family:var(--serif);font-style:normal;color:var(--gold);font-size:16px;letter-spacing:.22em;}
.subtitle{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);}
.plaque{margin:clamp(22px,4vw,36px) auto 0;max-width:620px;}
.plq-in{overflow:hidden;background:linear-gradient(180deg,var(--navy2),var(--navy));border-radius:6px;
  box-shadow:inset 0 0 0 1px rgba(217,200,154,.55), inset 0 0 0 5px var(--navy), inset 0 0 0 6px rgba(217,200,154,.25),
  0 12px 30px rgba(18,35,65,.18);
  padding:clamp(18px,4vw,30px) clamp(16px,4vw,36px);text-align:center;color:#f4f1e8;}
.plq-label{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold-pale);margin-bottom:8px;}
.plq-row{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2.5vw,24px);width:100%;}
/* equal-width flanks keep the score dead centre however many stars a side has */
.plq-team{flex:1 1 0;min-width:0;
  font-family:var(--serif);font-size:clamp(13px,2.7vw,20px);letter-spacing:.18em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;gap:5px;}
.plq-red{color:#e4a9a9;} .plq-blue{color:#a9c2e8;}
.plq-stars{font-size:8.5px;letter-spacing:.2em;color:var(--gold-pale);opacity:.75;text-indent:.2em;
  max-width:100%;line-height:1.5;overflow-wrap:anywhere;}
.plq-capn{font-family:var(--sans);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(244,241,232,.55);max-width:100%;line-height:1.35;
  display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;text-align:center;}
.plq-capn .capb{width:13px;height:13px;line-height:13px;font-size:8px;vertical-align:0;flex:none;}
.plq-score{flex:0 0 auto;font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums;
  display:flex;align-items:baseline;gap:clamp(6px,1.6vw,16px);line-height:1;}
.plq-score b{font-weight:700;font-size:clamp(48px,12vw,92px);white-space:nowrap;}
.plq-score i{font-style:normal;font-size:clamp(22px,5vw,40px);color:var(--gold-pale);
  align-self:center;line-height:1;transform:translateY(-.08em);}
.plq-score .fr{font-size:.46em;vertical-align:.34em;letter-spacing:0;margin-left:.02em;}
@media(max-width:430px){
  .plq-row{flex-wrap:wrap;row-gap:14px;}
  .plq-score{order:-1;flex:0 0 100%;justify-content:center;}
  .plq-team{flex:1 1 40%;}
  .plq-stars{font-size:9.5px;letter-spacing:.16em;}
}
.plq-verdict{margin-top:12px;font-size:clamp(11px,2.2vw,14px);letter-spacing:.26em;text-transform:uppercase;color:var(--gold-pale);}
.plq-sub{margin-top:7px;font-size:10.5px;letter-spacing:.1em;color:rgba(244,241,232,.55);text-transform:uppercase;}
.days{display:grid;grid-template-columns:repeat(4,1fr);margin:clamp(24px,4vw,40px) 0 0;
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);}
.dy{padding:18px 6px 16px;text-align:center;border-left:1px solid var(--hair);}
.dy:first-child{border-left:0;}
.dy-n{font-family:var(--serif);font-size:14px;color:var(--navy);font-weight:700;}
.dy-m{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:2px;}
.dy-s{font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums;font-weight:700;
  font-size:clamp(20px,4vw,28px);margin-top:9px;display:flex;justify-content:center;gap:6px;align-items:baseline;}
.dy-dash{color:var(--faint);font-weight:400;}
.dy-w{margin-top:7px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;}
.w-red{color:var(--red);} .w-blue{color:var(--blue);} .w-halved{color:var(--mut);} .w-none{color:var(--faint);}
.dy-c{margin-top:3px;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;}
.sec{margin-top:clamp(30px,5vw,48px);}
.sec-t{margin:0;font-family:var(--serif);font-weight:700;color:var(--navy);text-align:center;
  font-size:clamp(22px,4.2vw,30px);}
.sec-s{text-align:center;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);
  margin:7px 0 22px;}
.mpd{margin-bottom:26px;}
.mpd-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;
  border-bottom:1px solid var(--hair2);padding-bottom:7px;margin-bottom:10px;}
.mpd-t{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:15px;}
.mpd-s{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;}
.grps{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
.grp{background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:11px 14px;}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.tee{font-size:10.5px;letter-spacing:.16em;color:var(--gold);font-weight:600;text-transform:uppercase;}
.gfmt{font-size:9.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;}
.sgl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px;padding:6px 0;
  border-top:1px solid var(--hair);}
.sgl:first-of-type{border-top:0;}
.nm{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.nm:last-child{text-align:right;}
.nm.win{font-weight:700;}
.nm.lose{color:var(--faint);}
.sc-note{font-family:var(--serif);font-size:13px;font-weight:700;white-space:nowrap;}
.sc-halved{color:var(--mut);font-weight:400;}
.sc-tbd{color:var(--faint);font-weight:400;font-size:11px;letter-spacing:.1em;}
.fb{margin-top:7px;padding-top:6px;border-top:1px solid var(--hair);text-align:center;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);}
.fb b{font-weight:700;}
.lb{border-top:2px solid var(--navy);border-bottom:1px solid var(--hair2);}
.row{display:grid;grid-template-columns:42px 1fr 160px 58px 60px 52px;gap:9px;align-items:center;
  padding:11px 6px;border-top:1px solid var(--hair);}
.row.hd{border-top:0;padding:8px 6px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mut);font-weight:600;}
.row.champ{background:var(--gold-wash);}
.c-pos{font-family:var(--serif);color:var(--mut);font-size:14px;}
.row.champ .c-pos{color:var(--gold);font-weight:700;}
.c-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap;}
.c-team{width:7px;height:7px;border-radius:50%;flex:none;}
.c-red{background:var(--red);} .c-blue{background:var(--blue);}
.rtag{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;flex:none;
  padding:2px 6px;border-radius:3px;}
.rtag-gold{color:var(--gold);border:1px solid var(--gold-pale);background:#fff;}
.rtag-mute{color:var(--mut);border:1px solid var(--hair2);background:#fff;}
.stars{color:var(--gold);font-size:11px;letter-spacing:.06em;}
.c-rounds{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--mut);white-space:nowrap;}
.c-rounds s{color:var(--faint);}
.c-rec{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--mut);text-align:center;}
.c-b3{font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums;font-weight:700;
  font-size:19px;color:var(--navy);text-align:right;}
.row.champ .c-b3{color:var(--gold);}
.c-nett{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--mut);text-align:right;}
.note{color:var(--faint);font-size:11px;margin-top:12px;text-align:center;}
.menu{background:var(--card);border:1px solid var(--hair2);border-radius:4px;
  box-shadow:inset 0 0 0 4px var(--card), inset 0 0 0 5px var(--gold-pale);
  padding:clamp(20px,4vw,38px) clamp(16px,4vw,46px);
  display:grid;grid-template-columns:repeat(2,1fr);gap:26px 40px;}
.aw{text-align:center;}
.aw-rule{width:26px;height:1px;background:var(--gold);margin:0 auto 10px;}
.aw-title{margin:0;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--navy);}
.aw-who{margin-top:4px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;}
.who-red{color:var(--red);} .who-blue{color:var(--blue);} .who-plain{color:var(--gold);}
.aw-stat{margin-top:6px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;}
.aw-quote{margin:7px 0 0;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink);line-height:1.5;}
.quart{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);}
.q{text-align:center;padding:18px 8px;border-left:1px solid var(--hair);}
.q:first-child{border-left:0;}
.q-n{font-family:var(--serif);font-weight:700;font-size:clamp(26px,4.6vw,38px);color:var(--navy);line-height:1;}
.q-l{margin-top:7px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);line-height:1.6;}
.q-l b{color:var(--ink);}
.foot{margin-top:clamp(34px,6vw,52px);padding-top:18px;border-top:1px solid var(--hair2);
  text-align:center;color:var(--faint);font-size:10px;letter-spacing:.24em;text-transform:uppercase;}

/* records */
.tally{display:flex;justify-content:center;align-items:baseline;gap:clamp(14px,4vw,30px);margin:10px 0 4px;}
.tally .n{font-family:var(--serif);font-weight:700;font-size:clamp(40px,9vw,72px);line-height:1;}
.tally .v{font-family:var(--serif);color:var(--faint);font-size:clamp(18px,4vw,30px);}
.tally-sub{text-align:center;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;}
.roll{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px;}
.roll .r{background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:12px;text-align:center;}
.roll .ry{font-size:10px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;font-weight:700;}
.roll .rc{font-family:var(--serif);font-weight:700;margin-top:4px;font-size:14.5px;}
.roll .rs{font-size:10.5px;color:var(--mut);margin-top:2px;}
.crow{display:grid;grid-template-columns:1fr 44px 52px 70px 52px;gap:8px;align-items:center;
  padding:9px 6px;border-top:1px solid var(--hair);font-variant-numeric:tabular-nums;}
.crow.hd{border-top:0;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;}
.crow>div{text-align:center;font-size:12.5px;color:var(--mut);}
.crow>div:first-child{text-align:left;font-size:13.5px;color:var(--ink);font-weight:600;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.grudge{display:flex;justify-content:space-between;gap:10px;padding:9px 6px;border-top:1px solid var(--hair);
  font-size:13px;flex-wrap:wrap;}
.grudge b{font-weight:700;}
.grudge .gr{color:var(--mut);font-variant-numeric:tabular-nums;}

/* player dossiers */
.pp-group{margin:2px 0 12px;}
.pp-lab{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;
  text-align:center;margin-bottom:7px;}
.pp-lab.r{color:var(--red);} .pp-lab.b{color:var(--blue);}
.pp-picker{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;}
.pp-pill{font-family:var(--sans);font-size:11px;letter-spacing:.08em;font-weight:600;
  border:1px solid var(--hair2);border-radius:999px;padding:7px 13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;}
.pp-pill.r{color:var(--red);background:rgba(163,38,54,.09);border-color:rgba(163,38,54,.32);}
.pp-pill.b{color:var(--blue);background:rgba(30,79,143,.09);border-color:rgba(30,79,143,.32);}
.pp-pill.r.on{background:var(--red);color:#fff;border-color:var(--red);}
.pp-pill.b.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.pp-pill .sw{font-size:9px;opacity:.6;}
.pp-pill.on .sw{opacity:.85;}
.srow{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:2px 14px;align-items:baseline;
  padding:11px 6px;border-top:1px solid var(--hair);}
.srow:first-of-type{border-top:0;}
.srow .sl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;}
.srow .sv{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--navy);
  text-align:right;font-variant-numeric:tabular-nums lining-nums;}
.srow .sn{grid-column:1 / -1;font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--faint);}

.sealed{background:linear-gradient(180deg,var(--navy2),var(--navy));border-radius:6px;
  box-shadow:inset 0 0 0 1px rgba(217,200,154,.45);padding:26px 20px;text-align:center;color:#f4f1e8;}
.sealed-i{font-size:30px;line-height:1;margin-bottom:8px;}
.sealed-t{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--gold-pale);}
.sealed .note{color:rgba(244,241,232,.6);margin-top:6px;}

.krow{display:grid;grid-template-columns:1fr 100px 100px 110px;gap:10px;align-items:center;
  padding:12px 6px;border-top:1px solid var(--hair);font-variant-numeric:tabular-nums;}
.krow.hd{border-top:0;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600;}
.krow>div{text-align:right;font-size:14px;color:var(--mut);}
.krow>div:first-child{text-align:left;color:var(--ink);font-size:14px;display:flex;flex-direction:column;gap:2px;}
.krow>div:first-child b{font-family:var(--serif);font-size:15px;}
.kd{font-size:11px;color:var(--faint);letter-spacing:.04em;}
.krow .kbal{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--navy);}
@media(max-width:560px){
  .krow{grid-template-columns:1fr auto;grid-template-areas:"name bal" "spend pp";row-gap:4px;}
  .krow.hd{display:none;}
  .krow>div:first-child{grid-area:name;}
  .krow>div:nth-child(2){grid-area:spend;text-align:left;font-size:13px;}
  .krow>div:nth-child(3){grid-area:pp;font-size:13px;}
  .krow .kbal{grid-area:bal;}
}
.ins{text-align:left;max-width:330px;margin:12px auto 6px;padding-left:22px;font-size:14px;line-height:1.85;color:var(--ink);}
.ins b{font-weight:700;}
.ins .ic{font-family:var(--mono);}
.ins-w{font-size:12px;color:var(--mut);max-width:360px;margin:6px auto 12px;line-height:1.5;}
.kitty{margin-top:30px;}
.kitty-in{border:1px solid var(--hair2);border-radius:4px;background:var(--card);
  box-shadow:inset 0 0 0 4px var(--card), inset 0 0 0 5px var(--gold-pale);
  padding:22px 20px;text-align:center;}
.kitty-t{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--navy);}
.kitty-s{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-top:5px;}
.kitty-btn{display:inline-block;margin-top:14px;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:700;text-decoration:none;color:var(--gold);
  border:1px solid var(--gold);border-radius:4px;padding:11px 22px;background:#fff;}
.kitty-btn:hover,.kitty-btn:focus{background:var(--gold-wash);}
.kitty-btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
.kitty-n{font-size:11px;color:var(--faint);margin-top:10px;}

/* share + publish */
.share-row{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap;}
.share-row .note{margin-top:0;}
details summary::-webkit-details-marker{color:var(--gold);}

/* captains, cement, scheme */
.capb{display:inline-block;font-family:var(--serif);font-weight:700;font-size:10px;color:#fff;
  background:var(--gold);border-radius:50%;width:16px;height:16px;line-height:16px;
  text-align:center;vertical-align:2px;letter-spacing:0;}
.pdiv{text-align:center;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  margin:12px 0 8px;display:flex;align-items:center;gap:10px;}
.pdiv::before,.pdiv::after{content:"";flex:1;height:1px;background:var(--hair);}
.pill.off{opacity:.42;cursor:default;}
.col-cap{font-family:var(--sans);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);font-weight:700;margin-top:4px;}
.col-cap.mutd{color:var(--faint);}
.scheme{margin-top:16px;}
.sch-row{font-size:13.5px;padding:4px 0;font-variant-numeric:tabular-nums;}
.sch-row b{font-family:var(--serif);font-size:16px;color:var(--navy);}

/* tour party setup */
.party{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pcol{background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:10px;min-height:120px;}
.col-h{font-family:var(--serif);font-weight:700;font-size:14px;text-align:center;
  padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--hair);}
.pill{display:flex;align-items:center;gap:8px;padding:9px 10px;margin-bottom:6px;
  border:1px dashed var(--hair2);border-radius:999px;cursor:pointer;background:#fff;
  color:var(--faint);user-select:none;-webkit-user-select:none;}
.pill .pl-nm{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pill .pl-h{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.pill .pl-h em{font-style:normal;font-size:9.5px;color:var(--faint);}
.pill.on{border-style:solid;color:var(--ink);}
.pill.on.p-red{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red);}
.pill.on.p-blue{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue);}
.pill .mv{border:none;background:var(--paper);color:var(--mut);border-radius:50%;
  width:26px;height:26px;cursor:pointer;font-size:13px;flex:none;}
.ringer{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.ringer input,.ringer select{font-size:14px;padding:9px 10px;border:1px solid var(--hair2);
  border-radius:4px;background:#fff;color:var(--ink);font-family:var(--sans);min-width:0;}
.ringer input:first-child{flex:1;min-width:140px;}
@media(max-width:520px){.party{grid-template-columns:1fr;}}

/* enter */
.panel{background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:16px;margin-bottom:16px;}
.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip-btn{font-family:var(--sans);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  border:1px solid var(--hair2);background:#fff;color:var(--mut);border-radius:4px;padding:8px 13px;cursor:pointer;}
.chip-btn.on{border-color:var(--gold);color:var(--gold);background:var(--gold-wash);}
.erow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--hair);}
.erow:first-of-type{border-top:0;}
.erow .en{flex:1;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;}
.erow .eh{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;}
.erow input{width:64px;font-size:17px;font-variant-numeric:tabular-nums;text-align:center;
  border:1px solid var(--hair2);border-radius:4px;padding:9px 4px;font-family:var(--sans);background:#fff;color:var(--ink);}
.erow input:focus{outline:2px solid var(--gold-pale);border-color:var(--gold);}
.mrow{padding:10px 0;border-top:1px solid var(--hair);}
.mrow:first-of-type{border-top:0;}
.mrow .who{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:7px;gap:8px;}
.btns{display:flex;gap:6px;flex-wrap:wrap;}
.rbtn{flex:1;min-width:64px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  border:1px solid var(--hair2);background:#fff;color:var(--mut);border-radius:4px;padding:10px 6px;cursor:pointer;}
.rbtn.sel-red{border-color:var(--red);color:#fff;background:var(--red);}
.rbtn.sel-blue{border-color:var(--blue);color:#fff;background:var(--blue);}
.rbtn.sel-h{border-color:var(--navy);color:#fff;background:var(--navy);}
.marg{display:flex;gap:6px;align-items:center;margin-top:7px;}
.marg select{font-size:13px;padding:7px;border:1px solid var(--hair2);border-radius:4px;background:#fff;color:var(--ink);}
.marg .ml{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);}
.save-bar{position:sticky;bottom:0;background:var(--paper);padding:12px 0;border-top:1px solid var(--hair2);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn-primary{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  background:var(--navy);color:#f4f1e8;border:none;border-radius:4px;padding:13px 22px;cursor:pointer;}
.btn-quiet{font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:1px solid var(--hair2);color:var(--mut);border-radius:4px;padding:11px 14px;cursor:pointer;}
.saved-note{font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
.empty{color:var(--faint);text-align:center;padding:30px 10px;font-family:var(--serif);font-style:italic;font-size:15px;}

@media(max-width:700px){
  .days{grid-template-columns:repeat(2,1fr);}
  .dy{border-left:0;border-top:1px solid var(--hair);}
  .dy:nth-child(-n+2){border-top:0;}
  .dy:nth-child(2n){border-left:1px solid var(--hair);}
  .grps{grid-template-columns:1fr;}
  .menu{grid-template-columns:1fr;gap:22px;}
  .quart{grid-template-columns:repeat(2,1fr);}
  .q:nth-child(3){border-left:0;}
  .row{grid-template-columns:32px 1fr auto;grid-template-areas:"pos name b3" "pos meta b3";row-gap:2px;padding:11px 4px;}
  .row.hd{display:none;}
  .c-pos{grid-area:pos;}
  .c-name{grid-area:name;}
  .c-b3{grid-area:b3;font-size:22px;align-self:center;}
  .c-rounds{grid-area:meta;font-size:11.5px;}
  .c-rec,.c-nett{display:none;}
  .crow{grid-template-columns:1fr 40px 46px 60px;}
  .crow>div:nth-child(5){display:none;}
}

      const cw=ttCareerWins(po[0],+prevY);
      A.push(["Defending Champion", names[po[0]], who(po[0]),
        best3(prevY,po[0])+" points last year · chasing title no. "+(cw+1),
        "Everyone smiles at him on the range. Nobody means it."]);
    }
    const sp=po[po.length-1];
    if (po.length>1 && ids.includes(sp))
      A.push(["Reigning Wooden Spoon", names[sp], who(sp),
        best3(prevY,sp)+" points last year · the title nobody defends on purpose",
        "The kitchen drawer awaits its rightful owner."]);
  }
  // bookies' favourite: career titles then best average finish
  const fav=ids.slice().sort((a,b)=>{
    const t=ttCareerWins(b,+y-1)-ttCareerWins(a,+y-1); if(t) return t;
    const av=i=>{const f=(C[i]&&C[i].finishes)||[]; return f.length?f.reduce((s,x2)=>s+x2.total,0)/f.length:0;};
    return av(b)-av(a); })[0];
  if (fav) A.push(["The Bookies’ Favourite", names[fav], who(fav),
    ttCareerWins(fav,+y-1)+" career titles",
    "The handicap committee has him under 24-hour surveillance."]);
  // captain v captain
  const cR=party.find(p=>p.captain&&p.team==="RED"), cB=party.find(p=>p.captain&&p.team==="BLUE");
  if (cR&&cB){
    let w=0,h=0,l=0;
    Object.keys(BASE).forEach(yy=>BASE[yy].matches.forEach(m=>m.singles.forEach(s=>{
      const pair=[s.red,s.blue];
      if (pair.includes(cR.id)&&pair.includes(cB.id)){
        const {w:ww}=decide(s); if(!ww)return;
        if (ww==="HALVED") h++;
        else { const win=ww==="RED"?s.red:s.blue; if(win===cR.id)w++; else l++; }
      }})));
    A.push(["Captain v Captain", esc(cR.name)+" v "+esc(cB.name), "who-plain",
      (w+h+l)?("Head-to-head: "+cR.name.split(" ").slice(-1)[0]+" "+w+"-"+h+"-"+l):"Never drawn together in the recorded era",
      "Two armbands. One dinner table. No survivors."]);
  }
  // grudge to watch: most-met cross-team pair in the party
  const meets={};
  Object.keys(BASE).forEach(yy=>BASE[yy].matches.forEach(m=>m.singles.forEach(s=>{
    if (ids.includes(s.red)&&ids.includes(s.blue)){
      const k=[s.red,s.blue].sort().join("|");
      const e=meets[k]=meets[k]||{n:0,a:0,b:0,h:0};
      e.n++;
      const {w:ww}=decide(s); if(!ww)return;
      if (ww==="HALVED")e.h++;
      else { const win=ww==="RED"?s.red:s.blue; if(win===k.split("|")[0])e.a++; else e.b++; }
    }})));
  const xteam=(a,b)=> (party.find(p=>p.id===a)||{}).team !== (party.find(p=>p.id===b)||{}).team;
  const grudges=Object.entries(meets).filter(([k])=>{const [a,b]=k.split("|");return xteam(a,b);})
    .sort((a,b)=>b[1].n-a[1].n);
  if (grudges.length){
    const [k,v]=grudges[0]; const [a,b]=k.split("|");
    A.push(["The Grudge Match We Demand", esc(snm(a))+" v "+esc(snm(b)), "who-plain",
      v.n+" career meetings · "+snm(a)+" leads "+v.a+"-"+v.h+"-"+v.b,
      "Chapter "+["","I","II","III","IV","V","VI","VII","VIII"][v.n+1]+". The hat owes us this one."]);
  }
  const fresh=[]; // never-met cross-team pairs
  party.filter(p=>p.team==="RED").forEach(r2=>party.filter(p=>p.team==="BLUE").forEach(b2=>{
    const k=[r2.id,b2.id].sort().join("|");
    if (!meets[k]) fresh.push([r2,b2]);
  }));
  if (fresh.length)
    A.push(["Strangers on the Tee", fresh.length+" pairings never drawn", "who-plain",
      "Including "+esc(fresh[0][0].name.split(" ").slice(-1)[0])+" v "+esc(fresh[0][1].name.split(" ").slice(-1)[0]),
      "Five years of golf and some of these men have never had the pleasure. The generator knows."]);
  // bandit alert: highest start hcp in party
  const bandit=party.slice().sort((a,b)=>(b.startHcp||0)-(a.startHcp||0))[0];
  if (bandit) A.push(["Pre-Tour Bandit Alert", bandit.name, who(bandit.id),
    "Arrives armed with "+bandit.startHcp+" shots",
    "Declare him at customs."]);
  // the drought: most tours, zero titles
  const past=i=>(C[i]?C[i].yrs.filter(yy=>+yy<+y).length:0);
  const dry=ids.filter(i=>ttCareerWins(i,+y-1)===0&&past(i)>0)
    .sort((a,b)=>past(b)-past(a))[0];
  if (dry){
    const extra = dry==="kevin-kiff" ? " (allegedly one — the inquiry continues)" : "";
    A.push(["The Drought", names[dry], who(dry),
      past(dry)+" tours · 0 titles"+extra,
      "Surely this year. (They said that last year.)"]);
  }
  // hot & cold: active singles streaks entering the tour
  function streak(i){
    const ms=(C[i]&&C[i].matches||[]).filter(m=>m.res);
    let k2=ms.length-1, r=null, n=0;
    while(k2>=0){ const x2=ms[k2].res; if(x2==="H")break; if(r===null)r=x2; if(ms[k2].res!==r)break; n++; k2--; }
    return {r,n};
  }
  const hot=ids.map(i=>({i,...streak(i)})).filter(s=>s.r==="W"&&s.n>=2).sort((a,b)=>b.n-a.n)[0];
  const cold=ids.map(i=>({i,...streak(i)})).filter(s=>s.r==="L"&&s.n>=2).sort((a,b)=>b.n-a.n)[0];
  if (hot) A.push(["Arrives in Form", names[hot.i], who(hot.i),
    hot.n+" singles wins on the spin", "Somebody check his bag for a second driver."]);
  if (cold) A.push(["Arrives in Pieces", names[cold.i], who(cold.i),
    cold.n+" singles defeats on the spin", "The physio can't help with what's wrong here."]);
  // rookies
  const rooks=party.filter(p=>p.ringer||!C[p.id]||!C[p.id].yrs.length);
  if (rooks.length)
    A.push(["The Unknown Quantity", rooks.map(p=>esc(p.name)).join(" &amp; "), "who-plain",
      "No recorded form whatsoever", "No data. No fear. No idea what's coming, in either direction."]);
  // the ninth star
  const pv=tallyAfter(+y-1);
  A.push(["Star Number "+(pv.BLUE+1), "Team Blue", "who-blue",
    pv.BLUE+"–"+pv.RED+" and holders — Red must take it off them",
    "The empire plans another jubilee. Red plan an uprising."]);
  return A;
}

/* ---------- awards ---------- */
function awards(y){
  const d = DATA[y];
  const ids = Object.keys(d.rounds);
  const done = ids.filter(i=>played(y,i).length>=1);
  if (!done.length) return (+y>=EDIT_FROM) ? previewAwards(y) : [];
  const A = [];
  const wd = {}; d.days.forEach(x=>wd[x.day]=x.weekday||("D"+x.day));
  const {ord, ranks} = ttRanks(y);
  const champ = ord[0], spoon = ord[ord.length-1], brides = ord[1];
  const full = tourComplete(y);

  const rec={}, bbbP={}, recd={};
  ids.forEach(i=>{rec[i]=[0,0,0]; bbbP[i]=0; recd[i]=0;});
  let bestWin=null, bigConcede=null;
  const meets={};
  for (const m of d.matches){
    const reds=m.singles.map(s=>s.red), blues=m.singles.map(s=>s.blue);
    for (const s of m.singles){
      const {w, note} = decide(s);
      if (!w) continue;
      const key=[s.red,s.blue].sort().join("|");
      (meets[key]=meets[key]||[]).push(m.day);
      if (w==="HALVED"){ rec[s.red][1]++; rec[s.blue][1]++; }
      else {
        const win = w==="RED"?s.red:s.blue, lose = w==="RED"?s.blue:s.red;
        rec[win][0]++; rec[lose][2]++;
        const up=Math.max(marginOf(s.result.red)??-1, marginOf(s.result.blue)??-1);
        const tp=Math.min(marginOf(s.result.red)??-1, marginOf(s.result.blue)??-1);
        if(!bestWin || up>bestWin.up || (up===bestWin.up && Math.max(tp,0)>Math.max(bestWin.tp,0)))
          bestWin={up,tp,win,lose,day:m.day,note};
      }
      const hr=dailyHcps(y,s.red)[m.day-1], hb=dailyHcps(y,s.blue)[m.day-1];
      if (typeof hr==="number" && typeof hb==="number"){
        const shots=Math.abs(hr-hb);
        const taker=hr>hb?s.red:s.blue, giver=hr>hb?s.blue:s.red;
        recd[taker]+=shots;
        if(!bigConcede || shots>bigConcede.shots){
          let out="match halved";
          if (w!=="HALVED"){ const wid=w==="RED"?s.red:s.blue;
            out=(wid===giver?"and still won ":"and still lost ")+note; }
          bigConcede={shots,giver,taker,day:m.day,out};
        }
      }
    }
    if (m.fourBBB){
      const w=m.fourBBB.winner;
      const winners = w==="RED"?reds : w==="BLUE"?blues : reds.concat(blues);
      new Set(winners).forEach(i=>bbbP[i]+= w==="HALVED"?.5:1);
    }
  }
  const sgl={}; ids.forEach(i=>sgl[i]=rec[i][0]+.5*rec[i][1]);
  const who = i=>"who-"+tmOf(y,i).toLowerCase();
  const rstr = i=>(d.rounds[i]||[]).map(x=>typeof x==="number"?x:"–").join(" · ");

  if (full){
    A.push(["The Wooden Spoon", nm(y,spoon), who(spoon),
      best3(y,spoon)+" points · last of "+ord.length,
      "Four days of graft. Zero sympathy at this table."]);
    A.push(["The Bridesmaid", nm(y,brides), who(brides),
      best3(y,brides)+" points · "+(best3(y,champ)-best3(y,brides))+" short of the trophy",
      "Always gives the speech. Never lifts the silverware."]);
  }
  let crash=null,surge=null;
  ids.forEach(i=>{ const r=d.rounds[i];
    for(let k=1;k<r.length;k++){ if(typeof r[k]==="number"&&typeof r[k-1]==="number"){
      const dl=r[k]-r[k-1];
      if(!crash||dl<crash.dl)crash={dl,i,k}; if(!surge||dl>surge.dl)surge={dl,i,k}; }}});
  if (crash && surge && crash.dl<0 && surge.dl>0){
    if (crash.i===surge.i)
      A.push(["The Jekyll &amp; Hyde", nm(y,crash.i), who(crash.i), "Rounds of "+rstr(crash.i),
        "Two entirely different golfers share this award. They have never been seen in the same room."]);
    else {
      A.push(["The Overnight Collapse", nm(y,crash.i), who(crash.i),
        d.rounds[crash.i][crash.k-1]+" then "+d.rounds[crash.i][crash.k]+" ("+(crash.dl>0?"+":"")+crash.dl+")",
        "Slept on a lead. Woke up without one."]);
      A.push(["The Lazarus", nm(y,surge.i), who(surge.i),
        d.rounds[surge.i][surge.k-1]+" to "+d.rounds[surge.i][surge.k]+" overnight (+"+surge.dl+")",
        "Reports of this golf game's death were greatly exaggerated."]);
    }
  }
  if (full){
    const cutId = ids.reduce((a,b)=> (dailyHcps(y,a)[0]-dailyHcps(y,a)[3]) >= (dailyHcps(y,b)[0]-dailyHcps(y,b)[3]) ? a : b);
    const c0=dailyHcps(y,cutId)[0], c3=dailyHcps(y,cutId)[3];
    if (c0>c3){
      let line="Cut from "+c0+" to "+c3+" in four days";
      if (cutId===champ) line+=" — and won the trophy";
      A.push(["Bandit Watch", nm(y,cutId), who(cutId), line, "The handicap committee will see you now. Bring a lawyer."]);
    }
  }
  if (bigConcede)
    A.push(["Most Generous Man in Golf", nm(y,bigConcede.giver), who(bigConcede.giver),
      "Gave "+sur(y,bigConcede.taker)+" "+bigConcede.shots+" shots on "+wd[bigConcede.day]+" — "+bigConcede.out,
      "Charity begins on the first tee."]);
  const odId = ids.reduce((a,b)=>recd[a]>=recd[b]?a:b);
  if (recd[odId]>0)
    A.push(["The Overdraft", nm(y,odId), who(odId),
      "Borrowed "+recd[odId]+" shots across the week — more than anyone on tour",
      "The Bank of "+(String(d.event.venue).includes("Saunton")?"Saunton":"Empordà")+" thanks you for your custom."]);
  if (full){
    const conId = ids.reduce((a,b)=>{ const sp=i=>Math.max(...played(y,i))-Math.min(...played(y,i));
      return sp(a)<=sp(b)?a:b; });
    const spv = Math.max(...played(y,conId))-Math.min(...played(y,conId));
    A.push(["Mr Consistent", nm(y,conId), who(conId),
      "Rounds of "+rstr(conId)+" — a spread of just "+spv, "Boring golf. Devastating results."]);
  }
  const asId = ids.reduce((a,b)=> (sgl[a]>sgl[b] || (sgl[a]===sgl[b]&&rec[a][0]>=rec[b][0])) ? a : b);
  if (sgl[asId]>0)
    A.push(["The Assassin", nm(y,asId), who(asId),
      "Singles record "+rec[asId].join("-"),
      "Shakes your hand on the 1st tee. Takes your point by the 15th."]);
  const paId = ids.reduce((a,b)=>(bbbP[a]-sgl[a])>=(bbbP[b]-sgl[b])?a:b);
  if (bbbP[paId]-sgl[paId]>=1)
    A.push(["The Passenger", nm(y,paId), who(paId),
      half(bbbP[paId])+" four-ball points against "+half(sgl[paId])+" singles",
      "Travelled the week first class, in the better-ball sedan chair."]);
  const tot={}; ids.forEach(i=>tot[i]=sgl[i]+bbbP[i]);
  const mvpMax=Math.max(...Object.values(tot));
  if (mvpMax>0){
    const mvps=ord.filter(i=>tot[i]===mvpMax);
    A.push(["Star Man", mvps.map(i=>esc(nm(y,i))).join(" &amp; "),
      new Set(mvps.map(i=>tmOf(y,i))).size===1?who(mvps[0]):"who-plain",
      half(mvpMax)+" points delivered for the team — no one gave more",
      "Somebody had to do the heavy lifting."]);
  }
  if (bestWin)
    A.push(["The Beatdown", nm(y,bestWin.win), who(bestWin.win),
      "Defeated "+sur(y,bestWin.lose)+" "+bestWin.note+" on "+wd[bestWin.day],
      "Over before the turn. Arguably over at breakfast."]);
  if (full){
    const suId = ids.reduce((a,b)=>{ const l=i=>{const r=d.rounds[i]; const v=r[r.length-1]; return typeof v==="number"?v:-1;};
      return l(a)>=l(b)?a:b; });
    const lastR = d.rounds[suId][d.rounds[suId].length-1];
    A.push(["Sunday Best", nm(y,suId), who(suId),
      lastR+" points in the final round — best on tour",
      "Peaked, magnificently, the moment it no longer mattered."]);
    const reps = Object.entries(meets).filter(([k,v])=>v.length>1);
    if (reps.length){
      const [k,v]=reps.sort((a,b)=>b[1].length-a[1].length)[0];
      const [a,b]=k.split("|");
      A.push(["Groundhog Day", esc(sur(y,a))+" v "+esc(sur(y,b)), "who-plain",
        "Drawn together "+v.length+" times (days "+v.join(", ")+")",
        "The hat has no memory. The players certainly do."]);
    } else {
      const n=d.matches.reduce((t,m)=>t+m.singles.length,0);
      A.push(["The Perfect Draw","The Hat","who-plain", n+" singles · no repeat pairing all week",
        "Fresh meat, every single morning. The hat gods smiled."]);
    }
    const cw = ttCareerWins(champ, +y);
    if (cw>1){
      const ordinal={2:"second",3:"third",4:"fourth",5:"fifth",6:"sixth"}[cw]||cw+"th";
      A.push(["The Serial Offender", nm(y,champ), who(champ),
        "Career Tourist Trophy no. "+cw,
        "His "+ordinal+" title. At this point it is simply showing off."]);
    }
    const dyn=tallyAfter(+y-1);
    A.push(["The Dynasty","Team Blue","who-blue",
      dyn.BLUE+"–"+dyn.RED+" in trophies since the tour began",
      "Tour "+(LEGACY.tourNumbering["2026"]||11)+" approaches. The empire shows no sign of falling."]);
  }
  return A;
}

/* ---------- views ---------- */
function vBoard(y){
  const d = DATA[y], ds = dayScores(y);
  const dnames=["","Day One","Day Two","Day Three","Day Four"];
  let cum_r=0, cum_b=0, cells="";
  d.days.forEach(x=>{
    const s=ds.days[x.day]; cum_r+=s.RED; cum_b+=s.BLUE;
    const w = s.BLUE>s.RED?"BLUE":(s.RED>s.BLUE?"RED":(s.RED?"HALVED":"NONE"));
    const wt = {"RED":"Red day","BLUE":"Blue day","HALVED":"Halved","NONE":"—"}[w];
    cells+='<div class="dy"><div class="dy-n">'+dnames[x.day]+'</div>'
      +'<div class="dy-m">'+esc((x.weekday||"")+" · "+cName(x.course))+'</div>'
      +'<div class="dy-s"><span class="t-r">'+half(s.RED)+'</span><span class="dy-dash">–</span><span class="t-b">'+half(s.BLUE)+'</span></div>'
      +'<div class="dy-w w-'+w.toLowerCase()+'">'+wt+'</div>'
      +'<div class="dy-c">after '+half(cum_r)+"–"+half(cum_b)+'</div></div>';
  });
  const total = ds.red+ds.blue;
  const max = d.days.length * (d.matches.length ? (d.matches.reduce((t,m)=>t+m.singles.length,0)/d.days.length + d.matches.filter(m=>m.fourBBB!==null||m.format==="4ball").length/d.days.length) : 10);
  let verdict="", sub="";
  if (total>0){
    if (ds.red===ds.blue){ const h=(d.event.holdersBefore||"BLUE");
      verdict=(h==="BLUE"?"Blues":"Reds")+" retain the trophy"; }
    else verdict=(ds.blue>ds.red?"Blue":"Red")+" win the trophy";
    sub = total? "" : "";
  } else verdict="Awaiting first blood";
  const t = LEGACY.trophyTally;
  const halfHTML = v => { const w0=Math.trunc(v); const f=Math.abs(v-w0)>=.25;
    return ((w0||!f)?w0:"")+(f?'<span class="fr">½</span>':""); };
  const tal = tallyAfter(y);                                  // trophies as they stood that year
  const capR=d.players.find(p=>p.captain&&p.team==="RED"), capB=d.players.find(p=>p.captain&&p.team==="BLUE");
  const capN = p => p ? '<span class="plq-capn"><span class="capb">C</span> '+esc(p.name)+'</span>' : "";
  const dr = (function(){
    const dd=d.days.filter(x=>x.date);
    if (dd.length<2) return "";
    const f=new Date(dd[0].date), l=new Date(dd[dd.length-1].date);
    const ord=n2=>n2+(n2%10===1&&n2%100!==11?"st":n2%10===2&&n2%100!==12?"nd":n2%10===3&&n2%100!==13?"rd":"th");
    const M=["January","February","March","April","May","June","July","August","September","October","November","December"];
    if (f.getMonth()===l.getMonth()) return ord(f.getDate())+"–"+ord(l.getDate())+" "+M[f.getMonth()]+" "+f.getFullYear();
    return ord(f.getDate())+" "+M[f.getMonth()]+" – "+ord(l.getDate())+" "+M[l.getMonth()]+" "+f.getFullYear();
  })();
  return '<header class="mast"><div class="kicker">'+esc(d.event.venue)+'</div>'
    +'<h1>Not the Ryder Cup</h1>'
    +'<div class="mast-rule"><span></span><em>'+y+'</em><span></span></div>'
    +'<div class="subtitle">'+(dr?dr+' · ':'')+'Tour '+ (LEGACY.tourNumbering[y]|| (+y-2015)) +' · Trophies: Blue '+tal.BLUE+' · Red '+tal.RED+'</div></header>'
    +'<section class="plaque"><div class="plq-in"><div class="plq-label">'+(total?"Score":"Scoreboard")+'</div>'
    +'<div class="plq-row">'
    +'<span class="plq-team plq-red">'+capN(capR)+'Red<span class="plq-stars">'+"★".repeat(tal.RED)+'</span></span>'
    +'<span class="plq-score"><b>'+halfHTML(ds.red)+'</b><i>–</i><b>'+halfHTML(ds.blue)+'</b></span>'
    +'<span class="plq-team plq-blue">'+capN(capB)+'Blue<span class="plq-stars">'+"★".repeat(tal.BLUE)+'</span></span>'
    +'</div>'
    +'<div class="plq-verdict">'+esc(verdict)+'</div>'
    +'</div></section>'
    +'<section class="days">'+cells+'</section>'
    +'<div class="share-row"><button class="btn-primary" onclick="shareFull()">Share full report — every tab</button>'
    +'<button class="btn-quiet" onclick="shareBoard()">Board only</button>'
    +'<span class="note" id="shareStatus"></span></div>'
    +installPanel();
}
function vMatch(y){
  const d=DATA[y], ds=dayScores(y);
  const dnames=["","Day One","Day Two","Day Three","Day Four"];
  let out='<h2 class="sec-t">Match Play</h2><div class="sec-s">'+esc(d.event.venue)+' · '+y+'</div>';
  if (!READONLY && d.matches.length){
    const vis=d.days.filter(x=>{const r=revealAt(y,x.day); return !r || new Date()>=r;}).map(x=>x.day);
    const nxt=d.days.find(x=>{const r=revealAt(y,x.day); return r && new Date()<r;});
    out+='<div class="sec-s" style="margin-top:-12px">👁 Team can see: '
      +(vis.length?"day "+vis.join(", "):"nothing yet")
      +(nxt?' · day '+nxt.day+' reveals '+esc(fmtWhen(revealAt(y,nxt.day))):' · all revealed')+'</div>';
  }
  d.days.forEach(x=>{
    const s=ds.days[x.day];
    const w=s.BLUE>s.RED?"blue":(s.RED>s.BLUE?"red":(s.RED?"halved":"none"));
    const wt=s.RED||s.BLUE ? ((w==="halved"?"Halved":(w.charAt(0).toUpperCase()+w.slice(1)+" day"))+", "+half(s.RED)+"–"+half(s.BLUE)) : "Not played";
    let groups="";
    d.matches.filter(m=>m.day===x.day).forEach(m=>{
      let lines="";
      m.singles.forEach(s2=>{
        const {w:ww, note}=decide(s2);
        const rcls = ww==="RED"?"nm win t-r":(ww==="HALVED"?"nm":(ww?"nm lose":"nm"));
        const bcls = ww==="BLUE"?"nm win t-b":(ww==="HALVED"?"nm":(ww?"nm lose":"nm"));
        const ncls = ww==="RED"?"sc-note t-r":(ww==="BLUE"?"sc-note t-b":(ww==="HALVED"?"sc-note sc-halved":"sc-note sc-tbd"));
        lines+='<div class="sgl"><span class="'+rcls+'">'+esc(nm(y,s2.red))+'</span>'
          +'<span class="'+ncls+'">'+(ww?esc(note):"v")+'</span>'
          +'<span class="'+bcls+'">'+esc(nm(y,s2.blue))+'</span></div>';
      });
      let bonus="";

function vTrophy(y){
  const d=DATA[y];
  const {ord, ranks, tie} = ttRanks(y);
  const any = ord.some(i=>played(y,i).length);
  if (!any) return '<h2 class="sec-t">The Tourist Trophy</h2><div class="empty">No rounds entered yet — the trophy awaits.</div>';
  const rec={}; ord.forEach(i=>rec[i]=[0,0,0]);
  DATA[y].matches.forEach(m=>m.singles.forEach(s=>{
    const {w}=decide(s); if(!w)return;
    if(w==="HALVED"){rec[s.red][1]++;rec[s.blue][1]++;}
    else { const win=w==="RED"?s.red:s.blue, lose=w==="RED"?s.blue:s.red; rec[win][0]++; rec[lose][2]++; }
  }));
  const full = tourComplete(y);
  let rows="";
  ord.forEach(i=>{
    const pos=ranks[i], tpos=(tie[pos]>1?"T":"")+pos;
    const r=d.rounds[i]||[];
    const pFull = played(y,i).length===d.days.length;      // only a completed card drops a round
    const mn = pFull ? Math.min(...played(y,i)) : null;
    let used=false;
    const rds=r.map(v=>{
      if (typeof v!=="number") return "–";
      if (pFull && !used && v===mn){ used=true; return "<s>"+v+"</s>"; }
      return v;
    }).join(" · ");
    const b3=best3(y,i), nett=nettOf(y,i);
    const stars = ttCareerWins(i, +y);
    let cls="row", tag="";
    if (i===ord[0] && full){ cls+=" champ"; tag='<span class="rtag rtag-gold">Champion</span>'; }
    else if (i===ord[ord.length-1] && full) tag='<span class="rtag rtag-mute">Wooden spoon</span>';

      +'<div class="c-name"><span class="c-team c-'+tmOf(y,i).toLowerCase()+'"></span>'+esc(nm(y,i))+capBadge(y,i)+starStr(stars)+tag+'</div>'

let curPlayer = "justin-lawrence";
function careerOf(pid){
  const yrs = Object.keys(DATA).sort().filter(y=>DATA[y].players.some(p=>p.id===pid));
  const C = { yrs, teams:[], rounds:[], matches:[], partners:{}, twoBalls:0,
              bbb:0, given:0, received:0, byDay:{}, byCourse:{}, finishes:[] };
  yrs.forEach(y=>{
    const d=DATA[y];
    C.teams.push(d.players.find(p=>p.id===pid).team);
    const courses={}; d.days.forEach(x=>courses[x.day]=(x.course||"").split(",")[0].trim());
    (d.rounds[pid]||[]).forEach((s,k)=>{
      if (typeof s!=="number") return;
      const h=dailyHcps(y,pid)[k];
      C.rounds.push({y, day:k+1, s, h, course:courses[k+1]||""});
      (C.byDay[k+1]=C.byDay[k+1]||[]).push(s);
      const cn=courses[k+1]||"?"; (C.byCourse[cn]=C.byCourse[cn]||[]).push(s);
    });
    d.matches.forEach(m=>{
      const mine=m.singles.find(s2=>s2.red===pid||s2.blue===pid);
      if (!mine) return;
      const iAmRed = mine.red===pid;
      const opp = iAmRed?mine.blue:mine.red;
      const {w, note} = decide(mine);
      let res=null;
      if (w==="HALVED") res="H";
      else if (w) res = (w==="RED")===iAmRed ? "W" : "L";
      const hMe=dailyHcps(y,pid)[m.day-1], hOp=dailyHcps(y,opp)[m.day-1];
      let shots=0, giving=false;
      if (typeof hMe==="number" && typeof hOp==="number"){
        shots=Math.abs(hMe-hOp); giving = hMe<hOp;
        if (giving) C.given+=shots; else C.received+=shots;
      }
      C.matches.push({y, day:m.day, opp, res, note, shots, giving});
      if (m.format==="4ball" && m.singles.length===2){
        const other=m.singles.find(s2=>s2!==mine);
        const partner = iAmRed?other.red:other.blue;
        const pr = C.partners[partner]=C.partners[partner]||{w:0,h:0,l:0,n:0};
        if (m.fourBBB){
          pr.n++;
          const bw=m.fourBBB.winner;
          const myTeam = iAmRed?"RED":"BLUE";
          if (bw==="HALVED") pr.h++;
          else if (bw===myTeam){ pr.w++; C.bbb+=1; }
          else pr.l++;
          if (bw==="HALVED") C.bbb+=.5;
        }
      }
      if (m.format==="2ball") C.twoBalls++;
    });
    const {ord}=ttRanks(y);
    const full = (d.rounds[pid]||[]).filter(x=>typeof x==="number").length===d.days.length;
    if (full) C.finishes.push({y, pos:ord.indexOf(pid)+1, of:ord.length, total:best3(y,pid)});
  });
  return C;
}

      +'<div class="pp-picker">'+groups[t].map(([id,o])=>
        '<button class="pp-pill '+cls+(id===curPlayer?" on":"")+'" onclick="setPlayer(\''+id+'\')"'
        +' title="'+esc(o.name)+(o.teams.size>1?" · has worn both colours":"")+'">'
        +esc(label(o))+(o.teams.size>1?'<span class="sw">\u21C4</span>':"")+'</button>').join("")+'</div></div>';
  };
  const picker = groupHTML("RED")+groupHTML("BLUE");
  const pid=curPlayer, name=(pool[pid]||{}).name||pid;
  const C=careerOf(pid);
  const stars=ttCareerWins(pid, 2099);
  const leg=(LEGACY.careerTouristTrophyWins||{})[pid];
  if (!C.rounds.length)
    return '<h2 class="sec-t">Player Dossiers</h2><div class="pp-picker">'+picker+'</div>'
      +'<div class="empty">'+esc(name)+' — no recorded form. An unknown quantity. Frankly, dangerous.</div>';

  const w=C.matches.filter(m=>m.res==="W").length, h=C.matches.filter(m=>m.res==="H").length, l=C.matches.filter(m=>m.res==="L").length;
  const pct = (w+h+l) ? Math.round(100*(w+.5*h)/(w+h+l)) : 0;
  const spoons=C.finishes.filter(f=>f.pos===f.of).length;
  const brides=C.finishes.filter(f=>f.pos===2).length;
  const bestFin=C.finishes.length?C.finishes.reduce((a,b)=>b.pos<a.pos?b:a):null;

  const bestR=C.rounds.reduce((a,b)=>b.s>a.s?b:a);
  const worstR=C.rounds.reduce((a,b)=>b.s<a.s?b:a);
  const avg=Math.round(10*C.rounds.reduce((t,r)=>t+r.s,0)/C.rounds.length)/10;
  const to36=C.rounds.filter(r=>r.s>=36).length;
  const bestTour=C.finishes.length?C.finishes.reduce((a,b)=>b.total>a.total?b:a):null;

  const hcps=C.rounds.map(r=>r.h).filter(x=>typeof x==="number");
  const loH=Math.min(...hcps), hiH=Math.max(...hcps);
  let cut=null, rise=null, odo=0;
  Object.keys(DATA).sort().forEach(y=>{
    if(!DATA[y].players.some(p=>p.id===pid))return;
    const dh=dailyHcps(y,pid);
    for(let k=1;k<dh.length;k++){
      if(typeof dh[k]!=="number"||typeof dh[k-1]!=="number")continue;
      const dl=dh[k]-dh[k-1]; odo+=Math.abs(dl);
      if(!cut||dl<cut.dl)cut={dl,y,day:k+1};
      if(!rise||dl>rise.dl)rise={dl,y,day:k+1};
    }});
  const carry=carryInfo(pid);

  const oppAgg={};
  C.matches.forEach(m=>{ if(!m.res)return;
    const o=oppAgg[m.opp]=oppAgg[m.opp]||{w:0,h:0,l:0,n:0};
    o.n++; if(m.res==="W")o.w++; else if(m.res==="H")o.h++; else o.l++; });
  const names={}; Object.keys(DATA).forEach(y=>DATA[y].players.forEach(p=>names[p.id]=p.name));
  const nem = Object.entries(oppAgg).filter(([,o])=>o.n>=2).sort((a,b)=> (b[1].l-b[1].w)-(a[1].l-a[1].w) || b[1].n-a[1].n)[0];
  const bun = Object.entries(oppAgg).filter(([,o])=>o.n>=2).sort((a,b)=> (b[1].w-b[1].l)-(a[1].w-a[1].l) || b[1].n-a[1].n)[0];
  const bigWin = C.matches.filter(m=>m.res==="W"&&m.note&&m.note!=="A/S").sort((a,b)=>{
    const v=x=>{const mm=x.note.match(/^(\d+)(?:&(\d+))?/); return mm?[+mm[1],+(mm[2]||0)]:[0,0];};
    const [au,at]=v(a),[bu,bt]=v(b); return bu-au||bt-at; })[0];
  const bigLoss = C.matches.filter(m=>m.res==="L"&&m.note&&m.note!=="A/S").sort((a,b)=>{
    const v=x=>{const mm=x.note.match(/^(\d+)(?:&(\d+))?/); return mm?[+mm[1],+(mm[2]||0)]:[0,0];};
    const [au,at]=v(a),[bu,bt]=v(b); return bu-au||bt-at; })[0];
  const maxGive=C.matches.filter(m=>m.giving).sort((a,b)=>b.shots-a.shots)[0];
  const maxTake=C.matches.filter(m=>!m.giving&&m.shots>0).sort((a,b)=>b.shots-a.shots)[0];

  let curW=0,maxW=0,curL=0,maxL=0;
  C.matches.forEach(m=>{ if(!m.res)return;
    if(m.res==="W"){curW++;curL=0;} else if(m.res==="L"){curL++;curW=0;} else {curW=0;curL=0;}
    maxW=Math.max(maxW,curW); maxL=Math.max(maxL,curL); });

  const dayAvg=Object.entries(C.byDay).map(([d2,v])=>[d2, v.reduce((a,b)=>a+b,0)/v.length]);
  const bestDay=dayAvg.slice().sort((a,b)=>b[1]-a[1])[0];
  const worstDay=dayAvg.slice().sort((a,b)=>a[1]-b[1])[0];
  const courseAvg=Object.entries(C.byCourse).filter(([c])=>c&&c!=="?").map(([c,v])=>[c, v.reduce((a,b)=>a+b,0)/v.length]);
  const bestCourse=courseAvg.slice().sort((a,b)=>b[1]-a[1])[0];
  const partBest=Object.entries(C.partners).filter(([,p])=>p.n>=2).sort((a,b)=>(b[1].w/b[1].n)-(a[1].w/a[1].n))[0];
  const partWorst=Object.entries(C.partners).filter(([,p])=>p.n>=2).sort((a,b)=>(a[1].w/a[1].n)-(b[1].w/b[1].n))[0];
  const dayNames={1:"Day One",2:"Day Two",3:"Day Three",4:"Day Four"};
  const sw = (typeof odo==="number") ? odo : 0;
  const teamSet=[...new Set(C.teams)];
  const net=C.given-C.received;

  function srow(label,val,note){
    return '<div class="srow"><span class="sl">'+label+'</span><span class="sv">'+val+'</span>'
      +(note?'<span class="sn">'+note+'</span>':"")+'</div>';
  }
  function secHead(t,s){ return '<div class="sec"><h2 class="sec-t">'+t+'</h2>'+(s?'<div class="sec-s">'+s+'</div>':'<div style="height:14px"></div>'); }

  const capNow = CAPTAINS.RED===pid ? "RED" : (CAPTAINS.BLUE===pid ? "BLUE" : null);
  const capPast = Object.keys(DATA).sort().filter(y=>+y<EDIT_FROM && (DATA[y].players.find(p=>p.id===pid)||{}).captain);
  let capLine="";
  if (capNow) capLine=' · <b>Captain of the '+(capNow==="RED"?"Reds":"Blues")+', '+NEXT+'</b> — wears the armband, carries the blame'
    +(capPast.length?' (previous spell: '+capPast.join(", ")+')':"");
  else if (capPast.length) capLine=' · former captain ('+capPast.join(", ")+') — relieved of command';
  let out='<h2 class="sec-t">Player Dossiers</h2>'
    +'<div class="sec-s">the full charge sheet, one tourist at a time</div>'
    +picker
    +'<header class="mast" style="margin-top:10px"><h1 style="font-size:clamp(26px,5vw,40px)">'+(capNow?'<span class="capb">C</span> ':"")+esc(name)+starStr(stars)+'</h1>'
    +'<div class="subtitle">'+C.yrs.join(" · ")+' · '+(teamSet.length>1?"⇄ both colours worn — loyalty negotiable":teamSet[0].charAt(0)+teamSet[0].slice(1).toLowerCase()+" loyalist")
    +(leg&&leg.pre2021?' · '+leg.pre2021+' pre-2021 title'+(leg.pre2021>1?'s':'')+' on the books':'')
    +capLine+'</div></header>'
    +'<div class="quart" style="margin-top:18px">'
    +'<div class="q"><div class="q-n">'+C.yrs.length+'</div><div class="q-l">Tours<br>played</div></div>'
    +'<div class="q"><div class="q-n">'+w+'-'+h+'-'+l+'</div><div class="q-l">Career singles<br>'+pct+'% won</div></div>'
    +'<div class="q"><div class="q-n">'+stars+'</div><div class="q-l">Tourist Trophy<br>titles</div></div>'
    +'<div class="q"><div class="q-n">'+spoons+'</div><div class="q-l">Wooden<br>spoon'+(spoons===1?"":"s")+'</div></div>'
    +'</div>';

  out+=secHead("Scoring","stableford, career");
  out+='<div class="lb">'
    +srow("Best round", bestR.s, dayNames[bestR.day]+" "+bestR.y+(bestR.course?" · "+esc(bestR.course):""))
    +srow("Worst round", worstR.s, dayNames[worstR.day]+" "+worstR.y+" — a day best forgotten")
    +srow("Career average", avg, C.rounds.length+" rounds recorded")
    +srow("Played to handicap or better", to36+" of "+C.rounds.length, Math.round(100*to36/C.rounds.length)+"% — the committee is watching")
    +(bestTour?srow("Best tour", bestTour.total+" ("+bestTour.y+")", "finished "+bestTour.pos+(bestTour.pos===1?"st — champion":bestTour.pos===2?"nd":bestTour.pos===3?"rd":"th")):"")
    +(bestFin?srow("Best Trophy finish", bestFin.pos===1?"Champion":"#"+bestFin.pos, bestFin.y+(brides?" · bridesmaid ×"+brides:"")):"")
    +'</div></div>';

  out+=secHead("The Handicap Rap Sheet","what the nightly algorithm has done to this man");
  out+='<div class="lb">'
    +srow("Lowest playing handicap", loH, "peak fitness")
    +srow("Highest playing handicap", hiH, hiH-loH>=10?"a different sport entirely":"")
    +(cut&&cut.dl<0?srow("Harshest overnight cut", cut.dl, dayNames[cut.day]+" "+cut.y+" — punished for playing well"):"")
    +(rise&&rise.dl>0?srow("Kindest overnight gift", "+"+rise.dl, dayNames[rise.day]+" "+rise.y+" — rewarded for failure"):"")
    +srow("The Odometer", sw+" shots", "total handicap moved, career — the algorithm never sleeps")
    +(carry?srow("Carries into "+NEXT, carry.hcp, "from "+carry.year+(carry.raw!==carry.hcp?" (raw "+carry.raw+")":"")):"")
    +'</div></div>';

  out+=secHead("Match Play","singles, career");
  out+='<div class="lb">'
    +(bigWin?srow("Biggest win", esc(bigWin.note), "v "+esc((names[bigWin.opp]||bigWin.opp).split(" ").slice(-1)[0])+", "+bigWin.y):"")
    +(bigLoss?srow("Heaviest defeat", esc(bigLoss.note), "v "+esc((names[bigLoss.opp]||bigLoss.opp).split(" ").slice(-1)[0])+", "+bigLoss.y+" — still not spoken of"):"")
    +srow("Longest win streak", maxW||"–", maxW>=3?"a genuine hot streak":"")
    +srow("Longest losing streak", maxL||"–", maxL>=3?"character-building stuff":"")
    +srow("2-ball duty", C.twoBalls+" time"+(C.twoBalls===1?"":"s"), "sent out alone, no partner to blame")
    +'</div></div>';

  out+=secHead("The Shots Ledger","strokes given and received, career");
  out+='<div class="lb">'
    +srow("Shots given", C.given, "")
    +srow("Shots received", C.received, "")
    +srow(net>=0?"Net philanthropist":"Net beneficiary", Math.abs(net), net>=0?"the tour thanks its sponsor":"living comfortably off the field")
    +(maxGive?srow("Most given in one match", maxGive.shots, "v "+esc((names[maxGive.opp]||"").split(" ").slice(-1)[0])+", "+maxGive.y+" — "+(maxGive.res==="W"?"and STILL won":maxGive.res==="L"?"and duly lost":"halved, somehow")):"")
    +(maxTake?srow("Most received in one match", maxTake.shots, "v "+esc((names[maxTake.opp]||"").split(" ").slice(-1)[0])+", "+maxTake.y+" — "+(maxTake.res==="W"?"and cashed them in":maxTake.res==="L"?"and lost anyway, which takes talent":"halved")):"")
    +'</div></div>';

  out+=secHead("Company Kept","who to avoid at the draw");
  out+='<div class="lb">'
    +(nem&&nem[1].l>nem[1].w?srow("Nemesis", esc(names[nem[0]]||nem[0]), nem[1].w+"-"+nem[1].h+"-"+nem[1].l+" against — crosses the street to avoid him"):srow("Nemesis","none found","nobody owns this man. Yet."))
    +(bun&&bun[1].w>bun[1].l?srow("The Bunny", esc(names[bun[0]]||bun[0]), bun[1].w+"-"+bun[1].h+"-"+bun[1].l+" in his favour — sends a Christmas card every year"):"")
    +(partBest?srow("Best partner", esc(names[partBest[0]]||partBest[0]), partBest[1].w+" of "+partBest[1].n+" four-ball bonuses together"):"")
    +(partWorst&&partBest&&partWorst[0]!==partBest[0]?srow("Partner to dodge", esc(names[partWorst[0]]||partWorst[0]), partWorst[1].w+" of "+partWorst[1].n+" together — the sedan chair has two seats"):"")
    +'</div></div>';

  out+=secHead("Patterns","habits the data refuses to hide");
  out+='<div class="lb">'
    +(bestDay?srow("Best day of the tour", dayNames[bestDay[0]], "averages "+(Math.round(10*bestDay[1])/10)):"")
    +(worstDay&&worstDay[0]!==bestDay[0]?srow("Worst day of the tour", dayNames[worstDay[0]], "averages "+(Math.round(10*worstDay[1])/10)+" — book the physio"):"")
    +(bestCourse?srow("Happiest course", esc(bestCourse[0]), "averages "+(Math.round(10*bestCourse[1])/10)):"")
    +srow("Four-ball bonus points", half(C.bbb), "career")
    +'</div></div>';
  return out;
}
window.setPlayer = id => { curPlayer=id; render(); };

/* ---------- tour party setup (always targets the upcoming tour) ---------- */
const NEXT = String(EDIT_FROM);
const CAPTAINS = { RED:"chris-wright", BLUE:"kevin-kiff" };   // 2026: Wright leads Red, Kiff leads Blue
const DAYS2026 = [   // Thu 1st – Sun 4th October 2026; course order TBC (Justin to confirm)
  {day:1,date:"2026-10-01",weekday:"Thu"},{day:2,date:"2026-10-02",weekday:"Fri"},
  {day:3,date:"2026-10-03",weekday:"Sat"},{day:4,date:"2026-10-04",weekday:"Sun"}];
function applyCaptains(d){
  d.players.forEach(p=>{ if (CAPTAINS[p.team]===p.id) p.captain=true; else delete p.captain; });
}
function applyDates(d){
  d.days.forEach((x,k)=>{ const t=DAYS2026[k]; if (t){ x.date=t.date; x.weekday=t.weekday; }
    if (!d.courseOrderConfirmed) x.course=null; });
}
if (DATA[NEXT]) { applyCaptains(DATA[NEXT]); applyDates(DATA[NEXT]); }
function carryInfo(id){
  for (const y of Object.keys(BASE).sort().reverse()){
    if (!BASE[y].rounds[id]) continue;
    const dh = dailyHcps(y, id);
    const s = BASE[y].rounds[id];
    const vals = [];
    for (let k=0;k<s.length;k++)
      if (typeof s[k]==="number" && typeof dh[k]==="number") vals.push(dh[k] + 36 - s[k]);
    if (!vals.length) continue;
    const raw = vals.reduce((a,b)=>a+b,0)/vals.length;
    return {hcp: Math.round(raw), raw: Math.round(raw*100)/100, year: y};
  }
  return null;
}
function candidatePool(){
  const pool = {};
  for (const y of Object.keys(BASE).sort()){
    BASE[y].players.forEach(p=>{
      pool[p.id] = {id:p.id, name:p.name, usual:p.team, last:y};
    });
  }
  Object.values(pool).forEach(c=>{ c.carry = carryInfo(c.id); });
  if (DATA[NEXT]) DATA[NEXT].players.forEach(p=>{
    if (!pool[p.id]) pool[p.id] = {id:p.id, name:p.name, usual:p.team, last:null, carry:null, ringer:true};
  });
  return pool;
}
function ensureNext(){
  if (DATA[NEXT]) return DATA[NEXT];
  const scaffold = { schemaVersion:1, year:+NEXT,
    event:{name:"Not the Ryder Cup", venue:"Empordà Golf Resort", holdersBefore:"BLUE"},
    courses:{},
    days:DAYS2026.map(t=>({day:t.day,date:t.date,weekday:t.weekday,course:null})),
    players:[], rounds:{}, matches:[] };
  DATA[NEXT]=scaffold; override[NEXT]=scaffold;
  localStorage.setItem(LS, JSON.stringify(override));
  return scaffold;
}
function persistNext(){ applyCaptains(DATA[NEXT]); override[NEXT]=DATA[NEXT]; localStorage.setItem(LS, JSON.stringify(override)); }
window.setupCement = () => {
  const d=DATA[NEXT]; if(!d||!d.players.length||drawLocked(NEXT)) return;
  d.partyLocked=!d.partyLocked;
  persistNext(); render();
};
function fixtureGuard(){
  const d=DATA[NEXT];
  if (d && d.matches.length){
    if (!confirm("This changes the tour party — the current draw will be cleared (scores kept). Continue?")) return false;
    d.matches=[];
  }
  return true;
}
window.setupToggle = id => {
  if (DATA[NEXT] && (DATA[NEXT].partyLocked || drawLocked(NEXT))) return;
  const d=ensureNext();
  const ix=d.players.findIndex(p=>p.id===id);
  if (ix>=0){
    const hasScores=(d.rounds[id]||[]).some(x=>typeof x==="number");
    if (hasScores && !confirm("Remove "+d.players[ix].name+"? Their entered scores will be lost.")) return;
    if (!fixtureGuard()) return;
    d.players.splice(ix,1); delete d.rounds[id];
  } else {
    if (!fixtureGuard()) return;
    const c=candidatePool()[id];
    d.players.push({id, name:c.name, team:c.usual, startHcp:c.carry?c.carry.hcp:18});
    d.rounds[id]=[null,null,null,null];
  }
  persistNext(); render();
};
window.setupMove = id => {
  const d=DATA[NEXT]; if(!d||d.partyLocked||drawLocked(NEXT)) return;
  const p=d.players.find(x=>x.id===id); if(!p) return;
  if (!fixtureGuard()) return;
  p.team = p.team==="RED"?"BLUE":"RED";
  persistNext(); render();
};
window.setupDrop = (team,ev) => {
  ev.preventDefault();
  const id=ev.dataTransfer.getData("text/plain");
  const d=DATA[NEXT]; if(!d||d.partyLocked||drawLocked(NEXT)) return;
  const p=d.players.find(x=>x.id===id);
  if (p && p.team!==team){ if(!fixtureGuard()) return; p.team=team; persistNext(); render(); }
};
window.setupDrag = (id,ev) => { ev.dataTransfer.setData("text/plain", id); };
window.setupRinger = () => {
  if (DATA[NEXT] && (DATA[NEXT].partyLocked || drawLocked(NEXT))) return;
  const nameEl=document.getElementById("rgName"), hcpEl=document.getElementById("rgHcp"), teamEl=document.getElementById("rgTeam");
  const name=(nameEl.value||"").trim();
  const hcp=parseInt(hcpEl.value);
  if (!name || isNaN(hcp)){ alert("Ringer needs a name and a handicap."); return; }
  const d=ensureNext();
  const id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  if (d.players.some(p=>p.id===id)){ alert("Already in the party."); return; }
  if (!fixtureGuard()) return;
  d.players.push({id, name, team:teamEl.value, startHcp:Math.max(0,Math.min(54,hcp)), ringer:true});
  d.rounds[id]=[null,null,null,null];
  persistNext(); render();
};
function schemePanel(d){
  const n=d?d.players.length:0;
  if (!n) return "";
  const nr=d.players.filter(p=>p.team==="RED").length, nb=n-nr;
  if (nr!==nb)
    return '<div class="panel scheme"><div class="sec-s" style="margin:2px 0 8px">The Play Scheme</div>'
      +'<div class="note"><b>Teams uneven ('+nr+' v '+nb+')</b> — even them up (or we agree the ghost rule) before the scheme settles.</div></div>';
  const perTeam=nr, fb=Math.floor(perTeam/2), two=perTeam%2;
  const pts=perTeam+fb, total=pts*4;
  return '<div class="panel scheme"><div class="sec-s" style="margin:2px 0 8px">The Play Scheme — '+n+' players</div>'
    +'<div class="sch-row"><b>'+perTeam+'</b> singles matches a day'+(two?' — including one 2-ball (singles only)':'')+'</div>'
    +'<div class="sch-row"><b>'+fb+'</b> four-ball bonus points a day</div>'
    +'<div class="sch-row"><b>'+pts+'</b> points a day · <b>'+total+'</b> for the week · level at the end — holders retain</div>'
    +(two?'<div class="note">The 2-ball needs no bonus point: both teams share it equally every day, so red-v-blue stays fair. The draw rotates who gets 2-ball duty.</div>':"")
    +'</div>';
}
function vSetup(){
  const pool=candidatePool();
  const d=DATA[NEXT];
  const locked=!!(d&&(d.partyLocked||drawLocked(NEXT)));
  const underway=drawLocked(NEXT);
  const sel={}; if (d) d.players.forEach(p=>sel[p.id]=p);
  const cols={RED:[],BLUE:[]};
  Object.values(pool).sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>{
    const cur=sel[c.id];
    const team=cur?cur.team:c.usual;
    cols[team].push({c,cur});
  });
  function pill({c,cur}){
    const on=!!cur;
    const isCap=on&&cur.captain;
    const stars=ttCareerWins(c.id,+NEXT-1);
    const hc = cur ? cur.startHcp : (c.carry?c.carry.hcp:"–");
    const prov = c.ringer||cur&&cur.ringer ? "new" : (c.carry ? "’"+String(c.carry.year).slice(2)+(c.carry.raw!==c.carry.hcp?" · "+c.carry.raw:"") : "");
    return '<div class="pill'+(on?" on p-"+(cur.team.toLowerCase()):"")+(locked&&!on?" off":"")+'" draggable="'+(on&&!locked?"true":"false")+'"'
      +(on&&!locked?' ondragstart="setupDrag(\''+c.id+'\',event)"':"")
      +(!locked?' onclick="setupToggle(\''+c.id+'\')"':"")+'>'
      +'<span class="pl-nm">'+(isCap?'<span class="capb">C</span> ':"")+esc(c.name)
      +(stars?' <span class="stars">'+"★".repeat(Math.min(stars,4))+'</span>':"")+'</span>'
      +'<span class="pl-h">'+hc+(prov?' <em>('+prov+')</em>':"")+'</span>'
      +(on&&!locked?'<button class="mv" onclick="event.stopPropagation();setupMove(\''+c.id+'\')" title="Switch team">⇄</button>':"")
      +'</div>';
  }
  function colBody(team){
    const list=cols[team];
    if (!locked) return list.map(pill).join("");
    const picked=list.filter(x=>x.cur).sort((a,b)=>{
      if (!!b.cur.captain-!!a.cur.captain) return (!!b.cur.captain)-(!!a.cur.captain);
      return a.c.name.localeCompare(b.c.name);
    });
    const rest=list.filter(x=>!x.cur);
    return picked.map(pill).join("")
      +(rest.length?'<div class="pdiv">not touring this year</div>'+rest.map(pill).join(""):"");
  }
  function colHead(team){
    const picked=(d?d.players.filter(p=>p.team===team):[]);
    const tot=picked.reduce((t,p)=>t+(p.startHcp||0),0);
    const cap=picked.find(p=>p.captain);
    return '<div class="col-h t-'+(team==="RED"?"r":"b")+'">'+team.charAt(0)+team.slice(1).toLowerCase()
      +' — '+picked.length+' picked'+(picked.length?' · hcp '+tot:"")
      +(cap?'<div class="col-cap">Captain: '+esc(cap.name)+'</div>':(picked.length?'<div class="col-cap mutd">currently leaderless</div>':""))
      +'</div>';
  }

    +'<div class="party">'
    +'<div class="pcol" ondragover="event.preventDefault()" ondrop="setupDrop(\'RED\',event)">'+colHead("RED")+colBody("RED")+'</div>'

    +'</div>'
    +schemePanel(d)
    +(locked?"":'<div class="panel" style="margin-top:16px"><div class="sec-s" style="margin:2px 0 10px">Add a ringer</div>'
    +'<div class="ringer"><input id="rgName" placeholder="Name">'

/* ---------- draw generator ---------- */
/* One draw creates BOTH the singles opponents and the 4BBB partners (the two same-team
   players sharing a 4-ball are partners). Optimises across ALL days at once:
   repeat opponents (heavy) · repeat partners (heavy) · same-group repeats (medium)
   · repeat 2-balls · tee-slot fairness · last-year rematches (light) · extreme hcp gaps (light).
   Supports pinned pairings; pinned matches keep their day. */
let proposal = null;
let pins = [];   // [{day, red, blue}]
/* ---- the reveal & lock schedule -------------------------------------------
   Each day's draw goes public at 20:00 the evening before ("the reveal"), and
   is then still re-drawable until 06:00 that morning — so the group get their
   moan, and Justin can answer it, right up until they tee off. After that the
   day is set in stone. Days already played are never touched again.          */
const REVEAL_HOUR = 20, LOCK_HOUR = 6;
function todayISO(){ const t=new Date();
  return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }
function dayMeta(y,dn){ return ((DATA[y]||{}).days||[]).find(x=>x.day===dn)||null; }
function atHour(iso,h,offsetDays){
  const d=new Date(iso+"T00:00:00");
  if (offsetDays) d.setDate(d.getDate()+offsetDays);
  d.setHours(h,0,0,0); return d;
}
function lockAt(y,dn){ const m=dayMeta(y,dn); return m&&m.date?atHour(m.date,LOCK_HOUR,0):null; }
function revealAt(y,dn){ const m=dayMeta(y,dn); return m&&m.date?atHour(m.date,REVEAL_HOUR,-1):null; }
function dayLocked(y,dn){
  if (sealed(y)) return true;
  const t=lockAt(y,dn); if(!t) return false;          // no date -> nothing to lock against
  return new Date() >= t;
}
function dayRevealed(y,dn){
  if (!READONLY) return true;                          // Justin always sees the lot
  const t=revealAt(y,dn); if(!t) return true;
  return new Date() >= t;
}
function drawableDays(y){ return ((DATA[y]||{}).days||[]).filter(x=>!dayLocked(y,x.day)); }
function tourStarted(y){
  const d=DATA[y]; if(!d||!d.days||!d.days.length) return false;
  const d1=d.days[0].date; if(!d1) return false;
  return todayISO() >= d1;                    // ISO dates compare lexicographically
}
function hasFixture(y){ const d=DATA[y]; return !!(d&&d.matches&&d.matches.length); }
/* the PARTY still locks for the whole tour once it starts — players can't change mid-tour */
function drawLocked(y){ return sealed(y) || (tourStarted(y) && hasFixture(y)); }
function fmtWhen(dt){
  if(!dt) return "";
  const D2=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()];
  const h=dt.getHours();
  return D2+" "+(h%12===0?12:h%12)+(h<12?"am":"pm");
}
function fmtDate(iso){
  if(!iso) return "";
  const p=iso.split("-"), M=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const n=+p[2], s=(n%10===1&&n%100!==11)?"st":(n%10===2&&n%100!==12)?"nd":(n%10===3&&n%100!==13)?"rd":"th";
  return n+s+" "+M[+p[1]-1]+" "+p[0];
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function priorMeets(){
  const s={}; const y=String(EDIT_FROM-1);
  if (DATA[y]) DATA[y].matches.forEach(m=>m.singles.forEach(x=>{ s[[x.red,x.blue].sort().join("|")]=1; }));
  return s;
}
function drawBlocks(n){
  const b=[]; let i=0;
  if (n%2===1){ b.push([0]); i=1; }          // odd pair-count: the 2-ball goes out first
  while(i<n){ b.push([i,i+1]); i+=2; }
  return b;
}
function genDraw(y){
  const d=DATA[y];
  const reds=d.players.filter(p=>p.team==="RED").map(p=>p.id);
  const blues=d.players.filter(p=>p.team==="BLUE").map(p=>p.id);
  if (!reds.length || reds.length!==blues.length)
    return {error:"Teams are uneven ("+reds.length+" v "+blues.length+"). The ghost-player rule is still to be agreed — even up the teams first."};
  const n=reds.length, D=d.days.length;
  const blocks=drawBlocks(n);
  const prior=priorMeets();
  const hcp={}; d.players.forEach(p=>hcp[p.id]=p.startHcp||0);
  const pinsByDay={}; pins.forEach(p=>{ (pinsByDay[p.day]=pinsByDay[p.day]||[]).push(p); });
  /* days already locked (played, or teeing off today) are FIXED — we optimise the
     rest of the week around them, so who you've already had counts against a repeat. */
  const dayNums=d.days.map(x=>x.day);
  const isLocked={}; dayNums.forEach(dn=>isLocked[dn]=dayLocked(y,dn));
  const openDays=dayNums.filter(dn=>!isLocked[dn]);
  if (!openDays.length)
    return {error:"Every day is locked in. The fixture is final."};
  function existingOrder(dn){                  // reconstruct ro/bo from a committed day
    const gs=d.matches.filter(m=>m.day===dn);
    if(!gs.length) return null;
    const ro=[], bo=[];
    gs.forEach(g=>g.singles.forEach(s=>{ ro.push(s.red); bo.push(s.blue); }));
    return (ro.length===n && bo.length===n) ? {ro,bo} : null;
  }
  const fixed={}; dayNums.forEach(dn=>{ if(isLocked[dn]) fixed[dn]=existingOrder(dn); });

  function newState(){
    const st=[];
    dayNums.forEach(dn=>{
      if (isLocked[dn] && fixed[dn]){ st.push({ro:fixed[dn].ro.slice(), bo:fixed[dn].bo.slice()}); return; }
      const ro=shuffle(reds.slice()), bo=shuffle(blues.slice());
      (pinsByDay[dn]||[]).forEach((pn,k)=>{     // park pins at the tail (always a 4-ball slot)
        const tgt=n-1-k;
        const ri=ro.indexOf(pn.red); if(ri>=0) [ro[tgt],ro[ri]]=[ro[ri],ro[tgt]];
        const bi=bo.indexOf(pn.blue); if(bi>=0) [bo[tgt],bo[bi]]=[bo[bi],bo[tgt]];
      });
      st.push({ro,bo});
    });
    return st;
  }
  function frozen(dd){ const k=(pinsByDay[dd]||[]).length; return idx=>idx>=n-k; }
  function tally(st){
    const opp={}, part={}, grp={}, two={}, slot={};
    let priorHits=0, gapPen=0;
    st.forEach(({ro,bo})=>{
      blocks.forEach((bl,slotIdx)=>{
        const ids=[];
        bl.forEach(ix=>{
          ids.push(ro[ix],bo[ix]);
          const k=[ro[ix],bo[ix]].sort().join("|");
          opp[k]=(opp[k]||0)+1;
          if(prior[k]) priorHits++;
          const gap=Math.abs(hcp[ro[ix]]-hcp[bo[ix]]);
          if(gap>20) gapPen+=(gap-20);
        });
        if(bl.length===2){
          const pk=[ro[bl[0]],ro[bl[1]]].sort().join("|"); part[pk]=(part[pk]||0)+1;
          const bk=[bo[bl[0]],bo[bl[1]]].sort().join("|"); part[bk]=(part[bk]||0)+1;
          for(let a=0;a<4;a++)for(let b2=a+1;b2<4;b2++){
            const gk=[ids[a],ids[b2]].sort().join("|"); grp[gk]=(grp[gk]||0)+1; }
        } else ids.forEach(i2=>two[i2]=(two[i2]||0)+1);
        ids.forEach(i2=>{ const sk=i2+"@"+slotIdx; slot[sk]=(slot[sk]||0)+1; });
      });
    });
    let oppR=0, partR=0, grpR=0, twoR=0, slotR=0;
    for(const k in opp) if(opp[k]>1) oppR+=opp[k]-1;
    for(const k in part) if(part[k]>1) partR+=part[k]-1;
    for(const k in grp) if(grp[k]>1) grpR+=grp[k]-1;
    for(const k in two) if(two[k]>1) twoR+=two[k]-1;
    for(const k in slot) if(slot[k]>1) slotR+=slot[k]-1;
    const cost = 100*oppR + 80*partR + 30*grpR + 40*twoR + 5*slotR + 10*priorHits + 2*gapPen;
    return {cost, oppR, partR, grpR, twoR, slotR, priorHits};
  }
  let best=null, bestT=null;
  for(let r0=0;r0<6;r0++){
    const st=newState();
    let t=tally(st);
    for(let it=0; it<14000; it++){
      const dd=openDays[Math.floor(Math.random()*openDays.length)];   // never disturb a locked day
      const fz=frozen(dd);
      const side=Math.random()<0.5?"ro":"bo";
      const arr=st[dayNums.indexOf(dd)][side];
      const i=Math.floor(Math.random()*n), j=Math.floor(Math.random()*n);
      if(i===j||fz(i)||fz(j)) continue;
      [arr[i],arr[j]]=[arr[j],arr[i]];
      const t2=tally(st);
      if(t2.cost<=t.cost) t=t2;
      else [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    if(!bestT || t.cost<bestT.cost){ bestT=t; best=JSON.parse(JSON.stringify(st)); }
  }
  const tees=["1000h","1010h","1020h","1030h","1040h","1050h","1100h","1110h"];
  const days = d.days.map((meta,di)=>{
    const {ro,bo}=best[di];
    const keepTees=d.matches.filter(m=>m.day===meta.day).map(m=>m.tee);
    return { day:meta.day, meta, locked:isLocked[meta.day],
      groups: blocks.map((bl,slotIdx)=>({
        tee: keepTees[slotIdx] || tees[slotIdx] || ("t"+slotIdx),
        format: bl.length===1?"2ball":"4ball",
        matches: bl.map(ix=>({red:ro[ix], blue:bo[ix]}))
      })) };
  });
  return {days, diag:bestT, openDays};
}
window.genDrawClick = () => {
  if (sealed(curYear) || !drawableDays(curYear).length) return;
  const res=genDraw(curYear);
  if (res.error){ proposal={error:res.error}; } else proposal=res;

};
window.togglePin = (dd,red,blue) => {
  if (dayLocked(curYear,dd)) return;
  const ix=pins.findIndex(p=>p.day===dd&&p.red===red&&p.blue===blue);
  if (ix>=0) pins.splice(ix,1); else pins.push({day:dd,red,blue});
  render();
};
window.clearPins = () => { pins=[]; render(); };
const PF="ntrc.prevfixture";
function prevFixture(){ try{ const p=JSON.parse(localStorage.getItem(PF)||"null");
  return (p&&p.year===curYear&&p.matches)?p:null; }catch(e){ return null; } }
window.applyDraw = () => {
  if (sealed(curYear) || !proposal || proposal.error) return;
  const d=DATA[curYear];
  const open=new Set(proposal.openDays||[]);
  if (!open.size) return;
  const affected=d.matches.filter(m=>open.has(m.day) && (m.singles.some(s=>s.result!=null)||m.fourBBB));
  if (affected.length && !confirm("Replace the draw for day"+(open.size>1?"s ":" ")
      +[...open].join(", ")+"?\n\n"+affected.length+" match group"
      +(affected.length===1?" has":"s have")+" results entered on "
      +(open.size>1?"those days":"that day")+" — those results will be cleared."
      +"\nDays already played are untouched, Stableford scores are kept, and you can undo this."))
    return;
  localStorage.setItem(PF, JSON.stringify({year:curYear, matches:d.matches}));
  const kept=d.matches.filter(m=>!open.has(m.day));          // locked days survive intact
  const fresh=[];
  proposal.days.filter(pd=>open.has(pd.day)).forEach(pd=>{
    pd.groups.forEach(g=>{
      fresh.push({ day:pd.day, tee:g.tee, format:g.format,
        singles:g.matches.map(m=>({red:m.red, blue:m.blue, result:null})),
        fourBBB:null });
    });
  });
  d.matches=kept.concat(fresh).sort((a,b)=>a.day-b.day);
  markDirty(true);
  proposal=null; pins=[];
  curTab="match"; render();
};
window.undoDraw = () => {
  const p=prevFixture(); if(!p||sealed(curYear)||!drawableDays(curYear).length) return;
  if (!confirm("Restore the previous fixture (and its results)?")) return;
  DATA[curYear].matches=p.matches;

  markDirty(true); curTab="match"; render();
};

        });

          +'<span class="gfmt">'+(gr.format==="2ball"?"Two-ball":"Four-ball — partners in colour")+'</span></div>'+lines+'</div>';
      });

        +'<div class="grps">'+groups+'</div></div>';
