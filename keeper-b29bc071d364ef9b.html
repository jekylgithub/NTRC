{font-size:clamp(20px,6vw,40px);}\n  .squad{gap:clamp(20px,9vw,80px);} .sq-col .nmx{font-size:clamp(14px,4vw,22px);}\n}\n/* landscape (phone turned sideways): size type off the SHORT edge (vmin) not width, and\n   cap card width to under half the screen, so cards can never balloon or collide. */\n@media (min-aspect-ratio:1/1){\n  .card{max-width:min(44vw,460px);}\n  .card .cn{font-size:clamp(38px,11vmin,96px);}\n  .card .cdash{font-size:clamp(22px,6.5vmin,54px);}\n  .card .cq{font-size:clamp(14px,3.4vmin,22px);}\n  .card .nm2{font-size:clamp(22px,6vmin,48px);}\n  .card .sc2{font-size:clamp(28px,7vmin,58px);}\n  .big{font-size:clamp(40px,13vmin,120px);}\n  .mid{font-size:clamp(24px,7.4vmin,64px);}\n  .sub{font-size:clamp(12px,3.2vmin,20px);}\n  .title .l2{font-size:clamp(38px,12vmin,120px);}\n  .lower .lc{font-size:clamp(20px,5.4vmin,44px);}\n  .pos-tl,.pos-tr,.pos-tc{top:8%;}\n  .pos-ml{top:33%;} .pos-mr{top:40%;}\n  .pos-bl,.pos-br,.pos-bc{bottom:9%;}\n}\n<\/style>\n<\/head>\n<body>\n<div id=\"stage\">\n  <canvas id=\"fx\"><\/canvas>\n  <div id=\"grain\"><\/div>\n  <div id=\"reel\"><\/div>\n  <div id=\"vig\"><\/div>\n  <button id=\"exit\">\u2715 Close<\/button>\n  <div id=\"ctl\"><button class=\"cbtn\" id=\"mute\" title=\"Sound\">\u266a<\/button><\/div>\n  <!-- transport: pause and scrub back to anything you missed -->\n  <div id=\"tp\">\n    <button id=\"pp\" title=\"Pause\" aria-label=\"Pause\">\u275a\u275a<\/button>\n    <div id=\"bar\" role=\"slider\" aria-label=\"Position\" tabindex=\"0\">\n      <div id=\"ticks\"><\/div><div id=\"fill\"><\/div><div id=\"knob\"><\/div>\n    <\/div>\n    <div id=\"tt\">0:00<\/div>\n  <\/div>\n  <div id=\"replay\">\n    <div class=\"r-t\">The wait begins.<\/div>\n    <div class=\"r-s\">1\u20134 October \u00b7 Empord\u00e0<\/div>\n    <div class=\"r-b\">\n      <button onclick=\"playReel()\">\u25b6 Watch again<\/button>\n      <button class=\"r-back\" onclick=\"exitReel()\">\u2190 Back to app<\/button>\n    <\/div>\n    <div class=\"r-n\">Screen-record this to share it as a video<\/div>\n  <\/div>\n<\/div>\n\n<div id=\"gate\">\n  <div class=\"g-eye\">Costa Brava \u00b7 Spain \u00b7 MMXXVI<\/div>\n  <div class=\"g-t\">Not the<br>Ryder Cup<\/div>\n  <div class=\"g-crests\"><img src=\"__RED__\" alt=\"\"><img src=\"__BLUE__\" alt=\"\"><\/div>\n  <div class=\"g-play\">\u25b6 Begin the build-up<\/div>\n  <div class=\"g-note\">Best full screen \u00b7 with sound<\/div>\n<\/div>\n\n<script>\nconst RED=\"__RED__\", BLUE=\"__BLUE__\";\nconst PHOTOS=__PHOTOS__;\n\n/* ============ the reel: pages ============\n   statement = one big central card, held.\n   photo     = full-screen graded photo + caption.\n   montage   = several caption cards drifting in from odd angles, overlapping.\n   Timings are deliberately unhurried so every stat can be read.               */\nconst C = (h,pos,an) => ({h,pos,an});\nconst PH = i => (PHOTOS && PHOTOS[i]) ? i : null;\nconst PAGES = __PAGES__;\n\n/* ============ montage engine ============ */\n// vertical bands, each with horizontal variants \u2014 [top][ ], [middle][ ], [bottom][ ]\nconst BANDS=[[\"tl\",\"tr\",\"tc\"],[\"ml\",\"mr\",\"c\"],[\"bl\",\"br\",\"bc\"]];\nconst reel=document.getElementById(\"reel\");\n/* Every pending step is held with the time it is still owed, so a pause can put\n   them all down and pick them all up exactly where they were. */\nlet timers=[];\nfunction clearTimers(){ timers.forEach(t=>{ if(t.id) clearTimeout(t.id); }); timers=[]; }\nfunction later(fn,ms){\n  const t={fn:fn, rem:ms, due:Date.now()+ms, id:null};\n  const fire=()=>{ timers=timers.filter(x=>x!==t); t.fn(); };\n  if (typeof paused!==\"undefined\" && paused) { t.id=null; }   // paused mid-page: hold it\n  else t.id=setTimeout(fire, ms);\n  t.fire=fire; timers.push(t); return t;\n}\nfunction holdTimers(){\n  const now=Date.now();\n  timers.forEach(t=>{ if(t.id) clearTimeout(t.id); t.rem=Math.max(0, t.due-now); t.id=null; });\n}\nfunction releaseTimers(){\n  const now=Date.now();\n  timers.forEach(t=>{ t.due=now+t.rem; t.id=setTimeout(t.fire, t.rem); });\n}\nfunction fadeRemove(el, after){ if(!el)return; el.classList.remove(\"in\"); el.classList.add(\"out\");\n  later(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, after||1300); }\nfunction clearStage(){ Array.prototype.slice.call(reel.children).forEach(el=>fadeRemove(el,1300)); }\nfunction spawnCard(c, life){\n  const el=document.createElement(\"div\"); el.className=\"card pos-\"+c.pos+\" \"+c.an; el.innerHTML=c.h;\n  reel.appendChild(el); void el.offsetWidth; el.classList.add(\"in\");\n  later(()=>fadeRemove(el,1300), life);\n}\n/* `into` = how far into this page we are landing. Scrubbing uses it to build the\n   frame as it WOULD look at that instant: anything already due is done at once,\n   anything already gone is skipped, and the rest keeps its remaining delay. That\n   is what makes the scrubber seek by the second instead of by the page. */\nfunction runPage(i, into){\n  if(i>=PAGES.length){ later(showReplay, 900); return; }\n  const p=PAGES[i];\n  into = into||0;\n  curPage=i; pageT0=Date.now()-into;\n  const at=(fn,ms)=>{ const d=ms-into; if(d<=0){ fn(); } else later(fn,d); };\n  clearStage();\n  if(p.type===\"stmt\"){\n    const el=document.createElement(\"div\"); el.className=\"stmt go\"; el.innerHTML=p.h;\n    reel.appendChild(el); void el.offsetWidth; el.classList.add(\"in\");   // reflow first \u2192 smooth fade\n  } else if(p.type===\"photo\"){\n    if(p.i==null){ runPage(i+1); return; }\n    const ph=PHOTOS[p.i];\n    const el=document.createElement(\"div\"); el.className=\"photo kb\";\n    const bg=document.createElement(\"div\"); bg.className=\"ph-bg\"; bg.style.backgroundImage=\"url('\"+ph.src+\"')\";\n    const fg=document.createElement(\"div\"); fg.className=\"ph-fg\"; fg.style.backgroundImage=\"url('\"+ph.src+\"')\";\n    el.appendChild(bg); el.appendChild(fg);\n    reel.appendChild(el); void el.offsetWidth; el.classList.add(\"in\");\n    if(ph.cap){ const c=document.createElement(\"div\"); c.className=\"lower\";\n      c.innerHTML='<div class=\"lc\">'+ph.cap+'<\/div><div class=\"ls\">Not the Ryder Cup<\/div>';\n      reel.appendChild(c); void c.offsetWidth; at(()=>c.classList.add(\"in\"), 500); }\n  } else if(p.type===\"montage\"){\n    // place each card in a different vertical band from its neighbours, so cards that\n    // are on screen together can never overlap (life < 3\u00d7stagger \u21d2 \u22643 alive at once).\n    p.cards.forEach((c,k)=>{\n      const band=(k+i)%3, hv=(k*2+i)%3;\n      const pos=BANDS[band][hv];\n      const spawn=k*p.stagger + 200;\n      if (spawn + p.life <= into) return;                 // came and went before we arrived\n      const life = (spawn<=into) ? (spawn + p.life - into) : p.life;\n      at(()=>spawnCard({h:c.h, pos:pos, an:c.an}, life), spawn);\n    });\n  }\n  at(()=>runPage(i+1), p.t);\n}\n\n/* ============ transport: pause, and scrub back to anything you missed ============\n   The reel is a sequence of timed pages, not a media file, so the scrubber SNAPS TO\n   PAGE STARTS \u2014 which is what you want anyway when the thing you missed is a card.\n   Pausing freezes the stage; resuming replays the current page from its beginning,\n   so no card is ever skipped by a pause landing mid-stagger.                        */\nlet curPage=0, pageT0=0, paused=false, pauseStart=0, tpTimer=null;\nconst PAGE_DUR=PAGES.map(p=>(p.type===\"photo\" && p.i==null) ? 0 : p.t);\nconst PAGE_START=[]; (function(){ let a=0; PAGE_DUR.forEach(d=>{ PAGE_START.push(a); a+=d; }); })();\nconst TOTAL=PAGE_DUR.reduce((a,b)=>a+b,0);\nconst tp=document.getElementById(\"tp\"), ppBtn=document.getElementById(\"pp\");\nconst barEl=document.getElementById(\"bar\"), fillEl=document.getElementById(\"fill\");\nconst knobEl=document.getElementById(\"knob\"), ttEl=document.getElementById(\"tt\");\nconst mmss=ms=>{ const t=Math.max(0,Math.round(ms/1000)); return Math.floor(t/60)+\":\"+String(t%60).padStart(2,\"0\"); };\n(function ticks(){\n  const box=document.getElementById(\"ticks\");\n  box.innerHTML=PAGE_START.filter((v,i)=>PAGE_DUR[i]>0 && v>0)\n    .map(v=>'<i style=\"left:'+(v/TOTAL*100).toFixed(3)+'%\"><\/i>').join(\"\");\n})();\nfunction elapsed(){\n  const into = paused ? (pauseStart-pageT0) : (Date.now()-pageT0);\n  return Math.min(TOTAL, (PAGE_START[curPage]||0) + Math.min(into, PAGE_DUR[curPage]||0));\n}\nfunction paintOnce(){\n  const pc=TOTAL?elapsed()/TOTAL*100:0;\n  fillEl.style.width=pc+\"%\"; knobEl.style.left=pc+\"%\";\n  ttEl.textContent=mmss(elapsed())+\" / \"+mmss(TOTAL);\n}\nfunction paint(){\n  const pc=TOTAL?elapsed()/TOTAL*100:0;\n  fillEl.style.width=pc+\"%\"; knobEl.style.left=pc+\"%\";\n  ttEl.textContent=mmss(elapsed())+\" / \"+mmss(TOTAL);\n  if(!paused) requestAnimationFrame(paint);\n}\nfunction showTp(){\n  tp.classList.add(\"show\");\n  clearTimeout(tpTimer);\n  if(!paused) tpTimer=setTimeout(()=>tp.classList.remove(\"show\"), 2800);\n}\n/* Freeze the picture exactly as it stands \u2014 including anything mid-fade. CSS\n   animations take animation-play-state; transitions can't be paused, so the\n   current computed values are pinned inline and released on resume, which lets\n   the fade carry on from where it stopped rather than restarting. */\nfunction freezeStage(){\n  const st=document.getElementById(\"stage\");\n  st.classList.add(\"frozen\");\n  Array.prototype.forEach.call(reel.querySelectorAll(\"*\"), el=>{\n    const cs=getComputedStyle(el);\n    el.__fz={t:el.style.transition, o:el.style.opacity, r:el.style.transform};\n    el.style.transition=\"none\";\n    el.style.opacity=cs.opacity;\n    el.style.transform=(cs.transform===\"none\")?\"\":cs.transform;\n  });\n}\nfunction thawStage(){\n  const st=document.getElementById(\"stage\");\n  st.classList.remove(\"frozen\");\n  const els=Array.prototype.slice.call(reel.querySelectorAll(\"*\")).filter(el=>el.__fz);\n  els.forEach(el=>{ el.style.transition=el.__fz.t; });        // transitions live again\u2026\n  requestAnimationFrame(()=>els.forEach(el=>{                 // \u2026then let them run on\n    if(!el.__fz) return;\n    el.style.opacity=el.__fz.o; el.style.transform=el.__fz.r;\n    delete el.__fz;\n  }));\n}\nfunction setPaused(v){\n  if(v===paused) return;\n  paused=v;\n  if(v){\n    pauseStart=Date.now();\n    holdTimers();\n    freezeStage();\n    try{ if(AC && AC.state===\"running\") AC.suspend(); }catch(e){}\n    if(trackEl){ try{ trackEl.pause(); }catch(e){} }\n    ppBtn.textContent=\"\\u25B6\"; ppBtn.title=\"Play\";\n  } else {\n    pageT0 += Date.now()-pauseStart;      // the clock owes back exactly what it lost\n    thawStage();\n    try{ if(AC && AC.state===\"suspended\") AC.resume(); }catch(e){}\n    if(trackEl && !muted){ try{ trackEl.play(); }catch(e){} }\n    ppBtn.textContent=\"\\u275A\\u275A\"; ppBtn.title=\"Pause\";\n    releaseTimers();\n    requestAnimationFrame(paint);\n  }\n  showTp();\n}\n/* Seek to a moment, not to a chapter. Renders the frame as it stands at time t,\n   and \u2014 crucially \u2014 leaves the reel paused if that is how it found it. */\nfunction seekTo(frac, opts){\n  const wasPaused = (opts && \"keepPaused\" in opts) ? opts.keepPaused : paused;\n  const t=Math.max(0,Math.min(1,frac))*TOTAL;\n  let i=0; for(let k=0;k<PAGES.length;k++){ if(PAGE_DUR[k]>0 && PAGE_START[k]<=t) i=k; }\n  const into=Math.max(0, Math.min((PAGE_DUR[i]||1)-1, t-(PAGE_START[i]||0)));\n  const st=document.getElementById(\"stage\");\n  clearTimers();\n  paused=false;                                   // let runPage arm its timers normally\n  st.classList.add(\"seeking\");                    // land on the frame, don't fade into it\n  runPage(i, into);\n  void reel.offsetWidth;\n  st.classList.remove(\"seeking\");\n  document.getElementById(\"replay\").classList.remove(\"show\");\n  if (wasPaused){\n    paused=true; pauseStart=Date.now();\n    holdTimers(); freezeStage();\n    ppBtn.textContent=\"\\u25B6\"; ppBtn.title=\"Play\";\n  } else {\n    st.classList.remove(\"frozen\");\n    try{ if(AC && AC.state===\"suspended\") AC.resume(); }catch(e){}\n    if(trackEl && !muted){ try{ trackEl.play(); }catch(e){} }\n    ppBtn.textContent=\"\\u275A\\u275A\"; ppBtn.title=\"Pause\";\n  }\n  paintOnce(); requestAnimationFrame(paint); showTp();\n}\nfunction nudge(sec){                              // a second at a time, staying paused\n  seekTo((elapsed()+sec*1000)/TOTAL);\n}\nconst fracFromX=x=>{ const r=barEl.getBoundingClientRect(); return (x-r.left)/r.width; };\n/* In the zone: a drag scrubs, a tap plays or pauses \u2014 the usual player gesture. */\nlet downT=0, downX=0, moved=false, dragPaused=false, lastSeek=0, seekPending=null;\ntp.addEventListener(\"pointerdown\", e=>{\n  if(e.target.closest(\"#pp\")) return;                 // the button speaks for itself\n  e.preventDefault(); e.stopPropagation();\n  downT=Date.now(); downX=e.clientX; moved=false; dragPaused=paused;\n  try{ tp.setPointerCapture(e.pointerId); }catch(err){}\n  showTp();\n});\ntp.addEventListener(\"pointermove\", e=>{\n  if(!downT) return;\n  if(!moved && Math.abs(e.clientX-downX)>6) moved=true;\n  if(!moved) return;\n  const f=Math.max(0,Math.min(1,fracFromX(e.clientX)));\n  // the bar and the clock follow the thumb every frame; the picture is rebuilt at\n  // ~12/sec, which is plenty and keeps a long swipe from thrashing the DOM\n  fillEl.style.width=(f*100)+\"%\"; knobEl.style.left=(f*100)+\"%\";\n  ttEl.textContent=mmss(f*TOTAL)+\" / \"+mmss(TOTAL);\n  const now=Date.now();\n  clearTimeout(seekPending);\n  if(now-lastSeek>80){ lastSeek=now; seekTo(f,{keepPaused:dragPaused}); }\n  else seekPending=setTimeout(()=>{ lastSeek=Date.now(); seekTo(f,{keepPaused:dragPaused}); }, 80);\n});\nconst endDrag=e=>{\n  if(!downT) return;\n  if(!moved) setPaused(!paused);                      // a tap down here = pause/play\n  else { clearTimeout(seekPending);\n         seekTo(fracFromX(e.clientX), {keepPaused:dragPaused}); }   // land exactly where released\n  downT=0; moved=false;\n};\ntp.addEventListener(\"pointerup\", endDrag);\ntp.addEventListener(\"pointercancel\", endDrag);\nbarEl.addEventListener(\"keydown\", e=>{\n  if(e.key===\"ArrowLeft\"){ e.preventDefault(); e.shiftKey?runPageSafe(curPage-1):nudge(-1); }\n  if(e.key===\"ArrowRight\"){ e.preventDefault(); e.shiftKey?runPageSafe(curPage+1):nudge(1); } });\nfunction runPageSafe(i){\n  let k=Math.max(0,Math.min(PAGES.length-1,i));\n  while(k>0 && PAGE_DUR[k]===0) k--;\n  seekTo((PAGE_START[k]||0)/TOTAL);\n}\nppBtn.addEventListener(\"click\", e=>{ e.stopPropagation(); setPaused(!paused); });\n/* Anywhere else on the picture: tap to pause, tap to carry on. */\ndocument.getElementById(\"stage\").addEventListener(\"click\", e=>{\n  if(!tp.classList.contains(\"live\")) return;\n  if(e.target.closest(\"#tp,#exit,#ctl,#replay,#gate\")) return;\n  setPaused(!paused);\n});\n[\"mousemove\",\"touchstart\",\"pointerdown\"].forEach(ev=>\n  document.getElementById(\"stage\").addEventListener(ev, showTp, {passive:true}));\ndocument.addEventListener(\"keydown\", e=>{\n  if(tp.classList.contains(\"live\")===false) return;\n  if(e.code===\"Space\"){ e.preventDefault(); setPaused(!paused); }\n  else if(e.key===\"ArrowLeft\"){ e.preventDefault(); e.shiftKey?runPageSafe(curPage-1):nudge(-1); }\n  else if(e.key===\"ArrowRight\"){ e.preventDefault(); e.shiftKey?runPageSafe(curPage+1):nudge(1); } });\n\n/* ============ audio ============ */\nconst SOUNDTRACK=\"__SOUNDTRACK__\";\nlet trackEl=null, AC=null, master=null, verbIn=null, muted=false, schedTimer=null;\nconst CHORD_DUR=4.0, XFADE=1.8;\nconst PAD=[[130.81,164.81,196.00],[98.00,123.47,146.83],[110.00,130.81,164.81],[87.31,110.00,130.81]]; // C \u00b7 G \u00b7 Am \u00b7 F\nconst ARP=[[261.63,329.63,392.00,523.25],[196.00,246.94,293.66,392.00],[220.00,261.63,329.63,440.00],[174.61,220.00,261.63,349.23]];\nconst ARPAT=[0,1,2,3,2,3,1,2];       // flowing up-and-back\nconst BEAT=0.5;\nlet beat=0, beatTime=0;\nfunction fadeVol(el, to, ms){                       // gentle volume ramp for the HTML audio track\n  if(!el) return; const from=el.volume, t0=Date.now();\n  const iv=setInterval(()=>{ const k=Math.min((Date.now()-t0)/ms,1);\n    el.volume=Math.max(0,Math.min(1, from+(to-from)*k)); if(k>=1) clearInterval(iv); }, 40);\n}\nfunction initAudio(){\n  if (SOUNDTRACK){ if(trackEl) return;\n    trackEl=new Audio(SOUNDTRACK); trackEl.loop=true; trackEl.volume=0;\n    trackEl.play().then(()=>fadeVol(trackEl, muted?0:0.9, 2600)).catch(()=>{});  // fade in\n    return; }\n  if (AC) return;\n  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }\n  master=AC.createGain(); master.gain.value=muted?0:0.5; master.connect(AC.destination);\n  verbIn=AC.createGain(); verbIn.gain.value=1;\n  const d1=AC.createDelay(); d1.delayTime.value=0.23;\n  const d2=AC.createDelay(); d2.delayTime.value=0.37;\n  const fb=AC.createGain(); fb.gain.value=0.48;\n  const lp=AC.createBiquadFilter(); lp.type=\"lowpass\"; lp.frequency.value=2000;\n  const wet=AC.createGain(); wet.gain.value=0.4;\n  verbIn.connect(d1); d1.connect(d2); d2.connect(fb); fb.connect(d1); d2.connect(lp); lp.connect(wet); wet.connect(master);\n  const t=AC.currentTime+0.3; beat=0; beatTime=t;\n  schedTimer=setInterval(schedule, 240); schedule();\n}\nfunction padChord(freqs,t,dur){\n  freqs.forEach((f,i)=>{\n    const o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter();\n    o.type=\"sawtooth\"; o.frequency.value=f; o.detune.value=(i-1.5)*2.0;\n    lp.type=\"lowpass\"; lp.frequency.value=1400;\n    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.03,t+XFADE);\n    g.gain.setValueAtTime(0.03,t+dur); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+XFADE);\n    o.connect(lp); lp.connect(g); g.connect(master);\n    const s=AC.createGain(); s.gain.value=0.5; g.connect(s); s.connect(verbIn);\n    o.start(t); o.stop(t+dur+XFADE+0.2);\n  });\n  const o=AC.createOscillator(), g=AC.createGain();\n  o.type=\"sine\"; o.frequency.value=freqs[0]/2;\n  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.042,t+XFADE);\n  g.gain.setValueAtTime(0.042,t+dur); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+XFADE);\n  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+XFADE+0.2);\n}\nfunction pianoNote(f,t){\n  [[f,0.12,\"triangle\",1.5],[f*2.005,0.028,\"sine\",0.9]].forEach(([fr,pk,ty,dec])=>{\n    const o=AC.createOscillator(), g=AC.createGain();\n    o.type=ty; o.frequency.value=fr;\n    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(pk,t+0.025);\n    g.gain.exponentialRampToValueAtTime(0.0001,t+0.025+dec);\n    o.connect(g); g.connect(master);\n    const s=AC.createGain(); s.gain.value=pk*0.6; g.connect(s); s.connect(verbIn);\n    o.start(t); o.stop(t+0.025+dec+0.2);\n  });\n}\nfunction schedule(){\n  if(!AC) return;\n  try{\n    const ahead=AC.currentTime+1.4;\n    while(beatTime<ahead){\n      const ci=Math.floor(beat/8)%4;\n      if(beat%8===0) padChord(PAD[ci], beatTime, CHORD_DUR);\n      pianoNote(ARP[ci][ARPAT[beat%8]], beatTime);\n      beat++; beatTime+=BEAT;\n    }\n  }catch(e){}\n}\n\n/* ============ canvas dust ============ */\nconst cv=document.getElementById(\"fx\"), cx=cv.getContext(\"2d\");\nlet W,H,parts=[],raf=null;\nfunction newP(){ return {x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+0.3,s:Math.random()*0.28+0.06,d:Math.random()*0.4-0.2,a:Math.random()*0.28+0.06}; }\nfunction resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; parts=Array.from({length:56},newP); }\nfunction draw(){ if(typeof paused!==\"undefined\" && paused){ raf=requestAnimationFrame(draw); return; }\n  cx.clearRect(0,0,W,H);\n  for(const p of parts){ p.y-=p.s; p.x+=p.d; if(p.y<-8){Object.assign(p,newP(),{y:H+8});}\n    cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fillStyle=\"rgba(168,134,60,\"+p.a+\")\"; cx.fill(); }\n  raf=requestAnimationFrame(draw); }\naddEventListener(\"resize\",resize); resize();\n\n/* ============ transport ============ */\nfunction showReplay(){ document.getElementById(\"replay\").classList.add(\"show\"); document.getElementById(\"ctl\").classList.add(\"show\");\n  tp.classList.remove(\"live\",\"show\"); document.getElementById(\"ctl\").classList.remove(\"up\");\n  if(trackEl) fadeVol(trackEl, 0, 2200); }        // fade the music out as the reel ends\n\nfunction playReel(){ clearTimers(); reel.innerHTML=\"\"; document.getElementById(\"replay\").classList.remove(\"show\");\n  paused=false; pauseStart=0; document.getElementById(\"stage\").classList.remove(\"frozen\");\n  ppBtn.textContent=\"\u275a\u275a\"; tp.classList.add(\"live\"); document.getElementById(\"ctl\").classList.add(\"up\");\n  showTp(); requestAnimationFrame(paint);\n  if(trackEl) fadeVol(trackEl, muted?0:0.9, 1500);   // fade back in on replay\n  if(!raf) draw(); runPage(0); }\nfunction begin(){\n  document.getElementById(\"gate\").classList.add(\"hide\");\n  later(playReel, 900);                                   // start visuals no matter what\n  try{ initAudio(); if(AC && AC.state===\"suspended\") AC.resume(); }catch(e){}\n  try{ const el=document.documentElement, r=el.requestFullscreen&&el.requestFullscreen(); if(r&&r.catch) r.catch(()=>{}); }catch(e){}\n}\nfunction exitReel(){\n  try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}\n  clearTimers(); if(trackEl){ try{ trackEl.pause(); }catch(e){} }\n  if(history.length>1){ history.back(); return; }   // opened from the app \u2192 return to it\n  try{ window.close(); }catch(e){}                   // script-opened tab \u2192 close it\n  reel.innerHTML=\"\"; showReplay();                   // opened directly \u2192 settle on the end frame\n}\ndocument.getElementById(\"exit\").addEventListener(\"click\", e=>{ e.stopPropagation(); exitReel(); });\ndocument.getElementById(\"gate\").addEventListener(\"click\", begin);\ndocument.getElementById(\"mute\").addEventListener(\"click\", e=>{ e.stopPropagation(); muted=!muted;\n  if(master) master.gain.value=muted?0:0.62; if(trackEl) trackEl.volume=muted?0:0.9;\n  document.getElementById(\"mute\").textContent=muted?\"\u2715\":\"\u266a\"; });\n<\/script>\n<\/body>\n<\/html>";   // shared montage engine, filled in-browser for the review reel

/* ---------- keeping the page honest ----------
   One place that pulls the published data, used by every trigger: opening the app,
   coming back to it, a quiet poll while it sits on the table, and a pull-down.
   Returns true only when something actually changed, so nothing re-renders under
   somebody's thumb for no reason. */
const HOSTED = location.protocol.indexOf("http")===0;
let lastPublishedAt=null, lastPullAt=0, pulling=false;
async function pullData(){
  if (!HOSTED || pulling) return false;
  pulling=true;
  try{
    const r=await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) return false;
    const j=await r.json();
    if(!j) return false;
    if (j.publishedAt && j.publishedAt===lastPublishedAt) return false;   // nothing new
    let got=false;
    Object.keys(j).forEach(k=>{ if(/^\d{4}$/.test(k) && j[k]){ BASE[k]=j[k]; got=true; } });
    if(!got) return false;
    /* On the organiser's phone the published data is the source of truth: if it is
       newer than anything typed on this device, it wins. */
    if (!READONLY && j.publishedAt){
      let ed=null; try{ ed=localStorage.getItem("ntrc.lastEdit"); }catch(e){}
      if (!ed || j.publishedAt > ed){
        for (const k of Object.keys(override)) if (BASE[k]) delete override[k];
        try{ localStorage.setItem(LS, JSON.stringify(override)); }catch(e){}
      }
    }
    rebuildData();
    try{ await unsealAll(sealPass()); }catch(e){}
    const first = lastPublishedAt===null;
    lastPublishedAt = j.publishedAt || String(Date.now());
    lastPullAt = Date.now();
    render();
    if(!first) toast("Scores updated");
    return true;
  }catch(e){ return false; }
  finally{ pulling=false; }
}

  const cue=document.createElement("div"); cue.id="ptr"; cue.innerHTML='<span>↓</span>';
  document.body.appendChild(cue);
  const TRIGGER=72;
  let y0=null, dy=0;
  addEventListener("touchstart", e=>{
    if (window.scrollY>2 || e.touches.length!==1) { y0=null; return; }
    y0=e.touches[0].clientY; dy=0;
  }, {passive:true});
  addEventListener("touchmove", e=>{
    if (y0===null) return;
    dy=e.touches[0].clientY-y0;
    if (dy<=0){ cue.className=""; cue.style.transform=""; return; }
    const d=Math.min(dy*0.55, TRIGGER+18);
    cue.style.transform="translateY("+d+"px)";
    cue.className = dy>=TRIGGER ? "armed" : "on";
  }, {passive:true});
  addEventListener("touchend", async ()=>{
    if (y0===null) return;
    const go = dy>=TRIGGER;
    y0=null; dy=0;
    cue.style.transform=""; cue.className = go ? "busy" : "";
    if (go){
      const changed=await pullData();
      cue.className="";
      if(!changed) toast("Up to date");
    }
  }, {passive:true});
}

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function marginOf(v){
  if (v==null) return null;
  const s = String(v).trim().toLowerCase();
  if (s==="" || s==="a/s" || s==="as") return null;
  const m = s.match(/^\d+/); return m ? parseInt(m[0]) : null;
}
function decide(s){
  const r = s.result;
  if (r==null) return {w:null, note:""};
  if (r==="AS") return {w:"HALVED", note:"A/S"};
  const me = marginOf(r.red), mg = marginOf(r.blue);
  if (me==null && mg==null) return {w:null, note:""};
  const R = me==null ? -1 : me, B = mg==null ? -1 : mg;
  if (R===B) return {w:"HALVED", note:"A/S"};
  const w = R>B ? "RED":"BLUE", up = Math.max(R,B), tp = Math.min(R,B);
  return {w, note: tp<0 ? up+" up" : up+"&"+tp};
}
function dayScores(y){
  const d = DATA[y]; const out = {};
  d.days.forEach(x=>out[x.day]={RED:0,BLUE:0,meta:x});
  let halved=0;
  for (const m of d.matches){
    for (const s of m.singles){
      const {w} = decide(s);
      if (w==="HALVED"){ out[m.day].RED+=.5; out[m.day].BLUE+=.5; halved++; }
      else if (w) out[m.day][w]+=1;
    }
    if (m.fourBBB){
      const w = m.fourBBB.winner;
      if (w==="HALVED"){ out[m.day].RED+=.5; out[m.day].BLUE+=.5; }
      else if (w) out[m.day][w]+=1;
    }
  }
  let R=0,B=0; Object.values(out).forEach(x=>{R+=x.RED;B+=x.BLUE;});
  return {days:out, red:R, blue:B, halved};
}
const played = (y,i)=>(DATA[y].rounds[i]||[]).filter(x=>typeof x==="number");
const nDays = y=>((DATA[y]||{}).days||[]).length||4;
/* Best 3 of 4 — but the worst round is only discarded once the card is FULL.
   Mid-tour every round counts, exactly as the workbook does it:
   1 round -> d1 · 2 -> d1+d2 · 3 -> d1+d2+d3 · 4 -> sum minus worst. */
function best3(y,i){
  const v=played(y,i); if(!v.length) return 0;
  const sum=v.reduce((a,b)=>a+b,0);
  /* 2017's sheet was tidied by deleting each man's discarded round, so what
     survives IS the counting three — discarding again would drop a second score. */
  if ((DATA[y]||{}).roundsAreBest3) return sum;
  return v.length>=nDays(y) ? sum-Math.min(...v) : sum;
}
/* Nett to par against however many rounds are actually counting. */
function nettOf(y,i){
  const v=played(y,i); if(!v.length) return 0;
  const cnt = (DATA[y]||{}).roundsAreBest3 ? v.length
            : (v.length>=nDays(y) ? nDays(y)-1 : v.length);
  return 36*cnt - best3(y,i);
}
function ttOrder(y){
  const d=DATA[y];
  /* The vault years were often settled on a tie — 2018 had four men on 110 — and the
     countback was done on the night, off cards nobody kept. Tom's finishing order is
     the only record of who actually lifted it, so for those years his order breaks
     ties instead of the alphabet. Later years are untouched. */
  if (isVault(y)){
    const seat={}; (d.players||[]).forEach((p,i)=>{ seat[p.id]=i; });
    const champ=(d.touristTrophy||{}).champion;
    return Object.keys(d.rounds).sort((a,b)=> best3(y,b)-best3(y,a)
      || (a===champ?-1:0) || (b===champ?1:0)
      || (seat[a]==null?0:seat[a])-(seat[b]==null?0:seat[b])
      || nm(y,a).localeCompare(nm(y,b)));
  }
  return Object.keys(d.rounds).sort((a,b)=> best3(y,b)-best3(y,a) || nm(y,a).localeCompare(nm(y,b)));
}
function ttRanks(y){
  const ord = ttOrder(y); const ranks={}, tie={};

  ord.forEach((i,ix)=>{ const b=best3(y,i); if(b!==prev){pr=ix+1;prev=b;} ranks[i]=pr; tie[pr]=(tie[pr]||0)+1; });
  return {ord, ranks, tie};
}
function hcpAdj(s){ if(s<=27)return 4; if(s===28)return 3; if(s===29)return 2; if(s===30)return 1;
  if(s<=36)return 0; if(s<=38)return -1; if(s===39)return -2; if(s===40)return -3; return -4; }
/* Is a man's handicap for day N actually SETTLED, or still a projection?
   It is settled once every round before it has been played, because the nightly
   adjustment is what moves it. Day 1 is always settled; day 4 is not settled until
   Saturday night's card is in. Anything shown for an unsettled day is "what it would
   be if nobody moved", which is never what happens — see the ~ in the draw. */
function hcpSettled(y,i,dn){
  const r=((DATA[y]||{}).rounds||{})[i]||[];
  for(let k=0;k<dn-1;k++) if(typeof r[k]!=="number") return false;
  return true;
}
function dailyHcps(y,i){
  const d = DATA[y];
  if (d.dailyHcps && d.dailyHcps[i]) return d.dailyHcps[i];
  const p0 = P(y)[i];
  if (!p0 || typeof p0.startHcp !== "number") return [null,null,null,null];  // vault years often have no handicaps
  const h=[p0.startHcp];
  for(let k=0;k<3;k++){ const s=d.rounds[i][k];
    h.push(h[h.length-1] + (typeof s==="number" ? hcpAdj(s) : 0)); }
  return h;
}
/* A tour only counts once it has actually been played out: every day needs scores
   from at least half the field. A partial tour crowns nobody — and one man's missing
   round (injury, hangover, lost ball in the Mediterranean) won't block the whole tour. */
/* Trophies won, as they stood at the end of any given year. Starts from the
   pre-2021 baseline and walks the recorded results forward; a tie means the
   holders retain, which counts to their tally. Unfinished tours count for nobody. */
function tallyAfter(y){
  const base=LEGACY.trophyTallyPre2021||{RED:0,BLUE:0};
  let R=base.RED||0, B=base.BLUE||0;
  Object.keys(DATA).sort().forEach(yy=>{
    if (+yy>+y) return;
    if (isVault(yy)) return;      // the pre-2021 baseline above already counts these
    if (!tourComplete(yy)) return;
    const ds=dayScores(yy);
    if (ds.red===ds.blue){ const h=((DATA[yy].event||{}).holdersBefore||"BLUE"); if(h==="RED")R++; else B++; }
    else if (ds.red>ds.blue) R++; else B++;
  });
  return {RED:R, BLUE:B};
}
function tourComplete(y){
  const d=DATA[y]; if(!d||!d.days||!d.days.length) return false;
  const ids=Object.keys(d.rounds||{}); if(!ids.length) return false;
  const need=Math.max(1,Math.ceil(ids.length/2));
  return d.days.every((x,k)=>ids.filter(i=>typeof (d.rounds[i]||[])[k]==="number").length>=need);
}
/* Titles are counted from the scorecards wherever we hold them — which, since Tom's
   2014–2020 books were imported, is every tour ever played. The legacy ledger is now
   only a fallback for a year whose card is missing, so a title can never be counted
   twice: once from the data and again from the ledger. */
function ttCareerWins(pid, uptoYear){
  const leg = (LEGACY.careerTouristTrophyWins||{})[pid];
  let n = 0;
  const have = new Set();
  for (const y of Object.keys(BASE)) {
    if (+y > uptoYear) continue;
    have.add(+y);
    const {ord} = ttRanks(y);
    if (ord.length && ord[0]===pid && tourComplete(y)) n++;
  }
  const pre = (leg && leg.pre2021Years) || null;
  if (pre) pre.forEach(y=>{ if (+y<=uptoYear && !have.has(+y)) n++; });
  else if (leg && leg.pre2021) n += leg.pre2021;   // ledger predating per-year detail
  return n;
}
function starStr(n){ return n>0 ? " <span class=\"stars\">"+"★".repeat(Math.min(n,6))+"</span>" : ""; }
function capBadge(y,i){ const p=P(y)[i]; return p&&p.captain ? ' <span class="capb">C</span>' : ""; }
const cName = c => c ? String(c).replace(/\b\w/g,m=>m.toUpperCase()) : "Course TBC";

/* ---------- pre-tour form guide (banter before a ball is struck) ---------- */
function previewAwards(y){
  const d=DATA[y];
  const party=d.players;
  if (!party.length) return [];
  const A=[];
  const ids=party.map(p=>p.id);
  const C={}; ids.forEach(i=>{ try{ C[i]=careerOf(i); }catch(e){ C[i]=null; } });
  const who=i=>"who-"+(party.find(p=>p.id===i)||{team:"RED"}).team.toLowerCase();
  const names={}; party.forEach(p=>names[p.id]=p.name);
  const snm=i=>String(names[i]||i).split(" ").slice(-1)[0];
  const prevY=String(+y-1);
  // defending champion
  if (DATA[prevY]){
    const po=ttOrder(prevY);
    if (po.length && ids.includes(po[0])){
      const cw=ttCareerWins(po[0],+prevY);
      A.push(["Defending Champion", names[po[0]], who(po[0]),
        best3(prevY,po[0])+" points last year · chasing title no. "+(cw+1),
        "Everyone smiles at him on the range. Nobody means it."]);
    }
    const sp=po[po.length-1];
    if (po.length>1 && ids.includes(sp))
      A.push(["Reigning Wooden Spoon", names[sp], who(sp),
        best3(prevY,sp)+" points last year · the title nobody defends on purpose",
        "The kitchen drawer awaits its rightful owner."]);
  }
  // bookies' favourite: career titles then best average finish
  const fav=ids.slice().sort((a,b)=>{
    const t=ttCareerWins(b,+y-1)-ttCareerWins(a,+y-1); if(t) return t;
    const av=i=>{const f=(C[i]&&C[i].finishes)||[]; return f.length?f.reduce((s,x2)=>s+x2.total,0)/f.length:0;};
    return av(b)-av(a); })[0];
  if (fav) A.push(["The Bookies’ Favourite", names[fav], who(fav),
    ttCareerWins(fav,+y-1)+" career titles",
    "The handicap committee has him under 24-hour surveillance."]);
  // captain v captain
  const cR=party.find(p=>p.captain&&p.team==="RED"), cB=party.find(p=>p.captain&&p.team==="BLUE");
  if (cR&&cB){
    let w=0,h=0,l=0;
    Object.keys(BASE).forEach(yy=>BASE[yy].matches.forEach(m=>m.singles.forEach(s=>{
      const pair=[s.red,s.blue];
      if (pair.includes(cR.id)&&pair.includes(cB.id)){
        const {w:ww}=decide(s); if(!ww)return;
        if (ww==="HALVED") h++;
        else { const win=ww==="RED"?s.red:s.blue; if(win===cR.id)w++; else l++; }
      }})));
    A.push(["Captain v Captain", esc(cR.name)+" v "+esc(cB.name), "who-plain",
      (w+h+l)?("Head-to-head: "+cR.name.split(" ").slice(-1)[0]+" "+w+"-"+h+"-"+l):"Never drawn together in the recorded era",
      "Two armbands. One dinner table. No survivors."]);
  }
  // grudge to watch: most-met cross-team pair in the party
  const meets={};
  Object.keys(BASE).forEach(yy=>BASE[yy].matches.forEach(m=>m.singles.forEach(s=>{
    if (ids.includes(s.red)&&ids.includes(s.blue)){
      const k=[s.red,s.blue].sort().join("|");
      const e=meets[k]=meets[k]||{n:0,a:0,b:0,h:0};
      e.n++;
      const {w:ww}=decide(s); if(!ww)return;
      if (ww==="HALVED")e.h++;
      else { const win=ww==="RED"?s.red:s.blue; if(win===k.split("|")[0])e.a++; else e.b++; }
    }})));
  const xteam=(a,b)=> (party.find(p=>p.id===a)||{}).team !== (party.find(p=>p.id===b)||{}).team;
  const grudges=Object.entries(meets).filter(([k])=>{const [a,b]=k.split("|");return xteam(a,b);})
    .sort((a,b)=>b[1].n-a[1].n);
  if (grudges.length){
    const [k,v]=grudges[0]; const [a,b]=k.split("|");
    A.push(["The Grudge Match We Demand", esc(snm(a))+" v "+esc(snm(b)), "who-plain",
      v.n+" career meetings · "+snm(a)+" leads "+v.a+"-"+v.h+"-"+v.b,
      "Chapter "+["","I","II","III","IV","V","VI","VII","VIII"][v.n+1]+". The hat owes us this one."]);
  }
  const fresh=[]; // never-met cross-team pairs
  party.filter(p=>p.team==="RED").forEach(r2=>party.filter(p=>p.team==="BLUE").forEach(b2=>{
    const k=[r2.id,b2.id].sort().join("|");
    if (!meets[k]) fresh.push([r2,b2]);
  }));
  if (fresh.length)
    A.push(["Strangers on the Tee", fresh.length+" pairings never drawn", "who-plain",
      "Including "+esc(fresh[0][0].name.split(" ").slice(-1)[0])+" v "+esc(fresh[0][1].name.split(" ").slice(-1)[0]),
      "Five years of golf and some of these men have never had the pleasure. The generator knows."]);
  // bandit alert: highest start hcp in party
  const bandit=party.slice().sort((a,b)=>(b.startHcp||0)-(a.startHcp||0))[0];
  if (bandit) A.push(["Pre-Tour Bandit Alert", bandit.name, who(bandit.id),
    "Arrives armed with "+bandit.startHcp+" shots",
    "Declare him at customs."]);
  // the drought: most tours, zero titles
  const past=i=>(C[i]?C[i].yrs.filter(yy=>+yy<+y).length:0);
  const dry=ids.filter(i=>ttCareerWins(i,+y-1)===0&&past(i)>0)
    .sort((a,b)=>past(b)-past(a))[0];
  if (dry){
    const extra = dry==="kevin-kiff" ? " (allegedly one — the inquiry continues)" : "";
    A.push(["The Drought", names[dry], who(dry),
      past(dry)+" tours · 0 titles"+extra,
      "Surely this year. (They said that last year.)"]);
  }
  // hot & cold: active singles streaks entering the tour
  function streak(i){
    const ms=(C[i]&&C[i].matches||[]).filter(m=>m.res);
    let k2=ms.length-1, r=null, n=0;
    while(k2>=0){ const x2=ms[k2].res; if(x2==="H")break; if(r===null)r=x2; if(ms[k2].res!==r)break; n++; k2--; }
    return {r,n};
  }
  const hot=ids.map(i=>({i,...streak(i)})).filter(s=>s.r==="W"&&s.n>=2).sort((a,b)=>b.n-a.n)[0];
  const cold=ids.map(i=>({i,...streak(i)})).filter(s=>s.r==="L"&&s.n>=2).sort((a,b)=>b.n-a.n)[0];
  if (hot) A.push(["Arrives in Form", names[hot.i], who(hot.i),
    hot.n+" singles match wins on the spin", "Somebody check his bag for a second driver."]);
  if (cold) A.push(["Arrives in Pieces", names[cold.i], who(cold.i),
    cold.n+" singles match defeats on the spin", "The physio can't help with what's wrong here."]);
  // rookies
  const rooks=party.filter(p=>p.ringer||!C[p.id]||!C[p.id].yrs.length);
  if (rooks.length)
    A.push(["The Unknown Quantity", rooks.map(p=>esc(p.name)).join(" &amp; "), "who-plain",
      "No recorded form whatsoever", "No data. No fear. No idea what's coming, in either direction."]);
  // the ninth star
  const pv=tallyAfter(+y-1);
  A.push(["Star Number "+(pv.BLUE+1), "Team Blue", "who-blue",
    pv.BLUE+"–"+pv.RED+" and holders — Red must take it off them",
    "The empire plans another jubilee. Red plan an uprising."]);
  return A;
}

/* ---------- awards ---------- */
function awards(y){
  const d = DATA[y];
  const ids = Object.keys(d.rounds);
  const done = ids.filter(i=>played(y,i).length>=1);
  if (!done.length) return (+y>=EDIT_FROM) ? previewAwards(y) : [];
  const A = [];
  const wd = {}; d.days.forEach(x=>wd[x.day]=x.weekday||("D"+x.day));
  const {ord, ranks} = ttRanks(y);
  const champ = ord[0], spoon = ord[ord.length-1], brides = ord[1];
  const full = tourComplete(y);

  const rec={}, bbbP={}, recd={};
  ids.forEach(i=>{rec[i]=[0,0,0]; bbbP[i]=0; recd[i]=0;});
  let bestWin=null, bigConcede=null;
  const meets={};
  for (const m of d.matches){
    const reds=m.singles.map(s=>s.red), blues=m.singles.map(s=>s.blue);
    for (const s of m.singles){
      const {w, note} = decide(s);
      if (!w) continue;
      const key=[s.red,s.blue].sort().join("|");
      (meets[key]=meets[key]||[]).push(m.day);
      if (w==="HALVED"){ rec[s.red][1]++; rec[s.blue][1]++; }
      else {
        const win = w==="RED"?s.red:s.blue, lose = w==="RED"?s.blue:s.red;
        rec[win][0]++; rec[lose][2]++;
        const up=Math.max(marginOf(s.result.red)??-1, marginOf(s.result.blue)??-1);
        const tp=Math.min(marginOf(s.result.red)??-1, marginOf(s.result.blue)??-1);
        if(!bestWin || up>bestWin.up || (up===bestWin.up && Math.max(tp,0)>Math.max(bestWin.tp,0)))
          bestWin={up,tp,win,lose,day:m.day,note};
      }
      const hr=dailyHcps(y,s.red)[m.day-1], hb=dailyHcps(y,s.blue)[m.day-1];
      if (typeof hr==="number" && typeof hb==="number"){
        const shots=Math.abs(hr-hb);
        const taker=hr>hb?s.red:s.blue, giver=hr>hb?s.blue:s.red;
        recd[taker]+=shots;
        if(!bigConcede || shots>bigConcede.shots){
          let out="match halved";
          if (w!=="HALVED"){ const wid=w==="RED"?s.red:s.blue;
            out=(wid===giver?"and still won ":"and still lost ")+note; }
          bigConcede={shots,giver,taker,day:m.day,out};
        }
      }
    }
    if (m.fourBBB){
      const w=m.fourBBB.winner;
      const winners = w==="RED"?reds : w==="BLUE"?blues : reds.concat(blues);
      new Set(winners).forEach(i=>bbbP[i]+= w==="HALVED"?.5:1);
    }
  }
  const sgl={}; ids.forEach(i=>sgl[i]=rec[i][0]+.5*rec[i][1]);
  const who = i=>"who-"+tmOf(y,i).toLowerCase();
  const rstr = i=>(d.rounds[i]||[]).map(x=>typeof x==="number"?x:"–").join(" · ");

  if (full){
    A.push(["The Wooden Spoon", nm(y,spoon), who(spoon),
      best3(y,spoon)+" points · last of "+ord.length,
      "Four days of graft. Zero sympathy at this table."]);
    A.push(["The Bridesmaid", nm(y,brides), who(brides),
      best3(y,brides)+" points · "+(best3(y,champ)-best3(y,brides))+" short of the trophy",
      "Always gives the speech. Never lifts the silverware."]);
  }
  let crash=null,surge=null;
  ids.forEach(i=>{ const r=d.rounds[i];
    for(let k=1;k<r.length;k++){ if(typeof r[k]==="number"&&typeof r[k-1]==="number"){
      const dl=r[k]-r[k-1];
      if(!crash||dl<crash.dl)crash={dl,i,k}; if(!surge||dl>surge.dl)surge={dl,i,k}; }}});
  if (crash && surge && crash.dl<0 && surge.dl>0){
    if (crash.i===surge.i)
      A.push(["The Jekyll &amp; Hyde", nm(y,crash.i), who(crash.i), "Rounds of "+rstr(crash.i),
        "Two entirely different golfers share this award. They have never been seen in the same room."]);
    else {
      A.push(["The Overnight Collapse", nm(y,crash.i), who(crash.i),
        d.rounds[crash.i][crash.k-1]+" then "+d.rounds[crash.i][crash.k]+" ("+(crash.dl>0?"+":"")+crash.dl+")",
        "Slept on a lead. Woke up without one."]);
      A.push(["The Lazarus", nm(y,surge.i), who(surge.i),
        d.rounds[surge.i][surge.k-1]+" to "+d.rounds[surge.i][surge.k]+" overnight (+"+surge.dl+")",
        "Reports of this golf game's death were greatly exaggerated."]);
    }
  }
  if (full){
    const cutId = ids.reduce((a,b)=> (dailyHcps(y,a)[0]-dailyHcps(y,a)[3]) >= (dailyHcps(y,b)[0]-dailyHcps(y,b)[3]) ? a : b);
    const c0=dailyHcps(y,cutId)[0], c3=dailyHcps(y,cutId)[3];
    if (c0>c3){
      let line="Cut from "+c0+" to "+c3+" in four days";
      if (cutId===champ) line+=" — and won the trophy";
      A.push(["Bandit Watch", nm(y,cutId), who(cutId), line, "The handicap committee will see you now. Bring a lawyer."]);
    }
  }
  if (bigConcede)
    A.push(["Most Generous Man in Golf", nm(y,bigConcede.giver), who(bigConcede.giver),
      "Gave "+sur(y,bigConcede.taker)+" "+bigConcede.shots+" shots on "+wd[bigConcede.day]+" — "+bigConcede.out,
      "Charity begins on the first tee."]);
  const odId = ids.reduce((a,b)=>recd[a]>=recd[b]?a:b);
  if (recd[odId]>0)
    A.push(["The Overdraft", nm(y,odId), who(odId),
      "Borrowed "+recd[odId]+" shots across the week — more than anyone on tour",
      "The Bank of "+(String(d.event.venue).includes("Saunton")?"Saunton":"Empordà")+" thanks you for your custom."]);
  if (full){
    const conId = ids.reduce((a,b)=>{ const sp=i=>Math.max(...played(y,i))-Math.min(...played(y,i));
      return sp(a)<=sp(b)?a:b; });
    const spv = Math.max(...played(y,conId))-Math.min(...played(y,conId));
    A.push(["Mr Consistent", nm(y,conId), who(conId),
      "Rounds of "+rstr(conId)+" — a spread of just "+spv, "Boring golf. Devastating results."]);
  }
  const asId = ids.reduce((a,b)=> (sgl[a]>sgl[b] || (sgl[a]===sgl[b]&&rec[a][0]>=rec[b][0])) ? a : b);
  if (sgl[asId]>0)
    A.push(["The Assassin", nm(y,asId), who(asId),
      "Singles match record "+rec[asId].join("-"),
      "Shakes your hand on the 1st tee. Takes your point by the 15th."]);
  const paId = ids.reduce((a,b)=>(bbbP[a]-sgl[a])>=(bbbP[b]-sgl[b])?a:b);
  if (bbbP[paId]-sgl[paId]>=1)
    A.push(["The Passenger", nm(y,paId), who(paId),
      half(bbbP[paId])+" four-ball points against "+half(sgl[paId])+" from singles matches",
      "Travelled the week first class, in the better-ball sedan chair."]);
  const tot={}; ids.forEach(i=>tot[i]=sgl[i]+bbbP[i]);
  const mvpMax=Math.max(...Object.values(tot));
  if (mvpMax>0){
    const mvps=ord.filter(i=>tot[i]===mvpMax);
    A.push(["Star Man", mvps.map(i=>esc(nm(y,i))).join(" &amp; "),
      new Set(mvps.map(i=>tmOf(y,i))).size===1?who(mvps[0]):"who-plain",
      half(mvpMax)+" points delivered for the team — no one gave more",
      "Somebody had to do the heavy lifting."]);
  }
  if (bestWin)
    A.push(["The Beatdown", nm(y,bestWin.win), who(bestWin.win),
      "Defeated "+sur(y,bestWin.lose)+" "+bestWin.note+" on "+wd[bestWin.day],
      "Over before the turn. Arguably over at breakfast."]);
  if (full){
    const suId = ids.reduce((a,b)=>{ const l=i=>{const r=d.rounds[i]; const v=r[r.length-1]; return typeof v==="number"?v:-1;};
      return l(a)>=l(b)?a:b; });
    const lastR = d.rounds[suId][d.rounds[suId].length-1];
    A.push(["Sunday Best", nm(y,suId), who(suId),
      lastR+" points in the final round — best on tour",
      "Peaked, magnificently, the moment it no longer mattered."]);
    const reps = Object.entries(meets).filter(([k,v])=>v.length>1);
    if (reps.length){
      const [k,v]=reps.sort((a,b)=>b[1].length-a[1].length)[0];
      const [a,b]=k.split("|");
      A.push(["Groundhog Day", esc(sur(y,a))+" v "+esc(sur(y,b)), "who-plain",
        "Drawn together "+v.length+" times (days "+v.join(", ")+")",
        "The hat has no memory. The players certainly do."]);
    } else {
      const n=d.matches.reduce((t,m)=>t+m.singles.length,0);
      A.push(["The Perfect Draw","The Hat","who-plain", n+" singles matches · no repeat pairing all week",
        "Fresh meat, every single morning. The hat gods smiled."]);
    }
    const cw = ttCareerWins(champ, +y);
    if (cw>1){
      const ordinal={2:"second",3:"third",4:"fourth",5:"fifth",6:"sixth"}[cw]||cw+"th";
      A.push(["The Serial Offender", nm(y,champ), who(champ),
        "Career Tourist Trophy no. "+cw,
        "His "+ordinal+" title. At this point it is simply showing off."]);
    }
    const dyn=tallyAfter(+y-1);
    A.push(["The Dynasty","Team Blue","who-blue",
      dyn.BLUE+"–"+dyn.RED+" in trophies since the tour began",
      "Tour "+(LEGACY.tourNumbering["2026"]||11)+" approaches. The empire shows no sign of falling."]);
  }
  return A;
}

/* ---------- views ---------- */
function vBoard(y){
  const d = DATA[y], ds = dayScores(y);
  const dnames=["","Day One","Day Two","Day Three","Day Four"];
  let cum_r=0, cum_b=0, cells="";
  d.days.forEach(x=>{
    const s=ds.days[x.day]; cum_r+=s.RED; cum_b+=s.BLUE;
    const w = s.BLUE>s.RED?"BLUE":(s.RED>s.BLUE?"RED":(s.RED?"HALVED":"NONE"));
    const wt = {"RED":"Red day","BLUE":"Blue day","HALVED":"Halved","NONE":"—"}[w];
    cells+='<div class="dy"><div class="dy-n">'+dnames[x.day]+'</div>'
      +'<div class="dy-m">'+esc((x.weekday||"")+" · "+cName(x.course))+'</div>'
      +'<div class="dy-s"><span class="t-r">'+half(s.RED)+'</span><span class="dy-dash">–</span><span class="t-b">'+half(s.BLUE)+'</span></div>'
      +'<div class="dy-w w-'+w.toLowerCase()+'">'+wt+'</div>'
      +'<div class="dy-c">after '+half(cum_r)+"–"+half(cum_b)+'</div></div>';
  });
  const total = ds.red+ds.blue;
  const max = d.days.length * (d.matches.length ? (d.matches.reduce((t,m)=>t+m.singles.length,0)/d.days.length + d.matches.filter(m=>m.fourBBB!==null||m.format==="4ball").length/d.days.length) : 10);
  let verdict="", sub="";
  if (total>0){
    if (ds.red===ds.blue){ const h=(d.event.holdersBefore||"BLUE");
      verdict=(h==="BLUE"?"Blues":"Reds")+" retain the trophy"; }
    else verdict=(ds.blue>ds.red?"Blue":"Red")+" win the trophy";
    sub = total? "" : "";
  } else verdict="Awaiting first blood";

/* ---------- all-time stats: the roll of honour & shame ---------- */
function statCareer(){
  const agg={}, names={}, teamAgg={RED:{w:0,h:0,l:0,pts:0,r40:0,rounds:0},BLUE:{w:0,h:0,l:0,pts:0,r40:0,rounds:0}};
  const opp={}, partner={};
  let bigWin=null, bigDay=null, comeback=null, collapse=null;
  const years=Object.keys(DATA).sort().filter(y=>tourComplete(y));   // all-time stats freeze until a tour is finished — the live tour shows on its own Board/Trophy tabs
  const marg=s=>{const r=s.result; if(r==="AS")return null;
    const me=(''+ (r.red==null?'':r.red)).match(/\d+/), mg=(''+(r.blue==null?'':r.blue)).match(/\d+/);
    return [me?+me[0]:-1, mg?+mg[0]:-1];};
  years.forEach(y=>{
    const d=DATA[y], emp=(d.event.venue||"").indexOf("Empord")>=0;
    const ds=dayScores(y);
    d.players.forEach(p=>{ names[p.id]=p.name;
      const a=agg[p.id]=agg[p.id]||{name:p.name,tours:0,sW:0,sH:0,sL:0,bbb:0,rounds:[],byDay:{1:[],2:[],3:[],4:[]},
        empDay:{1:[],2:[],3:[],4:[]}, recd:0,given:0,spoons:0,tt3:0,d4drop:[],startHcps:[],cuts:[],lone2:0,
        r40:0,rSub25:0,tourTotals:[],dejavu:0,palindrome:false,teams:new Set(),lastTeam:p.team,singlesPlayed:0,
        winsUp:0,winsDown:0,winsEq:0,facedUp:0,facedDown:0};
      /* 2014–2016 have no team colours — the tour wasn't Red v Blue yet — so team
         aggregates skip those rounds while the scoring stats still count them. */

      const r=d.rounds[p.id]||[], nums=r.filter(x=>typeof x==="number");
      /* Team aggregates stay a like-for-like 2021+ set: the singles record can only

      const tAgg=isVault(y)?null:teamAgg[p.team];
      const byDayOK = d.dayAttribution!==false;   // 2017's rounds aren't tied to days
      r.forEach((s,k)=>{ if(typeof s==="number"){ a.rounds.push(s); if(byDayOK)a.byDay[k+1].push(s); if(emp)a.empDay[k+1].push(s);
        if(s>=40)a.r40++; if(s<25)a.rSub25++;
        if(tAgg){ tAgg.rounds++; if(s>=40)tAgg.r40++; }
        if(k>0 && typeof r[k-1]==="number"){ const dl=s-r[k-1];
          if(!comeback||dl>comeback.d)comeback={d:dl,id:p.id,from:r[k-1],to:s,year:y,day:k+1};
          if(!collapse||dl<collapse.d)collapse={d:dl,id:p.id,from:r[k-1],to:s,year:y,day:k+1};
          if(s===r[k-1])a.dejavu++; } } });
      if(nums.length===4){ a.tourTotals.push({t:nums.reduce((s,x)=>s+x,0),year:y});

        else{const win=w==="RED"?s.red:s.blue,lose=w==="RED"?s.blue:s.red; agg[win].sW++; agg[lose].sL++;

    d.days.forEach(x=>{ const s=ds.days[x.day], mgn=Math.abs(s.RED-s.BLUE);

    });

/* ---------- Origins: the vault, 2013–2020 ----------
   Tom Pearson kept these by hand. Individual Stableford only — no match record
   survives — so this tab is the showcase for them rather than the year pills,
   which are built around a team scoreboard these years don't have. Every figure
   below is computed from the scores; the prose is the only hand-written part. */
const ORD_WORD = ["","first","second","third","fourth","fifth","sixth","seventh","eighth",
  "ninth","tenth","eleventh","twelfth","thirteenth","fourteenth","fifteenth"];
function ordWord(n){ return ORD_WORD[n] || ("#"+n); }
/* ---------- sovereignty ----------
   Where a man declares himself from. Not always where he was born, and not always
   a country: the Yorkshiremen want the rose, and one man gets a split. */
function flagSVG(spec, cls){
  if (!spec || !FLAGLIB) return "";
  const parts=String(spec).split("+").map(s=>s.trim()).filter(s=>FLAGLIB.flags[s]);
  if (!parts.length) return "";
  const [w,h]=FLAGLIB.aspect;
  const open='<svg class="'+(cls||"flag")+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true" '
    +'preserveAspectRatio="xMidYMid meet">';
  if (parts.length===1) return open+FLAGLIB.flags[parts[0]]+"</svg>";
  /* Nested <svg> viewports clip on their own, so a split needs no clipPath and
     therefore no element ids — any number can share a page safely. */
  const half=w/2;
  return open
    +'<svg x="0" y="0" width="'+half+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" '
    +'preserveAspectRatio="xMidYMid slice">'+FLAGLIB.flags[parts[0]]+'</svg>'
    +'<svg x="'+half+'" y="0" width="'+half+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" '
    +'preserveAspectRatio="xMidYMid slice">'+FLAGLIB.flags[parts[1]]+'</svg>'
    +'<line x1="'+half+'" y1="0" x2="'+half+'" y2="'+h+'" stroke="#fff" stroke-width="1" opacity=".85"/>'
    +"</svg>";
}
function flagFor(pid, cls){
  const pf=LEGACY.playerFlags||{};
  const m=(pf.players||pf)[pid];          // a man with no answer simply shows no flag
  return (m && typeof m==="string") ? flagSVG(m, cls||"flag") : "";
}
/* Folklore: the things no scorecard records. Attached to a player and a year (and

function folkloreFor(pid, y, day){

    && (y==null || +f.year===+y)

}
function heritageLine(y){

function vaultFacts(y){

}

/* ---------- Live Stats ----------
   The end-of-day page: where the Cup stands, who is climbing, what the handicap
   algorithm did to whom, and one deliberately unhelpful hint about tomorrow.
   Built to be screenshotted and sent to people who aren't here. */
function b3upto(y,pid,k){                       // best-3 using only days 1..k
  const v=(DATA[y].rounds[pid]||[]).slice(0,k).filter(x=>typeof x==="number");
  if(!v.length) return 0;
  const sum=v.reduce((a,b)=>a+b,0);
  if ((DATA[y]||{}).roundsAreBest3) return sum;
  return v.length>=nDays(y) ? sum-Math.min(...v) : sum;
}
function rankAfter(y,k){                        // standings as they stood after day k
  const ids=Object.keys(DATA[y].rounds).filter(i=>b3upto(y,i,k)>0);
  ids.sort((a,b)=>b3upto(y,b,k)-b3upto(y,a,k) || nm(y,a).localeCompare(nm(y,b)));
  const r={}; ids.forEach((i,ix)=>r[i]=ix+1);
  return r;
}
function daysPlayed(y){
  const d=DATA[y];
  return (d.days||[]).filter(x=>Object.keys(d.rounds||{})
    .some(i=>typeof (d.rounds[i]||[])[x.day-1]==="number")).length;
}
/* ── Movement on the Tourist Trophy ─────────────────────────────────────────
   Who has climbed and who has slipped since last night's standings. Two rules
   this is built on, both deliberate:
     · the CURRENT position is the one actually printed on the board (ttRanks),
       never a freshly recomputed one, so an arrow can never disagree with the
       number sitting beside it;
     · both sides are tie-aware — men level on points share a position — so
       being caught costs nobody a place, exactly as the board reads it.
   Returns null until there are two nights to compare. Note that on the final
   day the discard bites for the first time, so a man can jump several places
   for reasons beyond that day's card. That is genuinely what happened; it is
   shown as it fell rather than smoothed. */
function ranksUpto(y,k){
  const ids=Object.keys(DATA[y].rounds||{}).filter(i=>b3upto(y,i,k)>0);
  ids.sort((a,b)=>b3upto(y,b,k)-b3upto(y,a,k) || nm(y,a).localeCompare(nm(y,b)));
  const r={}; let prev=null, pr=0;
  ids.forEach((i,ix)=>{ const b=b3upto(y,i,k); if(b!==prev){pr=ix+1;prev=b;} r[i]=pr; });
  return r;
}
function ttMoves(y){
  const done=daysPlayed(y);
  if (done<2) return null;                       // one night is a standing, not a move
  const was=ranksUpto(y,done-1), ranks=ttRanks(y).ranks, out={};
  Object.keys(ranks).forEach(i=>{
    if (!(b3upto(y,i,done)>0)) return;           // no card at all — nothing has moved
    out[i] = (was[i]==null) ? {nw:true} : {d:was[i]-ranks[i], from:was[i], to:ranks[i]};
  });
  return out;
}
/* "since Thursday night" — the night the standings it is measured against were posted. */
function prevNight(y){
  const dd=(DATA[y].days||[])[daysPlayed(y)-2];
  return (dd&&dd.weekday) ? dd.weekday+" night" : "the previous night";
}
function tmvHTML(m,when){

/* The same chevron on the share images. Drawn as a path rather than typed as a
   glyph — canvas fallback for ▲/▼ is unreliable across devices, and these end up
   on WhatsApp. Returns the width used, or 0 if there was nothing to say. */
function cvMove(x,px,py,m,font,size){
  if (!m || m.nw || !m.d) return 0;
  const up=m.d>0, s=size||12, n=String(Math.abs(m.d));
  const ta=x.textAlign, fs=x.fillStyle, ft=x.font;
  x.fillStyle = up?"#3f6b46":"#7a7466";
  x.beginPath();
  if (up){ x.moveTo(px+s/2,py-s); x.lineTo(px+s,py); x.lineTo(px,py); }
  else   { x.moveTo(px+s/2,py);   x.lineTo(px+s,py-s); x.lineTo(px,py-s); }
  x.closePath(); x.fill();
  x.textAlign="left"; x.font="700 "+Math.round(s*1.35)+"px "+font;
  x.fillText(n, px+s+5, py);
  const w=s+5+x.measureText(n).width;
  x.textAlign=ta; x.fillStyle=fs; x.font=ft;
  return w;
}
/* Cumulative Cup points, both sides, across the week. One axis, two series,
   ends direct-labelled and a legend above — identity never by colour alone. */
function cupChart(y,done){
  const ds=dayScores(y), nd=nDays(y);

  const need=Math.floor((nd*10)/2)+0.5;         // points that win it outright

    cr+=s.RED; cb+=s.BLUE;

    +'<text x="'+(W-R)+'" y="'+(py(need)-4).toFixed(1)+'" class="ax winlbl">'+half(need)+' wins it</text>'

    +ptsR.slice(1).map(q=>'<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.4" class="dt dt-r"/>').join("")
    +(done?'<text x="'+(lastR[0]+7)+'" y="'+(lastR[1]+(apart&&cr<cb?9:3)).toFixed(1)+'" class="endlbl el-r">'+half(cr)+'</text>'

/* Tomorrow, without giving it away. Everything here is a COUNT across the whole
   day's draw — never a name, never a pairing, never a number that could isolate
   one man. The draw itself stays sealed until its reveal time. */
function crypticTomorrow(y,done){
  const d=DATA[y], nd=nDays(y);
  if (done>=nd) return "";
  const nxt=done+1;
  const ms=(d.matches||[]).filter(m=>m.day===nxt);
  if (!ms.length) return "";
  /* Judged on the clock, not on who is looking: dayRevealed() always says yes to
     Justin, and this block exists to show what the TEAM sees. */
  const rvAt=revealAt(y,nxt);
  if (!rvAt || new Date()>=rvAt)
    return '<div class="sec"><h2 class="sec-t" style="font-size:clamp(20px,3.8vw,26px)">Tomorrow</h2>'
      +'<div class="sec-s">the draw is out</div>'
      +'<div class="note">Day '+nxt+' has been revealed. It is on the <b>Match Play</b> tab, '
      +'and the complaining window closes at 6am.</div></div>';
  // prior singles meetings, from every tour we hold matches for
  const met={};
  Object.keys(DATA).sort().forEach(yy=>{
    if (+yy>=+y) return;
    (DATA[yy].matches||[]).forEach(m=>m.singles.forEach(s=>{
      const {w}=decide(s); if(!w) return;
      const k=[s.red,s.blue].sort().join("|");
      const e=met[k]=met[k]||{n:0,rw:0,bw:0,last:null};
      e.n++; e.last=+yy;
      if(w!=="HALVED"){ const win=(w==="RED")?s.red:s.blue; e[win===k.split("|")[0]?"rw":"bw"]++; }
    }));
  });
  /* The draw exists to stop men meeting twice, so counting rematches says nothing.
     What is worth teasing is the opposite: how many are meeting for the FIRST time,
     how long the one renewal has been waiting, and whose duck is on the line. */
  let fresh=0, again=0, oneWay=0, shots=0, total=0, oldest=null;
  ms.forEach(m=>m.singles.forEach(s=>{
    total++;
    const k=[s.red,s.blue].sort().join("|"), e=met[k];
    if(!e){ fresh++; }
    else {
      again++;
      if(e.rw===0||e.bw===0) oneWay++;
      if(oldest===null||e.last<oldest) oldest=e.last;
    }
    const a=dailyHcps(y,s.red)[nxt-1], b=dailyHcps(y,s.blue)[nxt-1];
    if(typeof a==="number"&&typeof b==="number") shots+=Math.abs(a-b);

    bits.push("Every pairing tomorrow is a <b>first meeting</b>. The hat has been thorough.");
  else if (fresh)
    bits.push("<b>"+fresh+"</b> of tomorrow&rsquo;s "+total+" have <b>never met</b> in a singles match.");
  if (oldest!=null)
    bits.push("One pairing has been waiting since <b>"+oldest+"</b>.");
  if (oneWay)
    bits.push("In <b>"+oneWay+"</b> of them, one man has never beaten the other.");
  if (shots)
    bits.push("<b>"+shots+"</b> shots change hands before breakfast.");
  return '<div class="sec"><h2 class="sec-t" style="font-size:clamp(20px,3.8vw,26px)">Tomorrow</h2>'
    +'<div class="sec-s">everything except who</div>'
    +'<div class="cryptic"><div class="cry-i">🤫</div><div>'
    +bits.map(b=>'<div class="cry-l">'+b+'</div>').join("")
    +'<div class="cry-f">Names at '+esc(fmtWhen(rvAt))+'. Not before.</div>'
    +'</div></div></div>';
}

  /* the same awards engine the Ammunition tab uses — four of them, tonight's pick */
  let A=[]; try{ A=awards(y)||[]; }catch(e){ A=[]; }
  if (A.length){
    out+='<div class="sec"><h2 class="sec-t" style="font-size:clamp(20px,3.8vw,26px)">Ammunition</h2>'
      +'<div class="sec-s">computed, not invented &middot; the rest are on the Ammunition tab</div>'
      +'<div class="menu">'
      +A.slice(0,4).map(([t,w,cls,stat,q])=>'<div class="aw"><div class="aw-rule"></div>'
        +'<h3 class="aw-title">'+t+'</h3>'
        +'<div class="aw-who '+cls+'">'+(String(w).indexOf("&amp;")>=0||String(w).indexOf("<")>=0?w:esc(w))+'</div>'
        +'<div class="aw-stat">'+stat+'</div><p class="aw-quote">“'+q+'”</p></div>').join("")
      +'</div></div>';
  }
  out+=crypticTomorrow(y,done);
  out+='<div class="note" style="margin-top:24px">Every figure on this page is computed '
    +'from the cards as they stand. Screenshot it and send it to whoever stayed at home.</div>';
  return out;
}
/* ---------- The Rules ----------
   Written once, here, so nobody has to remember them at dinner. The numbers are
   pulled from the engine itself (the handicap ladder, the points on offer) rather
   than typed out, so the page can never quietly disagree with the scoring. */
/* How many tours are actually on record and finished. Spelled out to twelve so the
   prose reads, then numeric beyond — and never hard-coded, which is how "five years"
   survived long after there were twelve. */
const WORDNUM=["zero","one","two","three","four","five","six","seven","eight","nine",
  "ten","eleven","twelve"];
function countedTours(){
  const n=Object.keys(DATA).filter(y=>tourComplete(y)).length;
  return WORDNUM[n] || String(n);
}
function hcpLadder(){
  const rows=[]; let from=null, prev=null;
  for (let s=18; s<=45; s++){
    const a=hcpAdj(s);
    if (a!==prev){ if(prev!==null) rows.push([from, s-1, prev]); from=s; prev=a; }
  }
  rows.push([from, 45, prev]);
  return rows.map(([a,b,adj])=>{
    const band = a<=18 ? b+" or fewer" : (b>=45 ? a+" or more" : (a===b ? String(a) : a+"–"+b));
    return '<tr><td>'+band+'</td><td class="'+(adj>0?"up":(adj<0?"dn":"lv"))+'">'
      +(adj>0?"+"+adj:(adj<0?adj:"0"))+'</td></tr>';
  }).join("");
}

/* Who won the team match in a given year. Three sources, in order: the matches
   themselves where we hold them, the pre-2021 ledger where only the result survives,
   and 2014's job-title teams, which were not Red v Blue at all. */
function teamWinner(y){
  const d=DATA[y]||{};
  const lr=d.legacyTeamResult;
  if (lr && lr.winner) return {cls:"other", label:lr.winner+" won", retained:false};
  // a team match nobody can quite account for still beats claiming there wasn't one
  if (lr && lr.uncertain)
    return {cls:"none", label:(lr.format||"Team match")+", winner unclear", retained:false};
  const ds=dayScores(y);
  if (ds.red||ds.blue){
    if (ds.red===ds.blue){
      const h=((d.event||{}).holdersBefore)||"BLUE";
      return {cls:h.toLowerCase(), label:h==="RED"?"Red retain":"Blue retain", retained:false};
    }
    const w=ds.red>ds.blue?"RED":"BLUE";
    return {cls:w.toLowerCase(), label:w==="RED"?"Red win":"Blue win", retained:false};
  }
  const leg=(LEGACY.trophyWinnersPre2021||{})[y];
  if (leg) return {cls:leg.toLowerCase(), label:leg==="RED"?"Red win":"Blue win", retained:false};
  // 2015 and any year still to be played: say so rather than leave a gap in the grid
  return {cls:"none", label:tourComplete(y)?"No team match":"Not yet played", retained:false};
}

/* ══════════ THE ALBUM ═══════════════════════════════════════════════════════
   A year of photographs, kept in the same repository as the app and viewable from
   inside it. Two things make this cheap enough to carry:
     · the pictures are FILES, never embedded — the app's own weight is unchanged;
     · the grid pulls a ~14 KB thumbnail per photo and the full picture only when
       one is actually opened.
   Justin adds to it from the Keeper phone during the tour, using the GitHub token
   already in that browser — the same route the Publish button uses for the scores.
   Nobody else can write to it, which is the trade he chose knowingly. */
let ALBUMS=null, albErr=null, albInFlight=null, albBusy=false;

/* Where the photographs live. The hosted pages sit beside them; the local admin
   file is opened from disk and must reach them over the public site instead. */
function albumBase(){
  if (HOSTED) return "albums/";
  const c=pubCfg();
  return c ? "https://"+c.owner+".github.io/"+c.repo+"/albums/" : "albums/";
}
async function loadAlbums(force){
  if (ALBUMS && !force) return ALBUMS;
  /* Share the in-flight request rather than bailing out. The old version returned
     null to a second caller, so an upload starting while the first load was still
     running got no manifest at all. */
  if (albInFlight) return albInFlight;
  albInFlight = (async () => {
  albErr=null;
  try{
    if (HOSTED){
      const r=await fetch("albums.json?t="+Date.now(),{cache:"no-store"});
      ALBUMS = r.ok ? await r.json() : {};
    } else {
      /* file:// cannot fetch the site, so read the manifest through the API — the
         same trick checkSite() uses. The images themselves are <img> tags and are
         not subject to this. */
      const c=pubCfg();
      if (!c){ ALBUMS={}; albErr="Set up GitHub in the publish panel to see albums here."; }
      else {
        const r=await fetch("https://api.github.com/repos/"+c.owner+"/"+c.repo
          +"/contents/albums.json?t="+Date.now(),
          {headers:{Authorization:"Bearer "+c.token, Accept:"application/vnd.github+json"}});
        if (r.status===404) ALBUMS={};
        else if (!r.ok) { ALBUMS={}; albErr="Could not read the album ("+r.status+")."; }
        else { const j=await r.json();
          ALBUMS=JSON.parse(decodeURIComponent(escape(atob(String(j.content||"").replace(/\s/g,""))))); }
      }
    }
  }catch(e){ ALBUMS={}; albErr="Could not read the album: "+e.message; }
  /* NEVER re-render while an upload is running: render() rebuilds the view, which
     detaches the very progress and error elements the upload is writing into — so
     every photo could go up perfectly and show no sign of it. That is exactly what
     happened on the first phone test. */
  if (curTab==="album" && !albBusy) render();
  return ALBUMS;
  })();
  try { return await albInFlight; } finally { albInFlight=null; }
}
function albumOf(y){ return (ALBUMS&&ALBUMS[y])||[]; }
/* An older phone falls back to JPEG, so the stored extension decides the URL —
   assuming .webp would give that photo a broken frame for ever. */
const albExt = p => p.ext || "webp";
const albThumbURL = (y,p) => albumBase()+y+"/"+p.id+"-t."+albExt(p);
const albFullURL  = (y,p) => albumBase()+y+"/"+p.id+"."+albExt(p);

function vAlbum(y){
  let out='<h2 class="sec-t">The Album</h2>'
    +'<div class="sec-s">'+y+' &middot; photographs from the tour</div>';
  if (ALBUMS===null){ loadAlbums(); return out+'<div class="alb-empty">Loading&hellip;</div>'; }
  if (albErr) out+='<div class="alb-err" style="text-align:center">'+esc(albErr)+'</div>';
  const shots=albumOf(y);
  if (!READONLY) out+=albUploader(y, shots.length);
  if (!shots.length)
    return out+'<div class="alb-empty">No photographs for '+y+' yet.'
      +(READONLY?' They go up as the tour happens.':'')+'</div>';
  out+='<div class="alb-bar"><span class="alb-n">'+shots.length+' photograph'
    +(shots.length===1?"":"s")+'</span></div><div class="alb-grid">';
  shots.forEach((p,i)=>{
    out+='<div class="alb-c" role="button" tabindex="0" onclick="albOpen(\''+y+'\','+i+')">'
      +'<img src="'+albThumbURL(y,p)+'" loading="lazy" decoding="async" '
      +'alt="'+esc(p.cap||(y+" photograph"))+'">'
      +(READONLY?"":'<button class="alb-x" title="Remove" '
        +'onclick="event.stopPropagation();albRemove(\''+y+'\',\''+esc(p.id)+'\')">&times;</button>')
      +'</div>';
  });
  return out+'</div><p class="note">Tap a photograph to see it full size.</p>';
}

/* ---- the viewer ---- */
let lbY=null, lbI=0;
window.albOpen = (y,i) => {
  lbY=y; lbI=i;
  let ov=document.getElementById("lbOv");
  if (!ov){
    ov=document.createElement("div"); ov.id="lbOv"; ov.className="lb-ov";
    document.body.appendChild(ov);
    ov.addEventListener("click", e=>{ if(e.target===ov) albClose(); });
    let x0=null;
    ov.addEventListener("touchstart", e=>{ x0=e.touches[0].clientX; }, {passive:true});
    ov.addEventListener("touchend", e=>{
      if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
      if(Math.abs(dx)>44) albStep(dx<0?1:-1);
    }, {passive:true});
  }
  document.body.style.overflow="hidden";
  albPaint();
};
function albPaint(){
  const ov=document.getElementById("lbOv"); if(!ov) return;
  const shots=albumOf(lbY), p=shots[lbI]; if(!p){ albClose(); return; }
  ov.innerHTML='<button class="lb-b lb-x" onclick="albClose()" aria-label="Close">&times;</button>'
    +'<button class="lb-b lb-p" onclick="albStep(-1)" aria-label="Previous"'+(lbI?"":" disabled")+'>&lsaquo;</button>'
    +'<button class="lb-b lb-nx" onclick="albStep(1)" aria-label="Next"'+(lbI<shots.length-1?"":" disabled")+'>&rsaquo;</button>'
    +'<img class="lb-im" src="'+albFullURL(lbY,p)+'" alt="'+esc(p.cap||"")+'">'
    +(p.cap?'<div class="lb-cap">'+esc(p.cap)+'</div>':"")
    +'<div class="lb-ct">'+(lbI+1)+' of '+shots.length+'</div>';
}
window.albStep = d => { const n=albumOf(lbY).length;
  lbI=Math.max(0,Math.min(n-1,lbI+d)); albPaint(); };
window.albClose = () => {
  const ov=document.getElementById("lbOv"); if(ov) ov.remove();
  document.body.style.overflow="";
};
document.addEventListener("keydown", e=>{
  if(!document.getElementById("lbOv")) return;
  if(e.key==="Escape") albClose();
  else if(e.key==="ArrowLeft") albStep(-1);
  else if(e.key==="ArrowRight") albStep(1);
});

const ALB_FULL=1400, ALB_THUMB=400;

function albUploader(y, n){

    +' <button class="btn-quiet" style="padding:3px 9px;font-size:10px" '

/* Decode, shrink to fit, re-encode — all on this device, before anything is sent.
   Two deliberate choices here:
     · an <img> rather than createImageBitmap. Browsers apply a photograph's EXIF
       orientation when rendering an <img>, whereas createImageBitmap only honours
       it via an option Safari did not support until 16.4 — which would have put
       iPhone photographs on the site sideways.
     · toDataURL rather than toBlob. The GitHub API wants base64 anyway, so this
       skips both the Blob and the FileReader, and it is synchronous.
   A browser that cannot encode WebP returns PNG from toDataURL; that is the signal
   to ask for JPEG instead, so an older phone still works, just with bigger files. */
async function albShrink(img, max){
  const sc = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1,Math.round(img.naturalWidth*sc)), h = Math.max(1,Math.round(img.naturalHeight*sc));
  const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
  const cx = cv.getContext("2d");
  cx.fillStyle="#fff"; cx.fillRect(0,0,w,h);        // so a transparent PNG isn't black
  cx.drawImage(img,0,0,w,h);
  const q = max>600 ? 0.72 : 0.68;
  let url = cv.toDataURL("image/webp", q), ext="webp";
  if (url.indexOf("data:image/webp")!==0){ url = cv.toDataURL("image/jpeg", q); ext="jpg"; }
  return {b64:url.split(",")[1], w, h, ext};
}
function albLoadImg(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ res({im, done:()=>URL.revokeObjectURL(url)}); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("this file could not be read as an image")); };
    im.src=url;
  });
}
/* ---- writing to the repository ------------------------------------------
   ONE commit for a whole batch, built through the git plumbing API rather than a
   PUT per file. This matters more than it looks: the Contents API makes a commit
   every call, and GitHub Pages only rebuilds the site about ten times an hour — so
   twenty photographs written a file at a time (40 files plus a manifest rewrite
   each) produced roughly sixty commits, throttled the build queue, and left the
   TEAM SITE stale for ages even though every file was safely in the repository.
   Blobs are free: they cost no commit at all. */
async function albAPI(cfg, path, opt){
  const r=await fetch("https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+path,
    {...(opt||{}), headers:{Authorization:"Bearer "+cfg.token,
      Accept:"application/vnd.github+json", ...((opt||{}).headers||{})}});
  if (!r.ok){
    let m=""; try{ m=(await r.json()).message||""; }catch(e){}
    throw new Error(r.status+(m?" "+m:""));
  }
  return r.json();
}
let albBranch=null;
async function albDefaultBranch(cfg){
  if (albBranch) return albBranch;
  albBranch=(await albAPI(cfg,"")).default_branch || "main";
  return albBranch;
}
/* files: [{path, b64}] — all written in a single commit. */
async function albCommit(cfg, files, msg, note){
  const br=await albDefaultBranch(cfg);
  const ref=await albAPI(cfg,"/git/ref/heads/"+encodeURIComponent(br));
  const head=ref.object.sha;
  const base=(await albAPI(cfg,"/git/commits/"+head)).tree.sha;
  const tree=[];
  for (let i=0;i<files.length;i++){
    if (note) note("Sending "+(i+1)+" of "+files.length+" file"+(files.length===1?"":"s")+"…");
    const b=await albAPI(cfg,"/git/blobs",{method:"POST",
      body:JSON.stringify({content:files[i].b64, encoding:"base64"})});
    tree.push({path:files[i].path, mode:"100644", type:"blob", sha:b.sha});
  }
  const t=await albAPI(cfg,"/git/trees",{method:"POST",
    body:JSON.stringify({base_tree:base, tree})});
  const c=await albAPI(cfg,"/git/commits",{method:"POST",
    body:JSON.stringify({message:msg, tree:t.sha, parents:[head]})});
  await albAPI(cfg,"/git/refs/heads/"+encodeURIComponent(br),
    {method:"PATCH", body:JSON.stringify({sha:c.sha})});
  return c.sha;
}
window.albPick = async (y) => {
  const el=document.getElementById("albFile"), cfg=pubCfg();
  if(!el||!el.files||!el.files.length||!cfg) return;
  const files=[...el.files];
  el.value="";                                            // so the same photo can be re-picked
  /* looked up by id on every call, so a re-render cannot leave us writing into a
     detached node */
  const say=t=>{ const el2=document.getElementById("albProg"); if(el2) el2.textContent=t; };
  const bad=[];
  albBusy=true;
  say("Checking the album…");
  try{ await loadAlbums(true); }                          // never write over the other device
  catch(e){ bad.push("could not read the album — "+e.message); }
  if (!ALBUMS) ALBUMS={};
  let done=0;
  /* Batched so a big selection still lands in a handful of commits rather than one
     enormous request, and so progress is visible along the way. */
  const BATCH=8;
  for (let b=0; b<files.length && !bad.some(x=>x.indexOf("commit")===0); b+=BATCH){
    const slice=files.slice(b, b+BATCH), put=[], added=[];
    for (let i=0;i<slice.length;i++){
      const f=slice[i];
      say("Preparing "+(b+i+1)+" of "+files.length+"…");
      let got=null;
      try{
        got=await albLoadImg(f);                          // decoded once, used for both sizes
        const full=await albShrink(got.im, ALB_FULL), th=await albShrink(got.im, ALB_THUMB);
        /* fixed at upload and never reused, so a photograph's URL never changes */
        const id=y+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6);
        put.push({path:"albums/"+y+"/"+id+"."+full.ext, b64:full.b64});
        put.push({path:"albums/"+y+"/"+id+"-t."+th.ext, b64:th.b64});
        added.push({id, w:full.w, h:full.h, at:new Date().toISOString(), ext:full.ext, cap:""});
      }catch(e){ bad.push(f.name+" — "+e.message); }
      finally { if (got) got.done(); }
    }
    if (!put.length) continue;
    const list=(ALBUMS[y]||[]).concat(added);
    put.push({path:"albums.json",
      b64:btoa(unescape(encodeURIComponent(JSON.stringify({...ALBUMS, [y]:list}))))});
    try{
      await albCommit(cfg, put, "NTRC album "+y+" · "+added.length+" photo"
        +(added.length===1?"":"s"), say);
      ALBUMS[y]=list; done+=added.length;                 // only count what really landed
    }catch(e){ bad.push("commit failed — "+e.message); }
  }
  albBusy=false;
  try{ localStorage.setItem("ntrc.albumLast", new Date().toISOString()); }catch(e){}
  /* Repaint FIRST, then write the result into the fresh elements. The other way
     round, render() replaced the panel and wiped the confirmation the moment it
     appeared — which is why the first phone test looked like nothing happened. */
  render();
  say(done+" of "+files.length+" added to "+y+(bad.length?" · "+bad.length+" failed":"")
      +". The team site rebuilds in a minute or two.");
  const errs=document.getElementById("albErrs");
  if (errs) errs.innerHTML=bad.map(x=>"• "+esc(x)).join("<br>");
};
window.albCheck = async () => { ALBUMS=null; albErr=null; await loadAlbums(true); render(); };
window.albRemove = async (y,id) => {
  if (!confirm("Remove this photograph from the "+y+" album?")) return;
  const cfg=pubCfg(); if(!cfg) return;
  await loadAlbums(true);
  ALBUMS[y]=(ALBUMS[y]||[]).filter(p=>p.id!==id);

     delete would need another two API calls to achieve nothing anyone can see */
  try{
