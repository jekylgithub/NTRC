<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NTRC — Not the Ryder Cup</title>
<link rel="manifest" href="keeper.webmanifest">
<link rel="apple-touch-icon" href="keeper-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NTRC Keeper">
<meta name="theme-color" content="#122341">
<style>
:root{
  --paper:#f7f4ec; --card:#fdfcf8; --ink:#1c2740; --navy:#122341; --navy2:#1a2f54;
  --mut:#7a7466; --faint:#a49d8d; --hair:#e2dccb; --hair2:#cfc7ae;
  --gold:#a8863c; --gold-pale:#d9c89a; --gold-wash:rgba(168,134,60,.07);
  --red:#a32636; --blue:#1e4f8f;
  --serif:"Charter","Bitstream Charter","Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--navy);}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;line-height:1.45;min-height:100vh;}
.t-r{color:var(--red);} .t-b{color:var(--blue);} .mutd{color:var(--mut);}

/* app chrome */
.chrome{position:sticky;top:0;z-index:20;background:var(--navy);color:#f4f1e8;
  box-shadow:0 2px 10px rgba(18,35,65,.25);
  /* installed on iPhone the page runs under the clock / Dynamic Island / signal:
     let the navy fill that strip, and push our own content clear of it */
  padding-top:env(safe-area-inset-top,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);}
.chrome-in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 14px 4px;flex-wrap:wrap;}
.brand{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.04em;}
.brand em{font-style:normal;color:var(--gold-pale);}
.yearsel{margin-left:auto;}
.yearsel select{font-family:var(--sans);font-size:13px;background:var(--navy2);color:#f4f1e8;
  border:1px solid rgba(217,200,154,.4);border-radius:4px;padding:5px 8px;}
.tabs-wrap{position:relative;max-width:960px;margin:0 auto;}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:6px 8px 0;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none}
/* fades + chevrons that appear only when there are more tabs off-screen either way */
.tabs-wrap::before,.tabs-wrap::after{content:"";position:absolute;top:0;bottom:0;width:40px;
  pointer-events:none;z-index:3;opacity:0;transition:opacity .25s;display:flex;align-items:center;
  color:var(--gold-pale);font-size:17px;font-weight:700;}
.tabs-wrap::before{left:0;justify-content:flex-start;padding-left:6px;content:"‹";
  background:linear-gradient(90deg,var(--navy) 45%,transparent);}
.tabs-wrap::after{right:0;justify-content:flex-end;padding-right:6px;content:"›";
  background:linear-gradient(270deg,var(--navy) 45%,transparent);}
.tabs-wrap.more-left::before{opacity:1;}
.tabs-wrap.more-right::after{opacity:1;animation:tabnudge 1.6s ease-in-out 3;}
@keyframes tabnudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-4px)}}
@media(prefers-reduced-motion:reduce){.tabs-wrap.more-right::after{animation:none;}}
.tab{flex:none;background:none;border:none;color:rgba(244,241,232,.66);font-family:var(--sans);
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  padding:9px 12px 11px;cursor:pointer;border-bottom:2px solid transparent;}
.tab.on{color:var(--gold-pale);border-bottom-color:var(--gold);}
/* a dot in the gap, so the names read as a list rather than a run-on */
.tab{position:relative;}
.tab:not(:last-child)::after{content:"";position:absolute;right:-3px;top:calc(50% - 2px);
  width:3px;height:3px;border-radius:50%;background:rgba(244,241,232,.26);pointer-events:none;}
.wxbar{max-width:960px;margin:0 auto;text-align:center;padding:2px 14px 9px;
  font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:rgba(244,241,232,.6);
  font-variant-numeric:tabular-nums;line-height:1.7;}
.wxbar b{font-weight:600;color:rgba(244,241,232,.9);}
.wxbar .wx{color:var(--gold-pale);}
.wxbar .cd{color:var(--gold-pale);font-weight:600;letter-spacing:.14em;}
.wxbar .cd-live{color:#fff;}
.wxbar .sep{opacity:.4;margin:0 6px;}
@media(max-width:520px){
  /* phone: clocks on their own line, weather + countdown on the next */
  .wxbar .bar-times,.wxbar .bar-env{display:block;}
  .wxbar .bar-env{margin-top:2px;}
  .wxbar .bar-sep{display:none;}
}
@media(max-width:420px){ .wxbar{font-size:10px;letter-spacing:.1em;} }
.yrs{max-width:960px;margin:0 auto;display:flex;justify-content:center;gap:7px;
  padding:9px 10px 11px;flex-wrap:wrap;border-top:1px solid rgba(217,200,154,.14);}
.yr-pill{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;font-weight:600;
  color:rgba(244,241,232,.55);background:none;border:1px solid rgba(217,200,154,.28);
  border-radius:999px;padding:5px 13px;cursor:pointer;font-variant-numeric:tabular-nums;}
.yr-pill.on{color:var(--gold-pale);border-color:var(--gold);background:rgba(217,200,154,.1);}
.wrap{max-width:960px;margin:0 auto;
  padding-top:clamp(22px,4vw,44px);
  padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));
  padding-left:max(clamp(14px,4vw,40px), env(safe-area-inset-left,0px));
  padding-right:max(clamp(14px,4vw,40px), env(safe-area-inset-right,0px));}

/* masthead / plaque / shared (approved design) */
.mast{text-align:center;}
.kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
.mast h1{margin:0;font-family:var(--serif);font-weight:700;color:var(--navy);
  font-size:clamp(28px,6vw,46px);line-height:1.05;text-wrap:balance;}
.mast-rule{display:flex;align-items:center;gap:14px;margin:14px auto 10px;max-width:400px;}
.mast-rule span{flex:1;height:1px;background:var(--hair2);}
.mast-rule em{font-family:var(--serif);font-style:normal;color:var(--gold);font-size:16px;letter-spacing:.22em;}
.subtitle{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);}
.plaque{margin:clamp(22px,4vw,36px) auto 0;max-width:620px;}
.plq-in{overflow:hidden;background:linear-gradient(180deg,var(--navy2),var(--navy));border-radius:6px;
  box-shadow:inset 0 0 0 1px rgba(217,200,154,.55), inset 0 0 0 5px var(--navy), inset 0 0 0 6px rgba(217,200,154,.25),
  0 12px 30px rgba(18,35,65,.18);
  padding:clamp(18px,4vw,30px) clamp(16px,4vw,36px);text-align:center;color:#f4f1e8;}
.plq-label{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold-pale);margin-bottom:8px;}
.plq-row{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2.5vw,24px);width:100%;}
/* equal-width flanks keep the score dead centre however many stars a side has */
.plq-team{flex:1 1 0;min-width:0;
  font-family:var(--serif);font-size:clamp(13px,2.7vw,20px);letter-spacing:.18em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;gap:5px;}
.plq-red{color:#e4a9a9;} .plq-blue{color:#a9c2e8;}
.plq-stars{font-size:8.5px;letter-spacing:.2em;color:var(--gold-pale);opacity:.75;text-indent:.2em;
  max-width:100%;line-height:1.5;overflow-wrap:anywhere;}
.plq-capn{font-family:var(--sans);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(244,241,232,.55);max-width:100%;line-height:1.35;
  display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;text-align:center;}
.plq-capn .capb{width:13px;height:13px;line-height:13px;font-size:8px;vertical-align:0;flex:none;}
.plq-score{flex:0 0 auto;font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums;
  display:flex;align-items:baseline;gap:clamp(6px,1.6vw,16px);line-height:1;}
.plq-score b{font-weight:700;font-size:clamp(48px,12vw,92px);white-space:nowrap;}
.plq-score i{font-style:normal;font-size:clamp(22px,5vw,40px);color:var(--gold-pale);
  align-self:center;line-height:1;transform:translateY(-.08em);}
.plq-score .fr{font-size:.46em;vertical-align:.34em;letter-spacing:0;margin-left:.02em;}
@media(max-width:430px){
  .plq-row{flex-wrap:wrap;row-gap:14px;}
  .plq-score{order:-1;flex:0 0 100%;justify-content:center;}
  .plq-team{flex:1 1 40%;}
  .plq-stars{font-size:9.5px;letter-spacing:.16em;}
}
.plq-verdict{margin-top:12px;font-size:clamp(11px,2.2vw,14px);letter-spacing:.26em;text-transform:uppercase;color:var(--gold-pale);}
.plq-sub{margin-top:7px;font-size:10.5px;letter-spacing:.1em;color:rgba(244,241,232,.55);text-transform:uppercase;}
.days{display:grid;grid-template-columns:repeat(4,1fr);margin:clamp(24px,4vw,40px) 0 0;
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);}
.dy{padding:18px 6px 16px;text-align:center;border-left:1px solid var(--hair);}
.dy:first-child{border-left:0;}
.dy-n{font-family:var(--serif);font-size:14px;color:var(--navy);font-weight:700;}
.dy-m{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:2px;}
.dy-s{font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums;font-weight:700;
  font-size:clamp(20px,4vw,28px);margin-top:9px;display:flex;justify-content:center;gap:6px;align-items:baseline;}
.dy-dash{color:var(--faint);font-weight:400;}
.dy-w{margin-top:7px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;}
.w-red{color:var(--red);} .w-blue{color:var(--blue);} .w-halved{color:var(--mut);} .w-none{color:var(--faint);}
.dy-c{margin-top:3px;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;}
.sec{margin-top:clamp(30px,5vw,48px);}
.sec-t{margin:0;font-family:var(--serif);font-weight:700;color:var(--navy);text-align:center;
  font-size:clamp(22px,4.2vw,30px);}
.sec-s{text-align:center;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);
  margin:7px 0 22px;}
.mpd{margin-bottom:26px;}
.mpd-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;
  border-bottom:1px solid var(--hair2);padding-bottom:7px;margin-bottom:10px;}
.mpd-t{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:15px;}
.mpd-s{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;}
.grps{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
.grp{background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:11px 14px;}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.tee{font-size:10.5px;letter-spacing:.16em;color:var(--gold);font-weight:600;text-transform:uppercase;}
.gfmt{font-size:9.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;}
/* why a group is where it is in the running order — a fixed pairing, an early flight.
   Quiet and in the serif, so it reads as a note rather than as part of the scoring. */
.grp-n{font-family:var(--serif);font-style:italic;font-size:11.5px;color:var(--gold);
  margin:-1px 0 6px;line-height:1.35;}
/* the Draw tab's "built around" panel — standing arrangements, stated before the draw */
.fxd{border-left:3px solid var(--gold);text-align:left;}
.fxd-h{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
  font-weight:600;margin-bottom:7px;}
.fxd-r{font-size:13.5px;line-height:1.5;margin:3px 0;}
.fxd-w{color:var(--mut);font-family:var(--serif);font-style:italic;}
/* legend for the ~ on unsettled shots, under the draw */
.dlegend{max-width:640px;margin:4px auto 0;text-align:center;font-size:11.5px;line-height:1.6;
  color:var(--mut);font-family:var(--serif);font-style:italic;}
.dlegend b{font-style:normal;color:var(--gold);font-size:13px;}
.sgl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px;padding:6px 0;
  border-top:1px solid var(--hair);}
.sgl:first-of-type{border-top:0;}
.grp-n + .sgl{border-top:0;}   /* the note displaces :first-of-type — keep the old look */
/* playing handicaps under each singles pairing — present, but never competing
   with the names or the result */
.sgl-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px;
  margin:-3px 0 4px;font-size:10px;color:var(--faint);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.sgl-h span:first-child{text-align:left;} .sgl-h span:last-child{text-align:right;}
.sgl-sh{text-align:center;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--hair2);white-space:nowrap;}
.sgl-plus{font-weight:700;}   /* colour comes from .t-r / .t-b — whoever receives */
.nm{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.nm:last-child{text-align:right;}
.nm.win{font-weight:700;}
.nm.lose{color:var(--faint);}
.sc-note{font-family:var(--serif);font-size:13px;font-weight:700;white-space:nowrap;}
.sc-halved{color:var(--mut);font-weight:400;}
.sc-tbd{color:var(--faint);font-weight:400;font-size:11px;letter-spacing:.1em;}
.fb{margin-top:7px;padding-top:6px;border-top:1px solid var(--hair);text-align:center;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);}
.fb b{font-weight:700;}
.lb{border-top:2px solid var(--navy);border-bottom:1px solid var(--hair2);}
.row{display:grid;grid-template-columns:42px 1fr 160px 58px 60px 52px;gap:9px;align-items:center;
  padding:11px 6px;border-top:1px solid var(--hair);}
.row.hd{border-top:0;padding:8px 6px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mut);font-weight:600;}
.row.champ{background:var(--gold-wash);}
.c-pos{font-family:var(--serif);color:var(--mut);font-size:14px;}
.row.champ .c-pos{color:var(--gold);font-weight:700;}
/* Movement on the Tourist Trophy — places climbed or slipped since the previous
   night. It sits under the position, which is the thing it describes. The GLYPH
   carries the meaning, never the colour alone, so it still reads in a screenshot,
   in grayscale, and to a colour-blind eye. */
.tmv{display:block;font-family:var(--sans);font-size:9.5px;font-weight:700;line-height:1;
  margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.tmv-up{color:#3f6b46;}
.tmv-dn{color:var(--mut);}
.tmv-lvl{color:var(--faint);font-weight:600;}
.tmv-new{color:var(--faint);font-size:8px;letter-spacing:.1em;text-transform:uppercase;}
.c-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap;}
.c-team{width:7px;height:7px;border-radius:50%;flex:none;}
.c-red{background:var(--red);} .c-blue{background:var(--blue);}
.rtag{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;flex:none;
  padding:2px 6px;border-radius:3px;}
.rtag-gold{color:var(--gold);border:1px solid var(--gold-pale);background:#fff;}
.rtag-mute{color:var(--mut);border:1px solid var(--hair2);background:#fff;}
/* Stars sit on the text baseline by default, which leaves them hanging low against
   a big serif name. Centre them on the name's own line box instead. */
.stars{color:var(--gold);font-size:11px;letter-spacing:.06em;
  display:inline-block;vertical-align:middle;position:relative;top:-0.08em;}
.c-rounds{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--mut);white-space:nowrap;}
.c-rounds s{color:var(--faint);}
.c-rec{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--mut);text-align:center;}
.c-b3{font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums;font-weight:700;
  font-size:19px;color:var(--navy);text-align:right;}
.row.champ .c-b3{color:var(--gold);}
.c-nett{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--mut);text-align:right;}
/* ---- Winners: one page per year, the Cup then the Tourist Trophy ----
   Built phone-first — every grid below is a single column until there is room,
   because this is the page people will open on a train to settle an argument. */
.wsec{background:var(--card);border:1px solid var(--hair2);border-radius:4px;
  margin-top:26px;padding:0 0 22px;overflow:hidden;}
.wband{padding:9px 14px;text-align:center;font-size:10px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:#fff;}
.wband.rband-red{background:var(--red);} .wband.rband-blue{background:var(--blue);}
.wband.rband-other,.wband.rband-none{background:var(--mut);}
.wband-gold{background:var(--navy);color:var(--gold-pale);}
.wsec-h{font-family:var(--serif);font-size:clamp(24px,5.4vw,34px);font-weight:700;
  color:var(--navy);text-align:center;margin:18px 16px 0;line-height:1.25;}
.wsec-flag{width:26px;height:17px;vertical-align:-2px;margin-right:9px;}
.wsec-n{text-align:center;color:var(--faint);font-size:11px;font-style:italic;margin-top:6px;}
.wscore{font-family:var(--serif);font-weight:700;color:var(--navy);text-align:center;
  font-size:clamp(40px,11vw,64px);line-height:1;margin:10px 0 4px;
  font-variant-numeric:tabular-nums lining-nums;}
.wscore i{font-style:normal;color:var(--faint);margin:0 .14em;}
.wscore-gold{color:var(--gold);}
.wsc-u{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mut);margin-top:8px;font-family:var(--sans);font-weight:600;}
/* the photograph, or the space reserved for one */
.wp{margin:18px 16px 0;border-radius:3px;overflow:hidden;}
.wp img{display:block;width:100%;height:auto;}
.wp figcaption{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--mut);
  text-align:center;padding:8px 4px 0;}
/* Deliberately shallower than the 4:3 a real photo fills: most slots are empty
   today, and a page of tall blank boxes reads as broken rather than reserved. */
.wp-none{border:1px dashed var(--hair2);background:var(--gold-wash);
  aspect-ratio:5/2;display:flex;align-items:center;justify-content:center;}
.wp-e{text-align:center;color:var(--faint);font-family:var(--serif);font-size:13px;
  font-style:italic;padding:16px;line-height:1.6;}
.wp-ei{font-size:26px;color:var(--hair2);font-style:normal;margin-bottom:6px;}
.wp-eh{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-style:normal;
  font-family:var(--sans);margin-top:6px;color:var(--hair2);}
.wfacts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);
  margin:20px 0 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);}
.wf{background:var(--card);padding:13px 14px;}
/* An odd number of facts would otherwise leave the grid's background showing as a
   hollow cell — the last one spans instead. Fact counts genuinely vary by year. */
.wf:last-child:nth-child(odd){grid-column:1/-1;}
.wf-l{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
  font-weight:600;}
.wf-v{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--navy);
  margin-top:3px;line-height:1.25;}
.wf-v s{color:var(--faint);}
.wf-s{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.45;}
/* the running score, day by day */
.wpath{margin:20px 16px 0;border-top:2px solid var(--navy);}
.wpath-h,.wpath-r{display:grid;grid-template-columns:50px 1fr 74px 92px;gap:6px;
  align-items:center;padding:9px 2px;border-bottom:1px solid var(--hair);}
.wpath-h{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
  font-weight:600;}
.wpath-h span:nth-child(n+3),.wpath-r span:nth-child(n+3){text-align:right;}
.wp-d{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:14px;}
.wp-c{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wp-s{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut);white-space:nowrap;}
.wp-t{font-family:var(--serif);font-weight:700;font-size:15px;white-space:nowrap;
  font-variant-numeric:tabular-nums;}
.wp-red{color:var(--red);} .wp-blue{color:var(--blue);} .wp-as{color:var(--mut);}
.wrows{margin:18px 16px 0;border-top:1px solid var(--hair2);}
.wrow{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:11px 0;border-bottom:1px solid var(--hair);}
.wrow b{font-weight:600;font-size:14px;}
.wrow .kd{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:2px;}
.wrow-v{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--navy);
  white-space:nowrap;text-align:right;}
.wroast{font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.65;
  color:var(--ink);margin:18px 16px 0;padding-top:14px;border-top:1px solid var(--hair);
  text-align:center;}
/* the climb: where he stood after each night */
.wclimb{margin:20px 16px 0;text-align:center;}
.wclimb-l{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
  font-weight:600;margin-bottom:10px;}
.wclimb-r{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;}
.wcl{display:inline-flex;flex-direction:column;align-items:center;min-width:42px;
  padding:7px 4px;border:1px solid var(--hair2);border-radius:3px;background:var(--paper);}
.wcl b{font-family:var(--serif);font-size:19px;color:var(--navy);line-height:1;}
.wcl i{font-style:normal;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin-top:4px;}
.wcl.one{border-color:var(--gold-pale);background:var(--gold-wash);}
.wcl.one b{color:var(--gold);}
.wcl-a{color:var(--hair2);font-size:17px;}
/* more than once */
.wmult{margin-top:26px;padding:20px 18px;border:1px solid var(--gold-pale);
  border-radius:4px;background:var(--gold-wash);text-align:center;}
.wmult-h{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
  font-weight:700;}
.wmult-b{font-family:var(--serif);font-size:15px;line-height:1.7;color:var(--ink);margin-top:10px;}
.wmult-y{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.wmy{font-family:var(--serif);font-size:13px;color:var(--mut);border:1px solid var(--hair2);
  border-radius:999px;padding:3px 11px;background:var(--card);}
.wmy.on{color:var(--gold);border-color:var(--gold-pale);font-weight:700;}
/* the defending honours, shown before a tour starts */
.wdef{display:grid;grid-template-columns:1fr;gap:1px;background:var(--hair);
  border:1px solid var(--hair);margin-top:12px;}
.wdef-i{background:var(--card);padding:15px;text-align:center;}
.wdef-l{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600;}
.wdef-v{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--navy);margin-top:6px;}
.wdef-v.rband-red{color:var(--red);background:none;} .wdef-v.rband-blue{color:var(--blue);background:none;}
.wdef-v.rband-other,.wdef-v.rband-none{color:var(--mut);background:none;}
.wdef-v .flag{width:20px;height:13px;vertical-align:-1px;margin-right:6px;}
.wdef-s{font-size:11.5px;color:var(--faint);margin-top:4px;}
/* the early champions, kept on every page so the roll is never partial */
.wvault{margin-top:30px;padding-top:20px;border-top:1px solid var(--hair2);}
.wvault-h{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--navy);text-align:center;}
.wvault-s{text-align:center;color:var(--faint);font-size:11px;margin-top:4px;}
.wvault-g{margin-top:14px;border-top:1px solid var(--hair);}
.wv{cursor:pointer;display:grid;grid-template-columns:46px 1fr 40px 42px;gap:8px;align-items:center;
  padding:8px 2px;border-bottom:1px solid var(--hair);font-size:13px;}
.wv-y{font-family:var(--serif);color:var(--mut);font-variant-numeric:tabular-nums;}
.wv-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.wv-n .flag{width:15px;height:10px;margin-right:6px;vertical-align:-1px;}
.wv-t{font-family:var(--serif);font-weight:700;color:var(--navy);text-align:right;
  font-variant-numeric:tabular-nums;}
.wv-c{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  text-align:right;font-weight:700;}
/* NOT .c-red/.c-blue — those are the team dot and carry a background fill. */
.wv-c.wv-red{color:var(--red);} .wv-c.wv-blue{color:var(--blue);}
.wv:hover{background:var(--gold-wash);}
/* Provenance, stated rather than hidden — three early winners are inferred. */
.wprov{font-size:11.5px;line-height:1.6;color:var(--faint);margin:16px 16px 0;
  padding-top:12px;border-top:1px solid var(--hair);text-align:center;font-style:italic;}

/* ---- Album: a year of photographs, hosted beside the app ----
   The pictures are FILES in the repo, never embedded in this page. The grid loads
   thumbnails only (about 14 KB each, lazily), and a full photo is fetched solely
   when somebody taps one — so carrying an album costs the app nothing until it is
   opened. That is what keeps this out of the app's weight. */
.alb-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin-bottom:14px;}
.alb-n{font-size:11px;color:var(--faint);}
.alb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;}
.alb-c{position:relative;aspect-ratio:1;overflow:hidden;border-radius:3px;
  background:var(--hair);cursor:pointer;border:0;padding:0;display:block;}
.alb-c img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .35s ease;}
.alb-c:hover img{transform:scale(1.05);}
.alb-c .alb-x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
  border:0;background:rgba(18,35,65,.72);color:#fff;font-size:13px;line-height:1;cursor:pointer;
  display:none;}
.alb-c:hover .alb-x{display:block;}
/* the viewer */
.lb-ov{position:fixed;inset:0;z-index:70;background:#0b1220;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  touch-action:none;}
.lb-im{max-width:100%;max-height:calc(100vh - 132px);object-fit:contain;display:block;}
.lb-cap{color:#e8e2d2;font-family:var(--serif);font-style:italic;font-size:13.5px;
  text-align:center;padding:12px 18px 0;max-width:760px;}
.lb-ct{color:rgba(232,226,210,.5);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-top:6px;}
.lb-b{position:absolute;background:rgba(255,255,255,.1);border:0;color:#fff;cursor:pointer;
  border-radius:50%;width:46px;height:46px;font-size:20px;line-height:1;}
.lb-x{top:max(14px,env(safe-area-inset-top,0px));right:14px;}
.lb-p{left:10px;top:50%;margin-top:-23px;} .lb-nx{right:10px;top:50%;margin-top:-23px;}
.lb-b:disabled{opacity:.22;cursor:default;}
/* the uploader */
.alb-up{border:1px dashed var(--hair2);border-radius:4px;padding:16px;margin-bottom:18px;
  background:var(--gold-wash);text-align:center;}
.alb-up h4{font-family:var(--serif);font-size:15px;color:var(--navy);margin-bottom:4px;}
.alb-up p{font-size:11.5px;color:var(--faint);line-height:1.6;}
.alb-prog{margin-top:10px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;}
.alb-err{color:var(--red);font-size:11.5px;margin-top:6px;text-align:left;}
.alb-diag{margin-top:10px;padding-top:9px;border-top:1px solid var(--hair);
  font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;}
.alb-empty{text-align:center;padding:34px 16px;color:var(--faint);
  font-family:var(--serif);font-style:italic;}
@media(max-width:520px){
  .alb-grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px;}
  .lb-b{width:40px;height:40px;}
  .alb-c .alb-x{display:block;}
}
.note{color:var(--faint);font-size:11px;margin-top:12px;text-align:center;}
/* heritage line under the masthead — the two numberings, quietly */
.herit{text-align:center;font-family:var(--serif);font-style:italic;color:var(--faint);
  font-size:12.5px;margin-top:6px;line-height:1.5;}
/* ---- Origins: the vault, 2013–2020. Parchment and ink, no team colours. ---- */
.org-in{background:linear-gradient(var(--gold-wash),var(--gold-wash)),var(--card);
  border:1px solid var(--hair2);border-radius:4px;
  box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--gold-pale);
  padding:clamp(22px,4vw,34px) clamp(16px,3.5vw,30px);text-align:center;margin-bottom:30px;}
.org-yr{font-family:var(--serif);font-weight:700;color:var(--gold);
  font-size:clamp(38px,9vw,64px);line-height:1;}
.org-h{font-family:var(--serif);font-weight:700;color:var(--navy);
  font-size:clamp(17px,3.4vw,23px);margin-top:8px;}
.org-p{font-family:var(--serif);color:var(--ink);font-size:14px;line-height:1.65;
  max-width:46ch;margin:10px auto 0;}
.org-tag{display:inline-block;margin-top:14px;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--mut);border:1px solid var(--hair2);
  border-radius:2px;padding:4px 10px;}
/* the timeline itself */
/* Three columns: the year, then the dot on its dashed rail, then the card.
   Sized off shared vars so the year can never drift over the dot. */
.tl{--yw:clamp(31px,7.4vw,42px); --gap:clamp(11px,3vw,16px); --dot:9px;
  --rail:calc(var(--yw) + var(--gap) + var(--dot)/2);
  --pad:calc(var(--yw) + var(--gap) + var(--dot) + var(--gap));
  position:relative;margin-top:6px;padding-left:var(--pad);}
.tl:before{content:"";position:absolute;left:var(--rail);top:10px;bottom:26px;
  width:1px;background:repeating-linear-gradient(var(--hair2) 0 4px,transparent 4px 9px);}
.tle{position:relative;margin-bottom:20px;}
.tle:before{content:"";position:absolute;left:calc(-1 * (var(--gap) + var(--dot)));
  top:15px;width:var(--dot);height:var(--dot);border-radius:50%;background:var(--gold-pale);
  border:1px solid var(--gold);box-sizing:border-box;}
.tle.win:before{background:var(--gold);}
.tl-yr{position:absolute;left:calc(-1 * var(--pad));top:12px;
  width:var(--yw);text-align:right;font-family:var(--serif);font-weight:700;
  color:var(--navy);font-size:clamp(13px,2.9vw,17px);font-variant-numeric:tabular-nums;
  line-height:1;}
.tl-card{background:var(--card);border:1px solid var(--hair);border-radius:4px;
  padding:12px 15px 13px;}
.tl-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  flex-wrap:wrap;border-bottom:1px solid var(--hair);padding-bottom:8px;margin-bottom:9px;}
.tl-ch{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:15.5px;}
.tl-ch .crown{color:var(--gold);}
.tl-tot{font-family:var(--serif);font-weight:700;color:var(--gold);font-size:19px;
  font-variant-numeric:tabular-nums lining-nums;}
.tl-meta{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);}
.tl-say{font-family:var(--serif);font-style:italic;color:var(--ink);font-size:13px;
  line-height:1.6;margin-top:8px;}
.tl-facts{display:flex;flex-wrap:wrap;gap:5px 7px;margin-top:10px;}
.tl-f{font-size:10.5px;color:var(--mut);background:var(--paper);border:1px solid var(--hair);
  border-radius:2px;padding:3px 8px;font-variant-numeric:tabular-nums;}
.tl-tale{margin-top:11px;padding-top:10px;border-top:1px dotted var(--hair2);
  font-family:var(--serif);font-style:italic;color:var(--ink);font-size:12.5px;line-height:1.6;}
.tl-tale b{font-style:normal;color:var(--gold);}
/* the three who came once */
.mia{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:16px;}
.mia-c{background:var(--card);border:1px dashed var(--hair2);border-radius:4px;
  padding:13px 10px;text-align:center;}
.mia-n{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:16px;}
.mia-s{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:3px;}
.mia-r{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px;margin-top:8px;}
.mia-q{font-family:var(--serif);font-style:italic;color:var(--ink);font-size:12px;
  line-height:1.55;margin-top:8px;}
/* the Rules tab — read once, settled forever, in theory */
.rules{margin:0;padding-left:1.35em;counter-reset:r;list-style:none;}
.rules li{position:relative;font-family:var(--serif);font-size:14px;line-height:1.72;
  color:var(--ink);padding:9px 0;border-bottom:1px solid var(--hair);}
.rules li:last-child{border-bottom:0;}
.rules li:before{counter-increment:r;content:counter(r);position:absolute;
  left:-1.35em;top:11px;font-family:var(--sans);font-size:9.5px;font-weight:700;
  color:var(--gold);}
.rules-p{font-family:var(--serif);font-size:14px;line-height:1.7;color:var(--ink);margin:0 0 12px;}
.note-i{font-style:italic;color:var(--mut);font-size:13px;margin:12px 0 0;}
.note-tt{font-family:var(--serif);font-style:italic;font-size:12.5px;line-height:1.65;
  max-width:56ch;margin-left:auto;margin-right:auto;color:var(--mut);}
.ladder{width:100%;border-collapse:collapse;background:var(--card);
  border:1px solid var(--hair2);border-radius:4px;overflow:hidden;}
.ladder th{font-family:var(--sans);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mut);font-weight:700;padding:9px 12px;
  border-bottom:1px solid var(--hair2);text-align:left;}
.ladder th:last-child,.ladder td:last-child{text-align:right;}
.ladder td{padding:7px 12px;border-bottom:1px solid var(--hair);font-size:13px;
  font-variant-numeric:tabular-nums;color:var(--ink);}
.ladder tr:last-child td{border-bottom:0;}
.ladder .up{color:var(--red);font-weight:700;}
.ladder .dn{color:var(--blue);font-weight:700;}
.ladder .lv{color:var(--faint);}
/* pull-to-refresh cue, and the little word that follows it */
#ptr{position:fixed;top:-40px;left:50%;margin-left:-19px;width:38px;height:38px;z-index:55;
  border-radius:50%;background:var(--card);border:1px solid var(--hair2);
  display:flex;align-items:center;justify-content:center;color:var(--gold);
  font-size:16px;opacity:0;transition:opacity .18s;pointer-events:none;
  box-shadow:0 2px 10px rgba(28,39,64,.1);}
#ptr.on{opacity:.75;} #ptr.armed{opacity:1;}
#ptr.armed span{transform:rotate(180deg);transition:transform .2s;display:inline-block;}
#ptr.busy{opacity:1;transform:translateY(56px)!important;}
#ptr.busy span{animation:ptrSpin .9s linear infinite;display:inline-block;}
@keyframes ptrSpin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:58;
  background:var(--navy);color:#fdfcf8;font-family:var(--sans);font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;padding:10px 18px;border-radius:999px;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  box-shadow:0 4px 16px rgba(28,39,64,.22);}
#toast.show{opacity:1;transform:translate(-50%,0);}
/* the page owns its overscroll so the pull is ours, not the browser's */
body{overscroll-behavior-y:contain;}
/* ---- the landing page ---- */
#splash{position:fixed;inset:0;z-index:60;background:var(--paper);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:clamp(28px,7vw,64px);
  opacity:1;transition:opacity .8s ease, visibility .8s;}
/* Opaque from the very first paint — it must never let the app behind show through.
   Only the CONTENT fades in. `.arriving` is used solely when the splash returns
   over an app that is already on screen. */
#splash.arriving{opacity:0;transition:none;}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none;}
#splash > *{opacity:0;transform:translateY(7px);
  animation:spIn .95s cubic-bezier(.22,.61,.36,1) forwards;}
@keyframes spIn{to{opacity:1;transform:none;}}
.sp-k{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--mut);
  animation-delay:.15s;}
.sp-t{font-family:var(--serif);font-weight:700;color:var(--navy);line-height:1.05;
  font-size:clamp(34px,8vw,68px);margin-top:16px;animation-delay:.3s;}
.sp-r{display:flex;align-items:center;gap:16px;margin-top:20px;width:min(340px,72vw);
  animation-delay:.45s;}
.sp-r span{flex:1;height:1px;background:var(--hair2);}
.sp-r em{font-family:var(--serif);font-style:normal;color:var(--gold);
  font-size:clamp(15px,3.4vw,20px);letter-spacing:.16em;}
.sp-v{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);
  margin-top:18px;animation-delay:.6s;}
.sp-p{font-family:var(--serif);color:var(--faint);font-size:12.5px;line-height:2;
  max-width:44ch;margin-top:26px;animation-delay:.78s;}
.sp-n{white-space:nowrap;}
.sp-c{position:absolute;left:0;right:0;bottom:clamp(16px,3.5vw,26px);
  font-size:9px;letter-spacing:.14em;color:var(--hair2);padding:0 18px;
  line-height:1.6;animation-delay:1.25s;}
.foot-c{margin-top:9px;font-size:9px;letter-spacing:.12em;color:var(--hair2);
  line-height:1.6;}
.sp-tr{margin-top:clamp(26px,5vw,40px);background:none;cursor:pointer;
  border:1px solid var(--hair2);border-radius:999px;color:var(--navy);
  font-family:var(--sans);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;
  font-weight:600;padding:12px 24px;display:inline-flex;align-items:center;gap:12px;
  animation-delay:.95s;transition:border-color .15s,background .15s;}
.sp-tr:hover{border-color:var(--gold);background:var(--gold-wash);}
.sp-tr span{font-size:9.5px;letter-spacing:.16em;color:var(--faint);font-weight:400;}
.sp-e{margin-top:clamp(16px,3vw,22px);font-size:9.5px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--faint);animation-delay:1s;}
.sp-e i{display:inline-block;font-style:normal;animation:spPulse 2.6s ease-in-out infinite;}
@keyframes spPulse{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){
  #splash > *{animation:none;opacity:1;transform:none;}
  .sp-e i{animation:none;}
}
/* ---- Home ---- */
.hm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:10px;margin-top:22px;}
.hm{display:block;width:100%;text-align:left;background:var(--card);

.hm:hover{border-color:var(--gold-pale);transform:translateY(-1px);}
.hm-n{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--navy);
  display:flex;align-items:center;justify-content:space-between;gap:8px;}
.hm-n:after{content:"›";color:var(--gold);font-weight:400;font-size:17px;}
.hm-d{font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.5;}
.pubbar{margin-top:26px;background:var(--card);border:1px solid var(--hair2);
  border-radius:4px;padding:16px 18px;text-align:center;}
.pubbar.stale{border-color:var(--gold);background:var(--gold-wash);}
.pb-t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
  margin-bottom:11px;line-height:1.6;}
.pubbar.stale .pb-t{color:var(--gold);font-weight:700;}
.sealrow{margin-top:14px;padding-top:13px;border-top:1px solid var(--hair);}
.sl-t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
  margin-right:10px;}
.sealrow input{font-size:14px;padding:7px 10px;border:1px solid var(--hair2);
  border-radius:3px;background:var(--paper);color:var(--ink);font-family:var(--sans);}
.hm-tr{margin-top:26px;background:linear-gradient(var(--gold-wash),var(--gold-wash)),var(--card);
  border:1px solid var(--hair2);border-radius:4px;
  box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--gold-pale);
  padding:clamp(20px,4vw,30px) clamp(16px,4vw,26px);text-align:center;}
.hm-tr-k{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);}
.hm-tr-t{font-family:var(--serif);font-weight:700;color:var(--navy);
  font-size:clamp(19px,4vw,25px);margin-top:7px;}
.hm-tr-s{font-family:var(--serif);color:var(--ink);font-size:13.5px;line-height:1.65;
  max-width:42ch;margin:8px auto 16px;}
.hm-lab{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
  font-weight:700;margin:26px 0 2px;padding-top:12px;border-top:1px solid var(--hair);}
.hm-lab:first-of-type{margin-top:14px;}
/* ---- Live Stats ---- */
.chart{background:var(--card);border:1px solid var(--hair2);border-radius:4px;
  padding:14px 12px 8px;}
.chart-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:0 4px 8px;}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:700;color:var(--mut);}
.lg i{width:14px;height:3px;border-radius:2px;display:inline-block;}
.lg-r{background:var(--red);} .lg-b{background:var(--blue);}
.chart-t{margin-left:auto;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);}
.cupsvg{width:100%;height:auto;display:block;overflow:visible;}
.cupsvg .grid{stroke:var(--hair);stroke-width:1;}
.cupsvg .winline{stroke:var(--gold-pale);stroke-width:1.5;stroke-dasharray:4 4;}
.cupsvg .ax{font-family:var(--sans);font-size:8px;letter-spacing:.1em;fill:var(--faint);
  text-transform:uppercase;}
.cupsvg .ax-y{text-anchor:end;} .cupsvg .ax-x{text-anchor:middle;}
.cupsvg .winlbl{text-anchor:end;fill:var(--gold);font-weight:700;}
.cupsvg .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
.cupsvg .ln-r{stroke:var(--red);} .cupsvg .ln-b{stroke:var(--blue);}
.cupsvg .dt{stroke:var(--card);stroke-width:2;}
.cupsvg .dt-r{fill:var(--red);} .cupsvg .dt-b{fill:var(--blue);}
.cupsvg .endlbl{font-family:var(--serif);font-size:13px;font-weight:700;}
.cupsvg .el-r{fill:var(--red);} .cupsvg .el-b{fill:var(--blue);}
.lv-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding:11px 14px;border-bottom:1px solid var(--hair);}
.lv-row:last-child{border-bottom:0;}
.lv-row b{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--navy);
  display:inline-flex;align-items:center;}
.lv-row .kd{display:block;font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.45;}
.lv-v{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--gold);
  font-variant-numeric:tabular-nums;white-space:nowrap;}
.lv-f{width:15px;height:10px;margin-right:7px;}
.up{color:var(--blue);} .dn{color:var(--red);}
.quart .q-n .t-r,.quart .q-n .t-b{font-variant-numeric:tabular-nums;}
/* tomorrow, teased and nothing more */
.cryptic{display:flex;gap:14px;align-items:flex-start;background:var(--navy);
  border-radius:4px;box-shadow:inset 0 0 0 1px rgba(217,200,154,.3);
  padding:clamp(16px,3.4vw,24px) clamp(14px,3vw,22px);}
.cry-i{font-size:22px;line-height:1;flex:none;opacity:.8;}
.cry-l{font-family:var(--serif);font-size:14px;line-height:1.7;color:#fdfcf8;
  opacity:.92;margin-bottom:4px;}
.cry-l b{color:var(--gold-pale);}
.cry-f{margin-top:10px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(253,252,248,.42);}
/* the pandemic years — present, muted, never alarming */
.covid{display:inline-block;width:.92em;height:.92em;margin-left:.34em;
  color:var(--hair2);vertical-align:-.1em;}
.covid svg{width:100%;height:100%;display:block;}
.covidnote{display:flex;gap:12px;align-items:flex-start;margin-top:22px;
  background:var(--card);border:1px solid var(--hair);border-left:3px solid var(--hair2);
  border-radius:4px;padding:13px 16px;text-align:left;}
.covidnote .covid{width:19px;height:19px;margin:2px 0 0;color:var(--hair2);flex:none;}
.covidnote b{font-family:var(--serif);font-size:14px;color:var(--navy);}
.covidnote > div{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);}
.covidnote span{display:block;font-family:var(--serif);font-style:italic;font-size:13px;
  line-height:1.65;letter-spacing:0;text-transform:none;color:var(--ink);margin-top:6px;}
.covid-chip{display:inline-flex;align-items:center;gap:5px;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--mut);background:var(--paper);border:1px solid var(--hair2);
  border-radius:2px;padding:3px 8px;white-space:nowrap;}
.covid-chip .covid{width:11px;height:11px;margin:0;color:var(--mut);}
.rcovid{margin:6px 0 2px;}
.roll .r .covid-chip{background:transparent;}
.tl-facts .covid-chip{background:var(--paper);}
.mast-covid{margin-top:9px;}
.mast-covid .covid-chip{background:transparent;border-color:var(--hair2);}
/* who has paid — pills in team colour, filled once the money is in */
.kpay{display:flex;flex-wrap:wrap;gap:7px;}
.kpp{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;
  background:var(--card);color:var(--faint);border:1px dashed var(--hair2);
  border-radius:999px;padding:7px 14px;font-family:var(--sans);font-size:13px;
  cursor:pointer;line-height:1.25;transition:background .12s,color .12s,border-color .12s;}
.kpp[disabled]{cursor:default;}
.kpp .kpp-n{display:inline-flex;align-items:center;}
.kpp.on{border-style:solid;color:#fdfcf8;font-weight:600;}
.kpp.on.k-red{background:var(--red);border-color:var(--red);}
.kpp.on.k-blue{background:var(--blue);border-color:var(--blue);}
.kpp-v{font-size:10px;font-variant-numeric:tabular-nums;opacity:.9;letter-spacing:.02em;}
.kpp-v i{font-style:normal;opacity:.72;}
.kpp-f{width:13px;height:8.7px;margin-right:5px;box-shadow:0 0 0 .5px rgba(28,39,64,.3);}
.kpp.on .kpp-f{box-shadow:0 0 0 .5px rgba(255,255,255,.55);}
/* where the pot came from — the four lines above the ledger */
.orow{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding:11px 14px;border-bottom:1px solid var(--hair);}
.orow:last-child{border-bottom:0;}
.orow b{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--navy);}
.orow .kd{display:block;font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.45;}
.oval{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;}
.orow-t{background:var(--gold-wash);border-top:1px solid var(--hair2);}
.orow-t .oval{color:var(--gold);font-size:19px;}
/* the subtotal we actually hold, and the hypothetical we don't */
.orow-s{background:rgba(28,39,64,.028);}
.orow-hyp b{font-size:13px;font-style:italic;font-weight:400;color:var(--mut);}
.orow-hyp .oval{font-size:15px;font-style:italic;font-weight:400;color:var(--mut);}
.orow-hyp .kd{font-style:italic;}
/* keeper of the purse — grouped, with the derived figures shown not typed */
.ksub{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);
  font-weight:700;margin:16px 0 2px;padding-top:10px;border-top:1px solid var(--hair);}
.ksub:first-child{margin-top:2px;padding-top:0;border-top:0;}
.erow .en i{font-style:italic;color:var(--faint);font-weight:400;}
.kcalc{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px;
  padding-right:4px;white-space:nowrap;}
.kcalc i{font-style:italic;color:var(--faint);font-size:11px;}
.kcalc-t{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--gold);}
.erow-tot{background:var(--gold-wash);}
/* the closer on the Rules tab — the only answer anyone has ever been given */
.anyq{margin-top:clamp(34px,6vw,52px);background:var(--navy);border-radius:4px;
  box-shadow:inset 0 0 0 1px rgba(217,200,154,.34);text-align:center;
  padding:clamp(26px,5vw,42px) 18px;}
.anyq-q{font-family:var(--serif);font-weight:700;color:#fdfcf8;
  font-size:clamp(21px,4.4vw,30px);line-height:1.2;}
.anyq-a{font-family:var(--serif);font-style:italic;color:var(--gold-pale);
  font-size:clamp(18px,3.9vw,26px);margin-top:9px;}
.anyq-s{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(253,252,248,.82);margin-top:18px;}
/* Starts bright enough to read, then gives up before the list does. */
.anyq-s span{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;
  vertical-align:bottom;
  -webkit-mask-image:linear-gradient(90deg,#000 0 58%,rgba(0,0,0,.5) 80%,transparent 98%);
  mask-image:linear-gradient(90deg,#000 0 58%,rgba(0,0,0,.5) 80%,transparent 98%);}
/* sovereignty flags — small, to the left of the name, never louder than it */
.flag{width:17px;height:11.4px;border-radius:1.5px;flex:none;display:inline-block;
  vertical-align:-1px;margin-right:6px;box-shadow:0 0 0 .5px rgba(28,39,64,.28);}
.pp-flag{width:14px;height:9.4px;margin-right:5px;vertical-align:-.5px;}
/* on the dossier the name is large, so the flag scales with it and centres on it */
.dos-flag{width:.82em;height:.547em;margin-right:.28em;vertical-align:middle;
  border-radius:2px;position:relative;top:-0.06em;}
.ttn .flag{width:15px;height:10px;margin-right:5px;}
/* folklore — testimony, so it reads as prose rather than another stat block */
.folk{background:var(--card);border:1px solid var(--hair);border-radius:4px;
  border-left:3px solid var(--gold-pale);padding:4px 16px 6px;}
.folk-i{padding:12px 0;border-bottom:1px solid var(--hair);}
.folk-i:last-child{border-bottom:0;}
.folk-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  flex-wrap:wrap;font-family:var(--serif);font-weight:700;color:var(--navy);font-size:15px;}
.folk-y{font-family:var(--sans);font-weight:600;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mut);}
.folk-t{font-family:var(--serif);font-style:italic;color:var(--ink);font-size:13.5px;
  line-height:1.65;margin-top:5px;}
/* the trophy result, where it's known — a word of colour, not a colour block */
.tl-cup{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;}
.tl-cup .c-red{color:var(--red);} .tl-cup .c-blue{color:var(--blue);}
@media(max-width:560px){
  .mia{grid-template-columns:1fr;}
  .tl-top{gap:4px;}
}
.menu{background:var(--card);border:1px solid var(--hair2);border-radius:4px;
  box-shadow:inset 0 0 0 4px var(--card), inset 0 0 0 5px var(--gold-pale);
  padding:clamp(20px,4vw,38px) clamp(16px,4vw,46px);
  display:grid;grid-template-columns:repeat(2,1fr);gap:26px 40px;}
.aw{text-align:center;}
.aw-rule{width:26px;height:1px;background:var(--gold);margin:0 auto 10px;}
.aw-title{margin:0;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--navy);}
.aw-who{margin-top:4px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;}
.who-red{color:var(--red);} .who-blue{color:var(--blue);} .who-plain{color:var(--gold);}
.aw-stat{margin-top:6px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;}
.aw-quote{margin:7px 0 0;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink);line-height:1.5;}
.quart{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);}
.q{text-align:center;padding:18px 8px;border-left:1px solid var(--hair);}
.q:first-child{border-left:0;}
.q-n{font-family:var(--serif);font-weight:700;font-size:clamp(26px,4.6vw,38px);color:var(--navy);line-height:1;}
.q-l{margin-top:7px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);line-height:1.6;}
.q-l b{color:var(--ink);}
.foot{margin-top:clamp(34px,6vw,52px);padding-top:18px;border-top:1px solid var(--hair2);
  text-align:center;color:var(--faint);font-size:10px;letter-spacing:.24em;text-transform:uppercase;}

/* records */
.tally{display:flex;justify-content:center;align-items:baseline;gap:clamp(14px,4vw,30px);margin:10px 0 4px;}
.tally .n{font-family:var(--serif);font-weight:700;font-size:clamp(40px,9vw,72px);line-height:1;}
.tally .v{font-family:var(--serif);color:var(--faint);font-size:clamp(18px,4vw,30px);}
.tally-sub{text-align:center;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;}
.roll{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px;}
.roll .r{background:var(--card);border:1px solid var(--hair);border-radius:4px;
  text-align:center;overflow:hidden;padding:0 0 12px;}
/* Which side lifted the trophy, as a colour band. Where a score survives it rides
   along; where it doesn't, the colour says it on its own — better than "0–0". */
.roll .rband{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  color:#fff;padding:5px 6px 4px;margin-bottom:11px;line-height:1.3;}
.roll .rband-red{background:var(--red);}
.roll .rband-blue{background:var(--blue);}
.roll .rband-other{background:var(--navy2);}
.roll .rband-none{background:var(--paper);color:var(--faint);
  border-bottom:1px solid var(--hair);font-weight:600;}
.roll .rsc{opacity:.72;font-weight:600;letter-spacing:.08em;white-space:nowrap;}
.roll .r > .ry{padding:0 12px;} .roll .r > .rc,.roll .r > .rs{padding:0 12px;}
.roll .ry{font-size:10px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;font-weight:700;}
.roll .rc{font-family:var(--serif);font-weight:700;margin-top:4px;font-size:14.5px;}
.roll .rs{font-size:10.5px;color:var(--mut);margin-top:2px;}
.crow{display:grid;grid-template-columns:1fr 44px 52px 70px 52px;gap:8px;align-items:center;
  padding:9px 6px;border-top:1px solid var(--hair);font-variant-numeric:tabular-nums;}
.crow.hd{border-top:0;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;}
.crow>div{text-align:center;font-size:12.5px;color:var(--mut);}
.crow>div:first-child{text-align:left;font-size:13.5px;color:var(--ink);font-weight:600;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.grudge{display:flex;justify-content:space-between;gap:10px;padding:9px 6px;border-top:1px solid var(--hair);
  font-size:13px;flex-wrap:wrap;}
.grudge b{font-weight:700;}
.grudge .gr{color:var(--mut);font-variant-numeric:tabular-nums;}

/* player dossiers */
.pp-group{margin:2px 0 12px;}
.pp-lab{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;
  text-align:center;margin-bottom:7px;}
.pp-lab.r{color:var(--red);} .pp-lab.b{color:var(--blue);}
.pp-picker{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;}
.pp-pill{font-family:var(--sans);font-size:11px;letter-spacing:.08em;font-weight:600;
  border:1px solid var(--hair2);border-radius:999px;padding:7px 13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;}
.pp-pill.r{color:var(--red);background:rgba(163,38,54,.09);border-color:rgba(163,38,54,.32);}
.pp-pill.b{color:var(--blue);background:rgba(30,79,143,.09);border-color:rgba(30,79,143,.32);}
.pp-pill.r.on{background:var(--red);color:#fff;border-color:var(--red);}
.pp-pill.b.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.pp-pill .sw{font-size:9px;opacity:.6;}
.pp-pill.on .sw{opacity:.85;}
.srow{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:2px 14px;align-items:baseline;
  padding:11px 6px;border-top:1px solid var(--hair);}
.srow:first-of-type{border-top:0;}
.srow .sl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;}
.srow .sv{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--navy);
  text-align:right;font-variant-numeric:tabular-nums lining-nums;}
.srow .sn{grid-column:1 / -1;font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--faint);}

.sealed{background:linear-gradient(180deg,var(--navy2),var(--navy));border-radius:6px;
  box-shadow:inset 0 0 0 1px rgba(217,200,154,.45);padding:26px 20px;text-align:center;color:#f4f1e8;}
.sealed-i{font-size:30px;line-height:1;margin-bottom:8px;}
.sealed-t{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--gold-pale);}
.sealed .note{color:rgba(244,241,232,.6);margin-top:6px;}

.krow{display:grid;grid-template-columns:1fr 100px 100px 110px;gap:10px;align-items:center;
  padding:12px 6px;border-top:1px solid var(--hair);font-variant-numeric:tabular-nums;}
.krow.hd{border-top:0;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600;}
.krow>div{text-align:right;font-size:14px;color:var(--mut);}
.krow>div:first-child{text-align:left;color:var(--ink);font-size:14px;display:flex;flex-direction:column;gap:2px;}
.krow>div:first-child b{font-family:var(--serif);font-size:15px;}
.kd{font-size:11px;color:var(--faint);letter-spacing:.04em;}
.krow .kbal{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--navy);}
@media(max-width:560px){
  .krow{grid-template-columns:1fr auto;grid-template-areas:"name bal" "spend pp";row-gap:4px;}
  .krow.hd{display:none;}
  .krow>div:first-child{grid-area:name;}
  .krow>div:nth-child(2){grid-area:spend;text-align:left;font-size:13px;}
  .krow>div:nth-child(3){grid-area:pp;font-size:13px;}
  .krow .kbal{grid-area:bal;}
}
.ins{text-align:left;max-width:330px;margin:12px auto 6px;padding-left:22px;font-size:14px;line-height:1.85;color:var(--ink);}
.ins b{font-weight:700;}
.ins .ic{font-family:var(--mono);}
.ins-w{font-size:12px;color:var(--mut);max-width:360px;margin:6px auto 12px;line-height:1.5;}
.kitty{margin-top:30px;}
.kitty-in{border:1px solid var(--hair2);border-radius:4px;background:var(--card);
  box-shadow:inset 0 0 0 4px var(--card), inset 0 0 0 5px var(--gold-pale);
  padding:22px 20px;text-align:center;}
.kitty-t{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--navy);}
.kitty-s{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-top:5px;}
.kitty-btn{display:inline-block;margin-top:14px;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:700;text-decoration:none;color:var(--gold);
  border:1px solid var(--gold);border-radius:4px;padding:11px 22px;background:#fff;}
.kitty-btn:hover,.kitty-btn:focus{background:var(--gold-wash);}
.kitty-btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
.kitty-n{font-size:11px;color:var(--faint);margin-top:10px;}

/* share + publish */
.share-row{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap;}
.share-row .note{margin-top:0;}
details summary::-webkit-details-marker{color:var(--gold);}

/* photo library */
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px;}
.ph{background:var(--card);border:1px solid var(--hair);border-radius:6px;overflow:hidden;}
.ph img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;}
.ph-cap{width:100%;border:0;border-top:1px solid var(--hair);padding:7px 9px;font-size:12px;font-family:var(--sans);color:var(--ink);background:#fff;}
.ph-cap:focus{outline:2px solid var(--gold-pale);}
.ph-b{display:flex;border-top:1px solid var(--hair);}
.ph-b button{flex:1;border:0;background:#fff;color:var(--mut);padding:7px;cursor:pointer;font-size:13px;border-left:1px solid var(--hair);}
.ph-b button:first-child{border-left:0;}
.ph-b button:hover{background:var(--gold-wash);color:var(--gold);}

/* board Tourist Trophy snapshot */
.ttsnap{margin-top:clamp(30px,5vw,48px);}
.ttbox{border-top:2px solid var(--navy);border-bottom:1px solid var(--hair2);}
.ttr{display:grid;grid-template-columns:34px 1fr auto 50px;gap:10px;align-items:center;
  padding:11px 6px;border-top:1px solid var(--hair);}
.ttr.tth{border-top:0;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:8px 6px;}
.ttr.champ{background:var(--gold-wash);}
.ttp{font-family:var(--serif);color:var(--mut);font-variant-numeric:tabular-nums;font-size:14px;}
.ttr.champ .ttp{color:var(--gold);font-weight:700;}
.ttn{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ttrs{display:flex;gap:5px;}
.ttc{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut);}
.ttr.tth .ttc{color:var(--faint);}
.ttc.off,.ttc.off s{color:var(--faint);}
.ttb{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--navy);text-align:right;font-variant-numeric:tabular-nums;}
.ttr.champ .ttb{color:var(--gold);}
.ttgap{text-align:center;color:var(--faint);letter-spacing:.2em;padding:6px 0;font-size:12px;}
@media(max-width:520px){
  .ttr{grid-template-columns:28px 1fr auto 42px;gap:7px;}
  .ttc{min-width:20px;font-size:12px;}
  .ttn{font-size:13.5px;}
}

/* captains, cement, scheme */
.capb{display:inline-block;font-family:var(--serif);font-weight:700;font-size:10px;color:#fff;
  background:var(--gold);border-radius:50%;width:16px;height:16px;line-height:16px;
  text-align:center;vertical-align:2px;letter-spacing:0;}
.pdiv{text-align:center;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  margin:12px 0 8px;display:flex;align-items:center;gap:10px;}
.pdiv::before,.pdiv::after{content:"";flex:1;height:1px;background:var(--hair);}
.pill.off{opacity:.42;cursor:default;}
.col-cap{font-family:var(--sans);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);font-weight:700;margin-top:4px;}
.col-cap.mutd{color:var(--faint);}
.scheme{margin-top:16px;}
.sch-row{font-size:13.5px;padding:4px 0;font-variant-numeric:tabular-nums;}
.sch-row b{font-family:var(--serif);font-size:16px;color:var(--navy);}

/* tour party setup */
.party{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pcol{background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:10px;min-height:120px;}
.col-h{font-family:var(--serif);font-weight:700;font-size:14px;text-align:center;
  padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--hair);}
.pill{display:flex;align-items:center;gap:8px;padding:9px 10px;margin-bottom:6px;
  border:1px dashed var(--hair2);border-radius:999px;cursor:pointer;background:#fff;
  color:var(--faint);user-select:none;-webkit-user-select:none;}
.pill .pl-nm{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pill .pl-h{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.pill .pl-h em{font-style:normal;font-size:9.5px;color:var(--faint);}
.pill.on{border-style:solid;color:var(--ink);}
.pill.on.p-red{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red);}
.pill.on.p-blue{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue);}
.pill .mv{border:none;background:var(--paper);color:var(--mut);border-radius:50%;
  width:26px;height:26px;cursor:pointer;font-size:13px;flex:none;}
.ringer{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.ringer input,.ringer select{font-size:14px;padding:9px 10px;border:1px solid var(--hair2);
  border-radius:4px;background:#fff;color:var(--ink);font-family:var(--sans);min-width:0;}
.ringer input:first-child{flex:1;min-width:140px;}
@media(max-width:520px){.party{grid-template-columns:1fr;}}

/* enter */
.panel{background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:16px;margin-bottom:16px;}
.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip-btn{font-family:var(--sans);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  border:1px solid var(--hair2);background:#fff;color:var(--mut);border-radius:4px;padding:8px 13px;cursor:pointer;}
.chip-btn.on{border-color:var(--gold);color:var(--gold);background:var(--gold-wash);}
.erow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--hair);}
.erow:first-of-type{border-top:0;}
.erow .en{flex:1;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;}
.erow .eh{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;}
.erow input{width:64px;font-size:17px;font-variant-numeric:tabular-nums;text-align:center;
  border:1px solid var(--hair2);border-radius:4px;padding:9px 4px;font-family:var(--sans);background:#fff;color:var(--ink);}
.erow input:focus{outline:2px solid var(--gold-pale);border-color:var(--gold);}
.mrow{padding:10px 0;border-top:1px solid var(--hair);}
.mrow:first-of-type{border-top:0;}
.mrow .who{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:7px;gap:8px;}
.btns{display:flex;gap:6px;flex-wrap:wrap;}
.rbtn{flex:1;min-width:64px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  border:1px solid var(--hair2);background:#fff;color:var(--mut);border-radius:4px;padding:10px 6px;cursor:pointer;}
.rbtn.sel-red{border-color:var(--red);color:#fff;background:var(--red);}
.rbtn.sel-blue{border-color:var(--blue);color:#fff;background:var(--blue);}
.rbtn.sel-h{border-color:var(--navy);color:#fff;background:var(--navy);}
.marg{display:flex;gap:6px;align-items:center;margin-top:7px;}
.marg select{font-size:13px;padding:7px;border:1px solid var(--hair2);border-radius:4px;background:#fff;color:var(--ink);}
.marg .ml{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);}
.save-bar{position:sticky;bottom:0;background:var(--paper);padding:12px 0;border-top:1px solid var(--hair2);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn-primary{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  background:var(--navy);color:#f4f1e8;border:none;border-radius:4px;padding:13px 22px;cursor:pointer;
  display:inline-block;text-decoration:none;}
a.btn-primary{color:#f4f1e8;}
.btn-quiet{font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:1px solid var(--hair2);color:var(--mut);border-radius:4px;padding:11px 14px;cursor:pointer;}
.saved-note{font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
.empty{color:var(--faint);text-align:center;padding:30px 10px;font-family:var(--serif);font-style:italic;font-size:15px;}

@media(max-width:700px){
  .days{grid-template-columns:repeat(2,1fr);}
  .dy{border-left:0;border-top:1px solid var(--hair);}
  .dy:nth-child(-n+2){border-top:0;}
  .dy:nth-child(2n){border-left:1px solid var(--hair);}
  .grps{grid-template-columns:1fr;}
  .menu{grid-template-columns:1fr;gap:22px;}
  .quart{grid-template-columns:repeat(2,1fr);}
  .q:nth-child(3){border-left:0;}
  .row{grid-template-columns:32px 1fr auto;grid-template-areas:"pos name b3" "pos meta b3";row-gap:2px;padding:11px 4px;}
  .row.hd{display:none;}
  .c-pos{grid-area:pos;}
  .c-name{grid-area:name;}
  .c-b3{grid-area:b3;font-size:22px;align-self:center;}
  .c-rounds{grid-area:meta;font-size:11.5px;}
  .c-rec,.c-nett{display:none;}
  .crow{grid-template-columns:1fr 40px 46px 60px;}
  .crow>div:nth-child(5){display:none;}
  /* Winners: the course name is the first thing to go — the day and the two
     scores are what the page is for. */
  .wpath-h,.wpath-r{grid-template-columns:42px 1fr 64px 82px;gap:5px;}
  .wp-c{font-size:11px;}
  .wsec-h{font-size:clamp(22px,6.2vw,30px);}
  .wp,.wpath,.wrows,.wroast,.wclimb{margin-left:12px;margin-right:12px;}
  .wv{grid-template-columns:42px 1fr 36px 38px;font-size:12.5px;}
}
