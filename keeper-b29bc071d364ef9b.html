      b64:btoa(unescape(encodeURIComponent(JSON.stringify(ALBUMS))))}],
      "NTRC album "+y+" \u00b7 removed a photo");
  }catch(e){ alert("Could not update the album: "+e.message); }
  render();
};

/* ══════════ THE WINNERS PAGE ══════════════════════════════════════════════
   How each year was actually won — the Cup first, because it is the team's, then
   the Tourist Trophy. Every number here is computed from the cards; only the
   framing sentences are written. Nothing on this page is entered by hand, so it
   can never quietly disagree with the scoreboard two tabs away. */

/* The Cup, told through the running score. */
function cupStory(y){
  const d=DATA[y], ds=dayScores(y);
  const w=teamWinner(y);
  const side = w.cls==="red" ? "RED" : (w.cls==="blue" ? "BLUE" : null);
  const path=[]; let R=0,B=0;
  (d.days||[]).forEach(x=>{
    const s=ds.days[x.day]||{RED:0,BLUE:0};
    R+=s.RED; B+=s.BLUE;
    path.push({day:x.day, meta:x, dR:s.RED, dB:s.BLUE, R, B});
  });
  const scored=path.filter(p=>p.dR||p.dB);
  // who led after each day, and how often that changed hands
  let changes=0, prev=null;
  scored.forEach(p=>{ const l=p.R===p.B?"AS":(p.R>p.B?"RED":"BLUE");
    if(prev!==null && l!==prev && l!=="AS" && prev!=="AS") changes++; prev=l; });
  // the last day the eventual winners were behind — everything after it was theirs
  let ledFrom=null;
  if (side) for (let k=scored.length-1;k>=0;k--){
    const p=scored[k], mine=side==="RED"?p.R:p.B, yours=side==="RED"?p.B:p.R;
    if (mine<=yours){ ledFrom = k+2<=scored.length ? scored[k+1] : null; break; }
    if (k===0) ledFrom=scored[0];
  }
  // the day that did it: the winners' biggest margin
  let best=null, worst=null, closest=null;
  scored.forEach(p=>{
    const sw=side? (side==="RED"?p.dR-p.dB:p.dB-p.dR) : Math.abs(p.dR-p.dB);
    if(!best||sw>best.sw) best={p,sw};
    if(!worst||sw<worst.sw) worst={p,sw};
    const gap=Math.abs(p.R-p.B);
    if(!closest||gap<closest.gap) closest={p,gap};
  });
  // singles and four-ball records for each side, and who carried them
  const rec={RED:[0,0,0],BLUE:[0,0,0]}, bonus={RED:0,BLUE:0,H:0}, pts={};
  let heaviest=null;
  (d.matches||[]).forEach(m=>{
    m.singles.forEach(s=>{
      const {w:res}=decide(s); if(!res) return;
      if(res==="HALVED"){ rec.RED[1]++; rec.BLUE[1]++;
        pts[s.red]=(pts[s.red]||0)+.5; pts[s.blue]=(pts[s.blue]||0)+.5; }
      else {
        const win=res==="RED"?s.red:s.blue, lose=res==="RED"?s.blue:s.red;
        rec[res][0]++; rec[res==="RED"?"BLUE":"RED"][2]++;
        pts[win]=(pts[win]||0)+1; pts[lose]=pts[lose]||0;
        const up=Math.max(marginOf(s.result.red)||0, marginOf(s.result.blue)||0);
        if(up && (!heaviest||up>heaviest.up)) heaviest={up, win, lose, day:m.day, note:decide(s).note};
      }
    });
    if(m.fourBBB&&m.fourBBB.winner){
      if(m.fourBBB.winner==="HALVED") bonus.H++; else bonus[m.fourBBB.winner]++;
    }
  });
  const forSide = t => Object.keys(pts).filter(i=>tmOf(y,i)===t)
    .sort((a,b)=>pts[b]-pts[a] || nm(y,a).localeCompare(nm(y,b)));
  const played1 = i => (d.matches||[]).reduce((n,m)=>
    n+m.singles.filter(s=>s.red===i||s.blue===i).filter(s=>decide(s).w).length,0);
  const lost = i => (d.matches||[]).reduce((n,m)=>n+m.singles.filter(s=>{
    const {w:res}=decide(s); if(!res||res==="HALVED") return false;
    return (res==="RED"?s.blue:s.red)===i; }).length,0);
  const unbeaten = Object.keys(pts).filter(i=>played1(i)>=3 && lost(i)===0)
    .sort((a,b)=>pts[b]-pts[a]);
  return {w, side, path, scored, changes, ledFrom, best, worst, closest,
          rec, bonus, pts, heaviest, unbeaten,
          topRed:forSide("RED")[0], topBlue:forSide("BLUE")[0],
          red:ds.red, blue:ds.blue, played1, lost};
}

/* The Tourist Trophy, told through the man who won it. */
function ttStory(y){
  const d=DATA[y], {ord,ranks}=ttRanks(y);
  const champ=ord[0]; if(!champ) return null;
  const runner=ord.find(i=>i!==champ && best3(y,i)===Math.max(...ord.filter(j=>j!==champ)
    .map(j=>best3(y,j)))) || ord[1];
  const gap = runner ? best3(y,champ)-best3(y,runner) : null;
  const tied = ord.filter(i=>best3(y,i)===best3(y,champ));
  // the climb: where he stood after each night
  const nd=nDays(y), climb=[];
  for(let k=1;k<=nd;k++){ const r=ranksUpto(y,k); if(r[champ]) climb.push({day:k,pos:r[champ]}); }
  const wire = climb.length && climb.every(c=>c.pos===1);
  const worstPos = climb.length ? Math.max(...climb.map(c=>c.pos)) : null;
  // the algorithm's response to a man playing well
  const h=dailyHcps(y,champ), h0=h[0], hEnd=h[h.length-1];
  const cut = (typeof h0==="number"&&typeof hEnd==="number") ? h0-hEnd : null;
  // his own matchplay week
  let mw=0,mh=0,ml=0;
  (d.matches||[]).forEach(m=>m.singles.forEach(s=>{
    if(s.red!==champ&&s.blue!==champ) return;
    const {w:res}=decide(s); if(!res) return;
    if(res==="HALVED") mh++;
    else if((res==="RED"?s.red:s.blue)===champ) mw++; else ml++;
  }));
  // every title he holds, so a repeat winner reads as a repeat winner
  const titles=[];
  Object.keys(DATA).sort().forEach(yy=>{
    if(!tourComplete(yy)) return;
    const o=ttRanks(yy).ord;
    if(o.length&&o[0]===champ) titles.push(yy);
  });
  const rounds=(d.rounds[champ]||[]).slice();
  const di=discIdx(y,champ);
  return {champ, runner, gap, tied, climb, wire, worstPos, rounds, di,
          total:best3(y,champ), nett:nettOf(y,champ), h0, hEnd, cut,
          rec:[mw,mh,ml], titles, field:ord.length,
          bestRound:rounds.filter(v=>typeof v==="number").length?Math.max(...rounds.filter(v=>typeof v==="number")):null};
}


/* ── The early years ────────────────────────────────────────────────────────
   No match sheets survive before 2021, so there is no running score to tell. But
   from 2017 every man carries a team, which means the week's Stableford CAN be
   totalled by side — a real, computed team figure rather than a gap on the page.
   It is labelled for what it is and never dressed up as the Cup score, which is
   genuinely lost. */
function vaultTeamAgg(y){
  const d=DATA[y], agg={RED:{pts:0,n:0,best:null},BLUE:{pts:0,n:0,best:null}};
  let any=false;
  (d.players||[]).forEach(p=>{
    const t=p.team; if(t!=="RED"&&t!=="BLUE") return;
    any=true;
    const v=played(y,p.id);
    agg[t].n++; agg[t].pts+=v.reduce((a,b)=>a+b,0);
    v.forEach(sc=>{ if(!agg[t].best||sc>agg[t].best.s) agg[t].best={s:sc,id:p.id}; });
  });
  return any?agg:null;
}
function vaultCupSection(y){
  const d=DATA[y], w=teamWinner(y), lr=d.legacyTeamResult||{};
  const era=((LEGACY.eras||{})[y]||{});
  const tw=LEGACY.trophyWinnersPre2021||{};
  const byElim=(tw.byElimination||[]).map(String).indexOf(String(y))>=0;
  const cup=tw[y]||null;
  const agg=vaultTeamAgg(y);
  const side=(w.cls==="red"?"RED":(w.cls==="blue"?"BLUE":null));

  let out='<section class="wsec">'
    +'<div class="wband rband-'+w.cls+'">'+esc(w.label)+'</div>'
    +'<div class="wsec-h">'+esc(era.format&&era.format!=="Red v Blue"?era.format:"The Cup")+'</div>';

  /* 2014 is the only early year whose team SCORE survives — Tom's aggregate. */
  if (lr.score){
    out+='<div class="wscore">'+esc(lr.score.replace("-","\u2013"))+'</div>'
      +'<div class="wsec-n">'+esc(lr.format||"")+'</div>';
  } else if (agg && side){
    /* Red first and colour-coded. Winner-first would read as "Blue won 722-745",
       and the aggregate frequently disagrees with the matchplay result. */
    out+='<div class="wscore"><span class="t-r">'+agg.RED.pts+'</span><i>&ndash;</i>'
      +'<span class="t-b">'+agg.BLUE.pts+'</span></div>'
      +'<div class="wsec-n">Stableford points across the week, Red and Blue &mdash; not the '
      +'match score, which does not survive</div>';
  } else {
    out+='<div class="wsec-n" style="margin-top:14px;font-size:13px">'
      +'No team score survives from '+y+'</div>';
  }
  out+=winPhoto(y,"cup",(side?teamWord(side):(lr.winner||"The team"))+" \u00b7 "+y,
    "A photograph of the winning team");

  const F=[];
  if (agg && side){
    const mine=agg[side], theirs=agg[side==="RED"?"BLUE":"RED"];
    F.push(["Side",mine.n+" men", "against "+theirs.n
      +(mine.n!==theirs.n?" \u2014 uneven, as it was":"")]);
    if (mine.n) F.push(["Average per man",(mine.pts/mine.n).toFixed(1),
      "their side, whole week \u00b7 "+(theirs.n?(theirs.pts/theirs.n).toFixed(1):"\u2013")+" the other"]);
    if (mine.best) F.push(["Best round of theirs",String(mine.best.s),esc(nm(y,mine.best.id))]);
    const top=ttRanks(y).ord.slice(0,5).filter(i=>tmOf(y,i)===side).length;
    F.push(["Top five finishers",top+" of 5","were "+teamWord(side).toLowerCase()]);
    F.push(["Field",String((d.players||[]).length)+" men",esc((d.event||{}).venue||"")]);
  } else {
    /* The format is already the heading here, so a "Format" fact would just say it
       twice. The best card of the week is worth more and exists for every year. */
    const n=(d.players||[]).length;
    F.push(["Field",String(n)+" men",esc((d.event||{}).venue||"")]);
    let hi=null;
    Object.keys(d.rounds||{}).forEach(i=>played(y,i).forEach(sc=>{
      if(!hi||sc>hi.s) hi={s:sc,id:i}; }));
    if (hi) F.push(["Best round of the week",String(hi.s),esc(nm(y,hi.id))]);
  }
  out+='<div class="wfacts">'+F.map(([a,b,c])=>'<div class="wf"><div class="wf-l">'+a+'</div>'
    +'<div class="wf-v">'+b+'</div><div class="wf-s">'+c+'</div></div>').join("")+'</div>';

  if (era.note) out+='<p class="wroast">'+esc(era.note)+'</p>';
  /* Provenance matters more than a tidy page: three of these winners were worked
     out by elimination, not recorded, and the page says which. */
  if (byElim)
    out+='<p class="wprov">Who lifted it in '+y+' is not written down anywhere. '
      +teamWord(cup)+' follows by elimination from the '+(tw.note?"known ":"")
      +'pre-2021 split, and has not been confirmed by anyone who was there. '
      +'If you remember otherwise, say so.</p>';
  else if (cup)
    out+='<p class="wprov">No team score survives from before 2021 &mdash; only who lifted it. '
      +teamWord(cup)+', confirmed.</p>';
  return out+'</section>';
}

/* A photo slot. Until a picture exists it is a quiet framed caption rather than a
   broken image — the page has to look finished on the day it ships, and Justin is
   adding these as he finds them. */
function winPhoto(y,slot,cap,want){
  const key=y+"-"+slot, v=WIN_PHOTOS[key];
  if (!v)
    return '<div class="wp wp-none"><div class="wp-e"><div class="wp-ei">&#9633;</div>'
      +'<div>'+esc(want||cap)+'</div><div class="wp-eh">to follow</div></div></div>';
  /* ?v= is the photo's own fingerprint — see the note where WIN_PHOTOS is built. */
  return '<figure class="wp"><img src="'+PHOTO_BASE+key+'.jpg?v='+v+'" alt="'+esc(cap)+'" '
    +'loading="lazy" decoding="async"><figcaption>'+esc(cap)+'</figcaption></figure>';
}
function teamWord(t){ return t==="RED"?"Red":"Blue"; }

function cupRoast(y,C){
  if(!C.side) return "";
  const them=teamWord(C.side), other=teamWord(C.side==="RED"?"BLUE":"RED");
  const marg=Math.abs(C.red-C.blue);
  if (C.red===C.blue)
    return "Level after four days, and the trophy did not move. "+them+" kept it by "
      +"standing still, which is a way of winning, if not a memorable one.";
  if (marg<=1)
    return "Won by "+half(marg)+". One putt anywhere in the week and this page has "
      +other+"&rsquo;s name on it instead.";
  if (C.changes>=2)
    return "The lead changed hands "+C.changes+" times before "+them+" took it for good. "
      +"Everyone claims to have known all along.";
  if (C.ledFrom && C.ledFrom.day===1)
    return them+" led from the first afternoon and were never caught. "+other+" spent "
      +"three days telling each other it was still on.";
  return them+" won by "+half(marg)+". "+other+" have had a year to think about it.";
}
function ttRoast(y,T){
  const n=T.titles.length, name=sur(y,T.champ);
  if (T.tied.length>1)
    return "Tied on "+T.total+" and settled on countback. "+name+"&rsquo;s name is on the "
      +"trophy; the other man&rsquo;s is in this sentence.";
  if (n>=4) return name+" again. At this point the Tourist Trophy is less a competition "
      +"than a standing order.";
  if (n===3) return "A third. "+name+" has now won this more times than most of the field "
      +"has broken forty.";
  if (n===2) return "His second. The first could be excused as weather.";
  if (T.gap!=null && T.gap>=10)
    return "By "+T.gap+" points. Not a contest so much as a demonstration.";
  if (T.gap!=null && T.gap<=2)
    return "By "+T.gap+". "+(T.runner?sur(y,T.runner):"The runner-up")+" will be doing that "
      +"arithmetic for some time.";
  return "One trophy, "+T.field+" men, and only one of them got to hold it.";
}

function vWinners(y){
  const d=DATA[y]||{};
  const complete=tourComplete(y), started=Object.keys(d.rounds||{}).some(i=>played(y,i).length);
  let out='<h2 class="sec-t">Winners</h2>'
    +'<div class="sec-s">'+y+' &middot; '+esc((d.event||{}).venue||"")
    +' &middot; how the two trophies were won</div>';

  if (!started){
    // the upcoming tour: name what is being defended rather than show an empty page
    const prev=liveYears().filter(v=>+v<+y&&tourComplete(v)).slice(-1)[0];
    out+='<div class="empty">Nothing has been won yet.</div>';
    if (prev){
      const T=ttStory(prev), w=teamWinner(prev), ds=dayScores(prev);
      out+='<div class="wsec"><div class="wsec-h">Being defended</div><div class="wdef">'
        +'<div class="wdef-i"><div class="wdef-l">The Cup</div>'
        +'<div class="wdef-v rband-'+w.cls+'">'+esc(w.label)+'</div>'
        +'<div class="wdef-s">'+half(Math.max(ds.red,ds.blue))+'&ndash;'
        +half(Math.min(ds.red,ds.blue))+' in '+prev+'</div></div>'
        +(T?'<div class="wdef-i"><div class="wdef-l">The Tourist Trophy</div>'
        +'<div class="wdef-v">'+flagFor(T.champ)+esc(nm(prev,T.champ))+'</div>'
        +'<div class="wdef-s">'+T.total+' points &middot; '
        +(T.titles.length>1?T.titles.length+" titles":"his first")+'</div></div>':"")
        +'</div><p class="note">Everything below fills in as the week is played.</p></div>';
    }
    return out+vaultRoll(y);
  }

  /* Before 2021 there are no match sheets, so the Cup half is told from what
     genuinely survives. The Tourist Trophy half is identical in both eras. */
  if (isVault(y)) return out+vaultCupSection(y)+ttSection(y,complete)+vaultRoll(y);

  // ── 1 · THE CUP ───────────────────────────────────────────────────────────
  const C=cupStory(y);
  const hi=Math.max(C.red,C.blue), lo=Math.min(C.red,C.blue);
  out+='<section class="wsec">'
    +'<div class="wband rband-'+C.w.cls+'">'+esc(C.w.label)+'</div>'
    +'<div class="wsec-h">The Cup</div>'
    /* winner-first, matching the Record Book cards: the band already names them,
       so the usual Red-first convention would read as though they came second */
    +'<div class="wscore">'+halfHTML(hi)+'<i>&ndash;</i>'+halfHTML(lo)+'</div>'
    +(complete?"":'<div class="wsec-n">as it stands &mdash; the tour is not finished</div>')
    +winPhoto(y,"cup",teamWord(C.side||"RED")+" \u00b7 "+y,
      "A photograph of the winning team");

  const F=[];
  if (C.ledFrom) F.push(["Led from",(C.ledFrom.meta.weekday||("day "+C.ledFrom.day)),
    "and were never headed again"]);
  if (C.changes) F.push(["Lead changed",C.changes+(C.changes===1?" time":" times"),
    "before it settled"]);
  /* A drawn week gets the honest label. 2025 finished 20–20 and Blue kept the Cup
     by retention, so a side IS named — but no day "did it", and saying so would be
     the page arguing with the scoreboard. */
  const decided = C.side && C.red!==C.blue;
  if (C.best&&C.best.sw>0) F.push([decided?"The day that did it":"Biggest swing",
    (C.best.p.meta.weekday||("Day "+C.best.p.day)),
    half(C.best.p.dR)+"&ndash;"+half(C.best.p.dB)+" &middot; "+cName(C.best.p.meta.course)]);
  if (C.closest) F.push(["Closest it got",half(C.closest.gap)+" point"+(C.closest.gap===1?"":"s"),
    "after "+(C.closest.p.meta.weekday||("day "+C.closest.p.day))]);
  out+='<div class="wfacts">'+F.map(([a,b,c])=>'<div class="wf"><div class="wf-l">'+a+'</div>'
    +'<div class="wf-v">'+b+'</div><div class="wf-s">'+c+'</div></div>').join("")+'</div>';

  // the running score, day by day — the shape of the week in one table
  out+='<div class="wpath"><div class="wpath-h"><span>Day</span><span>Course</span>'
    +'<span>Session</span><span>Running</span></div>';
  C.scored.forEach(p=>{
    const lead=p.R===p.B?"as":(p.R>p.B?"red":"blue");
    out+='<div class="wpath-r"><span class="wp-d">'+(p.meta.weekday||("D"+p.day))+'</span>'
      +'<span class="wp-c">'+esc(cName(p.meta.course))+'</span>'
      +'<span class="wp-s"><b class="t-r">'+half(p.dR)+'</b>&ndash;<b class="t-b">'+half(p.dB)+'</b></span>'
      +'<span class="wp-t wp-'+lead+'">'+half(p.R)+'&ndash;'+half(p.B)+'</span></div>';
  });
  out+='</div>';

  // who did the work
  const line=(lab,val,sub)=>'<div class="wrow"><div><b>'+lab+'</b>'
    +(sub?'<span class="kd">'+sub+'</span>':"")+'</div><div class="wrow-v">'+val+'</div></div>';
  let carried="";
  if (C.side){
    const top=C.side==="RED"?C.topRed:C.topBlue;
    if (top) carried+=line(flagFor(top)+esc(nm(y,top)),
      half(C.pts[top])+" of "+C.played1(top),
      "top scorer for "+teamWord(C.side)+" \u2014 points from singles matches played");
  }
  if (C.heaviest) carried+=line(flagFor(C.heaviest.win)+esc(nm(y,C.heaviest.win)),
    esc(C.heaviest.note),
    "heaviest win of the week, over "+esc(sur(y,C.heaviest.lose)));
  if (C.unbeaten.length) carried+=line(
    C.unbeaten.slice(0,3).map(i=>flagFor(i)+esc(sur(y,i))).join(", "),
    "unbeaten", (WORDNUM[C.unbeaten.length]||C.unbeaten.length)
      +" went the week without losing a singles match");
  carried+=line("Singles matches","<span class='t-r'>"+C.rec.RED.join("-")+"</span> &middot; "
    +"<span class='t-b'>"+C.rec.BLUE.join("-")+"</span>","Red &middot; Blue, won-halved-lost");
  carried+=line("Four-ball bonus","<span class='t-r'>"+C.bonus.RED+"</span> &middot; "
    +"<span class='t-b'>"+C.bonus.BLUE+"</span>"+(C.bonus.H?" &middot; "+C.bonus.H+" halved":""),
    "the extra point on offer in each group");
  out+='<div class="wrows">'+carried+'</div>'
    +'<p class="wroast">'+cupRoast(y,C)+'</p></section>';

  out += ttSection(y,complete);
  return out+vaultRoll(y);
}

/* The Tourist Trophy half of a Winners page. Shared by both eras: the individual
   Stableford is the one thing recorded identically all the way back to 2014, so the
   champion gets the same treatment whatever else survives of his year. */
function ttSection(y,complete){
  const d=DATA[y];
  const line=(lab,val,sub)=>'<div class="wrow"><div><b>'+lab+'</b>'
    +(sub?'<span class="kd">'+sub+'</span>':"")+'</div><div class="wrow-v">'+val+'</div></div>';
  let out="";
  const T=ttStory(y);
  if (T){
    const stars=ttCareerWins(T.champ,+y);
    out+='<section class="wsec">'
      +'<div class="wband wband-gold">'+(complete?"Tourist Trophy":"Leading the Tourist Trophy")+'</div>'
      +'<div class="wsec-h">'+flagFor(T.champ,"flag wsec-flag")+esc(nm(y,T.champ))
      +(stars?starStr(stars):"")+'</div>'
      +'<div class="wscore wscore-gold">'+T.total+'<i class="wsc-u">points</i></div>'
      +winPhoto(y,"tt",nm(y,T.champ)+" \u00b7 "+y,
      "A photograph of the champion");

    const G=[];
    const tt=(d.touristTrophy||{}), tw2=(tt.tiedWith||[]).filter(i=>i!==T.champ);
    if (tw2.length)
      G.push(["Had to beat", tw2.map(i=>esc(sur(y,i))).join(", "),
        "all level on "+T.total+" &mdash; settled on "+esc(tt.resolvedBy||"countback")]);
    else if (T.runner&&T.gap!=null) G.push(["Had to beat",esc(sur(y,T.runner)),
      T.gap===0?"level on points &mdash; settled on countback"
        :"by "+T.gap+" point"+(T.gap===1?"":"s")+" &middot; "+best3(y,T.runner)]);
    G.push(["Rounds",(T.rounds||[]).map((v,k)=>typeof v!=="number"?"&ndash;"
      :(k===T.di?"<s>"+v+"</s>":String(v))).join(" &middot; "),
      d.roundsAreBest3 ? "the counting rounds \u2014 his discard was deleted from the sheet"
        : (T.di>=0?"worst round struck":"all counting so far")]);
    if (T.bestRound) G.push(["Best round",String(T.bestRound),"his high mark of the week"]);
    G.push(["Finished","1 of "+T.field,"the whole field that year"]);
    if (T.cut!=null&&T.cut>0) G.push(["Cut",T.h0+" &rarr; "+T.hEnd,
      T.cut+" shot"+(T.cut===1?"":"s")+" taken off him as he went"]);
    out+='<div class="wfacts">'+G.map(([a,b,c])=>'<div class="wf"><div class="wf-l">'+a+'</div>'
      +'<div class="wf-v">'+b+'</div><div class="wf-s">'+c+'</div></div>').join("")+'</div>';

    // the climb, night by night — reusing the same standings the leaderboard prints
    /* 2017's sheet records no day-by-day attribution, so a climb cannot honestly
       be drawn for it. */
    if (T.climb.length>1 && d.dayAttribution!==false){
      out+='<div class="wclimb"><div class="wclimb-l">'
        +(T.wire?"Led from the first night to the last"
          :"From "+ordWord(T.climb[0].pos)+" to "+ordWord(T.climb[T.climb.length-1].pos))
        +'</div><div class="wclimb-r">'
        +T.climb.map((c,k)=>'<span class="wcl'+(c.pos===1?" one":"")+'">'
          +'<b>'+c.pos+'</b><i>'+((d.days[c.day-1]||{}).weekday||("D"+c.day))+'</i></span>'
          +(k<T.climb.length-1?'<span class="wcl-a">&rsaquo;</span>':"")).join("")
        +'</div></div>';
    }

    let tr="";
    if ((d.matches||[]).length)
    tr+=line("His own matchplay week",T.rec.join("-"),"won-halved-lost in the singles");
    tr+=line("Nett to par",(T.nett>0?"+":"")+T.nett,"across his counting rounds");
    if (T.titles.length>1)
      tr+=line("Tourist Trophies",T.titles.length,T.titles.join(" &middot; "));
    out+='<div class="wrows">'+tr+'</div>'
      +'<p class="wroast">'+ttRoast(y,T)+'</p></section>';

    // ── 3 · the cumulative bit: what winning it more than once means ─────────
    if (T.titles.length>1){
      const others=T.titles.filter(v=>v!==String(y));
      const most=[]; const byMan={};
      Object.keys(DATA).sort().forEach(yy=>{ if(!tourComplete(yy))return;
        const o=ttRanks(yy).ord; if(o.length) byMan[o[0]]=(byMan[o[0]]||0)+1; });
      const rank=Object.keys(byMan).sort((a,b)=>byMan[b]-byMan[a]);
      const ahead=rank.filter(i=>byMan[i]>T.titles.length).length;
      out+='<section class="wmult"><div class="wmult-h">Not his first</div>'
        +'<div class="wmult-b">'+esc(nm(y,T.champ))+' has won the Tourist Trophy '
        +'<b>'+(T.titles.length===2?"twice":(WORDNUM[T.titles.length]||T.titles.length)+" times")
        +'</b> &mdash; '+others.join(", ")+' and this one. '
        +(ahead===0?'Nobody has won it more.':'Only '+(WORDNUM[ahead]||ahead)+' '
          +(ahead===1?"man has":"men have")+' won it more often.')+'</div>'
        +'<div class="wmult-y">'+T.titles.map(v=>'<span class="wmy'+(v===String(y)?" on":"")+'">'
          +v+'</span>').join("")+'</div></section>';
    }
  }
  return out;
}

/* The years before the detailed record begins. Champions only — that is genuinely
   all that survives — kept on every page so the honour roll is never partial. */
function vaultRoll(y){
  /* Newest first, to match the Origins timeline. */
  const vault=Object.keys(DATA).sort().filter(isVault).filter(tourComplete).reverse();
  if(!vault.length) return "";
  return '<section class="wvault"><div class="wvault-h">Before the record begins</div>'
    +'<div class="wvault-s">Champions of the early tours, newest first &middot; tap a year '
    +'to open it &middot; the wider story is on the <b>Origins</b> tab</div>'
    +'<div class="wvault-g">'
    +vault.map(v=>{ const o=ttRanks(v).ord, c=o[0];
      const cup=(LEGACY.trophyWinnersPre2021||{})[v];
      return '<div class="wv" role="button" tabindex="0" onclick="setYr(\''+v+'\')" '
        +'title="Open the '+v+' page"><span class="wv-y">'+v+'</span>'
        +'<span class="wv-n">'+flagFor(c)+esc(nm(v,c))+'</span>'
        +'<span class="wv-t">'+best3(v,c)+'</span>'
        +'<span class="wv-c'+(cup?" wv-"+cup.toLowerCase():"")+'">'+(cup?teamWord(cup):"&middot;")+'</span></div>';
    }).join("")+'</div></section>';
}

function vRecords(){
  const t = tallyAfter(9999);
  const yrs = Object.keys(DATA).sort();
  let roll="";
  yrs.forEach(y=>{
    const {ord}=ttRanks(y); if(!ord.length||!tourComplete(y)) return;
    const ds=dayScores(y);
    const w=teamWinner(y);                     // who lifted the trophy, however we know it
    /* Winner's score first: the band already names them, so "Blue win 27½–20½"
       reads straight, where the Red-first convention would put them second. */
    let score="";
    if (ds.red||ds.blue){
      const hi=Math.max(ds.red,ds.blue), lo=Math.min(ds.red,ds.blue);
      score=half(hi)+"–"+half(lo);
    }
    roll+='<div class="r'+(w?" r-"+w.cls:"")+'">'
      +(w?'<div class="rband rband-'+w.cls+'">'+esc(w.label)+(score?' <span class="rsc">'+score+'</span>':"")
          +(w.retained?' <span class="rsc">retained</span>':"")+'</div>':"")
      +'<div class="ry">'+y+' · '+esc((DATA[y].event.venue||"").split(",")[0])+'</div>'
      +(isCovidYear(y)?'<div class="rcovid">'+covidChip(y)+'</div>':"")
      +'<div class="rc">'+esc(nm(y,ord[0]))+' '+best3(y,ord[0])+'</div>'
      +'<div class="rs">Spoon: '+esc(sur(y,ord[ord.length-1]))+'</div></div>';
  });
  const agg={};
  yrs.forEach(y=>{
    if(!tourComplete(y)) return;            // an unfinished tour never touches the career record book
    DATA[y].players.forEach(p=>{
      const a=agg[p.id]=agg[p.id]||{name:p.name,apps:0,teams:new Set(),w:0,h:0,l:0,spoons:0};
      a.apps++; a.teams.add(p.team);
    });
    DATA[y].matches.forEach(m=>m.singles.forEach(s=>{
      const {w}=decide(s); if(!w) return;
      if(w==="HALVED"){agg[s.red].h++;agg[s.blue].h++;}
      else{ const win=w==="RED"?s.red:s.blue, lose=w==="RED"?s.blue:s.red; agg[win].w++; agg[lose].l++; }
    }));
    const {ord}=ttRanks(y);
    if (ord.length && played(y,ord[ord.length-1]).length===DATA[y].days.length) agg[ord[ord.length-1]].spoons++;
  });
  const rows = Object.entries(agg).sort((a,b)=>{
    const tw=i=>ttCareerWins(i,2026);
    return tw(b[0])-tw(a[0]) || b[1].apps-a[1].apps || a[1].name.localeCompare(b[1].name);
  }).map(([id,a])=>{
    const tw=ttCareerWins(id,2026);
    return '<div class="crow"><div>'+esc(a.name)+starStr(tw)+(a.teams.size>1?' <span class="rtag rtag-mute">Switcher</span>':'')+'</div>'
      +'<div>'+a.apps+'</div><div>'+tw+'</div><div>'+a.w+'-'+a.h+'-'+a.l+'</div><div>'+a.spoons+'</div></div>';
  }).join("");
  const meets={};
  yrs.forEach(y=>{ if(!tourComplete(y)) return; DATA[y].matches.forEach(m=>m.singles.forEach(s=>{
    const {w}=decide(s); if(!w)return;
    const key=[s.red,s.blue].sort().join("|");
    const e=meets[key]=meets[key]||{n:0,a:0,b:0,h:0};
    e.n++;
    if(w==="HALVED")e.h++;
    else{ const win=w==="RED"?s.red:s.blue; if(win===key.split("|")[0])e.a++; else e.b++; }
  })); });
  const name=id=>{ for(const y of yrs) if(P(y)[id]) return P(y)[id].name; return id; };
  const grudges = Object.entries(meets).filter(([k,v])=>v.n>=3).sort((a,b)=>b[1].n-a[1].n).slice(0,12)
    .map(([k,v])=>{ const [a,b]=k.split("|");
      return '<div class="grudge"><span><b>'+esc(name(a))+'</b> v <b>'+esc(name(b))+'</b></span>'
        +'<span class="gr">'+v.n+' meetings · '+esc(name(a).split(" ").slice(-1)[0])+' '+v.a+'-'+v.h+'-'+v.b+'</span></div>'; }).join("");
  const kiff = (LEGACY.openQuestions||[]).some(q=>q.indexOf("Kiff")>=0)
    ? '<p class="note">Kevin Kiff claims a further title — the matter remains subject to committee inquiry.</p>' : '';
  return '<h2 class="sec-t">The Record Book</h2>'
    +'<div class="sec-s">Every tour since 2014 · match detail from 2021</div>'
    +'<div class="tally"><span class="n t-b">'+t.BLUE+'</span><span class="v">–</span><span class="n t-r">'+t.RED+'</span></div>'
    +'<div class="tally-sub">Trophies, Blue v Red · next: Tour '+(LEGACY.tourNumbering["2026"]||11)+', 2026</div>'
    +'<div class="roll">'+roll+'</div>'
    +covidFootnote()
    +'<div class="sec"><h2 class="sec-t">Career</h2><div class="sec-s">★ Tourist Trophy titles (incl. pre-2021) · singles match record 2021–25</div>'
    +'<div class="lb"><div class="crow hd"><div>Player</div><div>Apps</div><div>TT</div><div>W-H-L</div><div>Spoons</div></div>'+rows+'</div>'+kiff+'</div>'
    +'<div class="sec"><h2 class="sec-t">Grudge Matches</h2><div class="sec-s">Most-met singles match pairings, 2021–25</div>'
    +'<div class="lb">'+grudges+'</div></div>';
}

        +'<div class="btns">'
        +'<button class="rbtn'+(w==="RED"?" sel-red":"")+'" onclick="setWin(\''+id+'\',\'RED\')">'+esc(sur(y,s.red))+'</button>'
        +'<button class="rbtn'+(w==="HALVED"?" sel-h":"")+'" onclick="setWin(\''+id+'\',\'HALVED\')">A/S</button>'
        +'<button class="rbtn'+(w==="BLUE"?" sel-blue":"")+'" onclick="setWin(\''+id+'\',\'BLUE\')">'+esc(sur(y,s.blue))+'</button>'
        +'</div>'
        +(w==="RED"||w==="BLUE" ?
          '<div class="marg"><span class="ml">Won</span><select onchange="setMarg(\''+id+'\',this.value)">'
          +[["","—"],["1up","1 up"],["2&1","2&1"],["3&1","3&1"],["3&2","3&2"],["4&2","4&2"],["4&3","4&3"],["5&3","5&3"],["5&4","5&4"],["6&4","6&4"],["6&5","6&5"],["7&5","7&5"],["7&6","7&6"],["8&6","8&6"],["8&7","8&7"],["9&7","9&7"],["10&8","10&8"]]
            .map(([v2,l])=>'<option value="'+v2+'"'+(note===l||note===v2?" selected":"")+'>'+l+'</option>').join("")
          +'</select></div>' : "")

    if (m.format==="4ball"){

      const bw=m.fourBBB?m.fourBBB.winner:null;
      out+='<div class="mrow"><div class="who"><span class="mutd">Four-ball bonus · '+esc(m.tee||"")+'</span></div><div class="btns">'
        +'<button class="rbtn'+(bw==="RED"?" sel-red":"")+'" onclick="setFB(\''+id+'\',\'RED\')">Red</button>'

        +'<button class="rbtn'+(bw==="BLUE"?" sel-blue":"")+'" onclick="setFB(\''+id+'\',\'BLUE\')">Blue</button>'
        +'</div></div>';

    +'<input id="pubToken" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" '
    +'autocomplete="off" name="ntrc-not-a-password" data-lpignore="true" data-1p-ignore data-bwignore '
    +'placeholder="Token" value="'+(cfg?esc(cfg.token):"")+'">'
    /* Browsers refuse to copy out of a password field, which makes getting the token
       onto a second device impossible. This flips it to plain text so it can be read. */
    +'<button class="btn-quiet" onclick="showToken(this)">Show</button>'
    +'<button class="btn-quiet" onclick="pubSave()">Save</button>'
    +'<button class="btn-quiet" onclick="pubTest()">Test</button></div>'
    +sealRow()+'</details>'
    +'<div style="text-align:center;margin-top:12px"><button class="btn-primary" onclick="publishNow()">Publish scores to team site</button>'
    +' <button class="btn-quiet" onclick="exportData()">Export '+y+' data</button>'
    /* "Publishing to X" read as "publish in progress" — it meant "configured for X".
       Say when it last went out instead, which is the thing you actually want. */
    +'<div class="note" id="pubStatus">'+(cfg?pubIdleText(cfg):'One-off setup needed — ask Claude to walk you through it (10 minutes, then never again).')+'</div></div></div>'
    +'<div class="panel" style="margin-top:16px;text-align:center"><div class="sec-s" style="margin:2px 0 8px">End-of-tour review reel</div>'
    +'<div class="note">On the last day: <b>Export '+y+' data</b> above, drop it and the tour photos in the project folder, then run <b>build_review.py</b> — out comes a cinematic review reel to publish to the group before you leave.</div></div>';
  return out;
}
/* entry handlers */
window.setDay = d => { entryDay=d; render(); };
window.setWin = (id,w) => {
  if (sealed(curYear)) return;
  const [dd,mi,si]=id.split("_").map(Number);
  const ms=DATA[curYear].matches.filter(m=>m.day===dd);
  const s=ms[mi].singles[si];
  if (w==="HALVED") s.result="AS";
  else s.result = w==="RED" ? {red:1,blue:null} : {red:null,blue:1}; /* margin refined via select */
  markDirty(); render();
};
window.setMarg = (id,v) => {
  if (sealed(curYear)) return;
  const [dd,mi,si]=id.split("_").map(Number);
  const ms=DATA[curYear].matches.filter(m=>m.day===dd);
  const s=ms[mi].singles[si];
  if (s.result==="AS"||s.result==null) return;
  const redWon = marginOf(s.result.red)!=null && (marginOf(s.result.blue)==null || marginOf(s.result.red)>marginOf(s.result.blue));
  let up=null,tp=null;
  if (v==="1up"){ up="1up"; tp=null; }
  else if (v){ const p=v.split("&"); up=+p[0]; tp=+p[1]; }
  else { up=1; tp=null; }
  s.result = redWon ? {red:up,blue:tp} : {red:tp,blue:up};
  markDirty(); render();
};
window.setFB = (id,w) => {
  if (sealed(curYear)) return;
  const p=id.split("_"); const dd=+p[1], mi=+p[2];
  const ms=DATA[curYear].matches.filter(m=>m.day===dd);
  ms[mi].fourBBB = {winner:w};
  markDirty(); render();
};
window.saveScores = () => {
  if (sealed(curYear)) return;
  const d=DATA[curYear];
  d.players.forEach(pp=>{
    const el=document.getElementById("sc-"+pp.id);
    if(!el) return;
    const v=el.value.trim();
    if(!d.rounds[pp.id]) d.rounds[pp.id]=[null,null,null,null];
    d.rounds[pp.id][entryDay-1] = v==="" ? null : Math.max(0,Math.min(60,parseInt(v)||0));
  });
  markDirty(true);
  const n=document.getElementById("savedNote"); if(n) n.textContent="Saved — board updated";
};
function markDirty(persistNow){
  if (sealed(curYear)) return;
  override[curYear]=DATA[curYear];
  localStorage.setItem(LS, JSON.stringify(override));
  try{ localStorage.setItem("ntrc.lastEdit", new Date().toISOString()); }catch(e){}
}
/* Uploading team_site/ ships the APP. Publishing ships the DATA. They are two
   different acts and it is not obvious, so say so wherever data is entered. */
/* The passphrase belongs wherever publishing happens — Justin looked for it on the
   Enter tab, which is exactly where you would look. */
function sealRow(){
  if (READONLY) return "";
  const pass=sealPass();
  return '<div class="sealrow">'
    +'<span class="sl-t">Draw passphrase</span>'
    +'<input type="password" autocomplete="off" placeholder="'+(pass?"set on this device":"not set")+'" '
    +'onchange="setSealPass(this.value)" style="width:150px">'
    +'<div class="note" style="margin-top:8px">'
    +(pass ? 'Set on this device. The days the team cannot see yet are encrypted before '
             +'publishing &mdash; type the same words on your phone to unlock them there.'
           : 'Set one and the unrevealed days are encrypted in the published file, not '
             +'merely hidden. Leave it blank and publishing behaves exactly as before.')
    +'</div></div>';
}
/* ---------- the guard ----------
   The phone is loaded from the web and re-reads the published file every time it
   opens, so it always catches up. This file is opened from disk and fetches
   nothing, so it would happily publish yesterday's scores over tonight's.

   On opening, it asks GitHub what is actually on the site. If the site holds
   something this machine did not send, it says so and offers to take it. */
let siteNewer=null;           // {publishedAt} when the site is ahead of this device
async function siteState(){
  const cfg=pubCfg(); if(!cfg) return null;
  try{
    const r=await fetch("https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo
      +"/contents/data.json?ref=HEAD&t="+Date.now(),
      {headers:{Authorization:"Bearer "+cfg.token, Accept:"application/vnd.github+json"}});
    if(!r.ok) return null;
    const j=await r.json();
    const txt=decodeURIComponent(escape(atob(String(j.content||"").replace(/\s/g,""))));
    return JSON.parse(txt);
  }catch(e){ return null; }
}
async function checkSite(){
  if (HOSTED || READONLY) return;               // the phone already syncs itself
  const remote=await siteState(); if(!remote || !remote.publishedAt) return;
  let mine=null; try{ mine=localStorage.getItem("ntrc.lastPublish"); }catch(e){}
  if (mine && remote.publishedAt <= mine) return;     // this machine sent it
  siteNewer={publishedAt:remote.publishedAt};
  render();
}
window.pullFromSite = async () => {
  const st=m=>{const el=document.getElementById("pubStatus"); if(el) el.innerHTML=m;};
  st("Fetching what's on the site…");
  const remote=await siteState();
  if(!remote){ st("Couldn't reach the site — try again when there's signal."); return; }
  let got=false;
  Object.keys(remote).forEach(k=>{ if(/^\d{4}$/.test(k) && remote[k]){ BASE[k]=remote[k]; got=true; } });
  if(!got){ st("Nothing on the site to load."); return; }
  for (const k of Object.keys(override)) if (BASE[k]) delete override[k];
  try{ localStorage.setItem(LS, JSON.stringify(override));
       localStorage.setItem("ntrc.lastPublish", remote.publishedAt);
       localStorage.removeItem("ntrc.lastEdit"); }catch(e){}
  rebuildData();
  try{ await unsealAll(sealPass()); }catch(e){}
  siteNewer=null; render();
  st("&#10003; Loaded what's on the site. This machine now matches the team.");
};
function pubIdleText(cfg){
  let pub=null; try{ pub=localStorage.getItem("ntrc.lastPublish"); }catch(e){}
  const where=esc(cfg.owner+"/"+cfg.repo);
  if(!pub) return "Ready &middot; nothing published yet &middot; "+where;

        +d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }catch(e){}

}
function publishBar(){
  if (READONLY) return "";
  let ed=null, pub=null;
  try{ ed=localStorage.getItem("ntrc.lastEdit"); pub=localStorage.getItem("ntrc.lastPublish"); }catch(e){}
  const stale = ed && (!pub || ed>pub);
  const when = t => { try{ const d=new Date(t);
    return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" "
      +d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } };
  if (siteNewer){
    let w=siteNewer.publishedAt;
    try{ const d=new Date(w);
      w=d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" "
       +d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }catch(e){}
    return '<div class="pubbar stale">'
      +'<div class="pb-t">&#9679; The team site is ahead of this machine &mdash; '
      +'something was published '+esc(w)+', most likely from your phone</div>'
      +'<button class="btn-primary" onclick="pullFromSite()">Load what&rsquo;s on the site</button>'
      +'<div class="note" style="margin-top:10px">Publishing from here first would '
      +'overwrite it. Load it in, then carry on.</div>'
      +'<div class="note" id="pubStatus"></div></div>';
  }
  return '<div class="pubbar'+(stale?" stale":"")+'">'
    +'<div class="pb-t">'+(stale
        ? '&#9679; Unpublished changes &mdash; the team still sees the last published version'
        : (pub ? 'Everything here is published &middot; last sent '+when(pub)
               : 'Nothing has been published yet'))+'</div>'
    +'<button class="btn-primary" onclick="publishNow()">Publish to team site</button>'
    +'<div class="note" id="pubStatus"></div></div>';
}

/* ---------- player dossiers ---------- */
let curPlayer = "justin-lawrence";
function careerOf(pid){
  const yrs = Object.keys(DATA).sort().filter(y=>DATA[y].players.some(p=>p.id===pid)
    && tourComplete(y) && (DATA[y].rounds[pid]||[]).some(x=>typeof x==="number"));   // a tour only joins the career record once it's finished
  const C = { yrs, teams:[], rounds:[], matches:[], partners:{}, twoBalls:0,
              bbb:0, given:0, received:0, byDay:{}, byCourse:{}, finishes:[] };
  yrs.forEach(y=>{
    const d=DATA[y];
    const myTeam=(d.players.find(p=>p.id===pid)||{}).team;
    if (myTeam) C.teams.push(myTeam);        // 2014–2016 had no colours to push
    const courses={}; d.days.forEach(x=>courses[x.day]=(x.course||"").split(",")[0].trim());
    (d.rounds[pid]||[]).forEach((s,k)=>{
      if (typeof s!=="number") return;
      const h=dailyHcps(y,pid)[k];
      C.rounds.push({y, day:k+1, s, h, course:courses[k+1]||""});
      /* 2017's three surviving rounds can't be pinned to a day, so they'd poison
         a "best day of the week" read; the scores still count everywhere else. */
      if (d.dayAttribution!==false) (C.byDay[k+1]=C.byDay[k+1]||[]).push(s);
      const cn=courses[k+1]; if (cn) (C.byCourse[cn]=C.byCourse[cn]||[]).push(s);
    });
    d.matches.forEach(m=>{
      const mine=m.singles.find(s2=>s2.red===pid||s2.blue===pid);
      if (!mine) return;
      const iAmRed = mine.red===pid;
      const opp = iAmRed?mine.blue:mine.red;
      const {w, note} = decide(mine);
      let res=null;
      if (w==="HALVED") res="H";
      else if (w) res = (w==="RED")===iAmRed ? "W" : "L";
      const hMe=dailyHcps(y,pid)[m.day-1], hOp=dailyHcps(y,opp)[m.day-1];
      let shots=0, giving=false;
      if (typeof hMe==="number" && typeof hOp==="number"){
        shots=Math.abs(hMe-hOp); giving = hMe<hOp;
        if (giving) C.given+=shots; else C.received+=shots;
      }
      C.matches.push({y, day:m.day, opp, res, note, shots, giving});
      if (m.format==="4ball" && m.singles.length===2){
        const other=m.singles.find(s2=>s2!==mine);
        const partner = iAmRed?other.red:other.blue;
        const pr = C.partners[partner]=C.partners[partner]||{w:0,h:0,l:0,n:0};
        if (m.fourBBB){
          pr.n++;
          const bw=m.fourBBB.winner;
          const myTeam = iAmRed?"RED":"BLUE";
          if (bw==="HALVED") pr.h++;
          else if (bw===myTeam){ pr.w++; C.bbb+=1; }
          else pr.l++;
          if (bw==="HALVED") C.bbb+=.5;
        }
      }
      if (m.format==="2ball") C.twoBalls++;
    });
    /* A missed round still leaves a real finishing position — the Trophy is best-3,
       so a three-round card is scored on the same terms as anyone else's counting
       three. Only a man with nothing to count is left off. */
    const {ord}=ttRanks(y);
    if (played(y,pid).length) C.finishes.push({y, pos:ord.indexOf(pid)+1, of:ord.length, total:best3(y,pid), short:played(y,pid).length<d.days.length});
  });
  return C;
}
function vPlayers(){
  /* every tourist we have on record, grouped by the colour they last wore */
  /* The 2015 one-offs are three surnames and four rounds apiece — they belong in the
     Origins vault and in the roasts, not behind a dossier pill promising deep stats. */
  const skip=new Set((LEGACY.mia||{}).players||[]);
  const pool={};
  Object.keys(DATA).sort().forEach(y=>DATA[y].players.forEach(p=>{
    if (skip.has(p.id)) return;
    const prev=pool[p.id];
    pool[p.id]={name:p.name, team:p.team, teams:(prev?prev.teams:new Set())};
    if (p.team) pool[p.id].teams.add(p.team);
  }));
  if (!pool[curPlayer]) curPlayer=Object.keys(pool).sort()[0];
  // surnames alone are ambiguous (two Foxes) — add an initial only where needed
  const surCount={};
  Object.values(pool).forEach(o=>{ const sn=o.name.split(" ").slice(-1)[0];
    surCount[sn]=(surCount[sn]||0)+1; });
  const label=o=>{ const parts=o.name.split(" "), sn=parts.slice(-1)[0];
    return surCount[sn]>1 ? parts[0][0]+". "+sn : sn; };
  const groups={RED:[],BLUE:[]};
  Object.entries(pool).forEach(([id,o])=>{ (groups[o.team]||groups.BLUE).push([id,o]); });
  ["RED","BLUE"].forEach(t=>groups[t].sort((a,b)=>label(a[1]).localeCompare(label(b[1]))));
  const groupHTML=t=>{
    if (!groups[t].length) return "";
    const cls=t==="RED"?"r":"b";
    return '<div class="pp-group"><div class="pp-lab '+cls+'">'+(t==="RED"?"Red":"Blue")+'</div>'
      +'<div class="pp-picker">'+groups[t].map(([id,o])=>
        '<button class="pp-pill '+cls+(id===curPlayer?" on":"")+'" onclick="setPlayer(\''+id+'\')"'
        +' title="'+esc(o.name)+(o.teams.size>1?" · has worn both colours":"")+'">'
        +flagFor(id,"flag pp-flag")+esc(label(o))+(o.teams.size>1?'<span class="sw">\u21C4</span>':"")+'</button>').join("")+'</div></div>';
  };
  const picker = groupHTML("RED")+groupHTML("BLUE");
  const pid=curPlayer, name=(pool[pid]||{}).name||pid;
  const C=careerOf(pid);
  const stars=ttCareerWins(pid, 2099);
  const leg=(LEGACY.careerTouristTrophyWins||{})[pid];
  if (!C.rounds.length)
    return '<h2 class="sec-t">Player Dossiers</h2><div class="pp-picker">'+picker+'</div>'
      +'<div class="empty">'+esc(name)+' — no recorded form. An unknown quantity. Frankly, dangerous.</div>';

  const w=C.matches.filter(m=>m.res==="W").length, h=C.matches.filter(m=>m.res==="H").length, l=C.matches.filter(m=>m.res==="L").length;
  const pct = (w+h+l) ? Math.round(100*(w+.5*h)/(w+h+l)) : 0;
  const spoons=C.finishes.filter(f=>f.pos===f.of).length;
  const brides=C.finishes.filter(f=>f.pos===2).length;
  const bestFin=C.finishes.length?C.finishes.reduce((a,b)=>b.pos<a.pos?b:a):null;

  const bestR=C.rounds.reduce((a,b)=>b.s>a.s?b:a);
  const worstR=C.rounds.reduce((a,b)=>b.s<a.s?b:a);
  const avg=Math.round(10*C.rounds.reduce((t,r)=>t+r.s,0)/C.rounds.length)/10;
  const to36=C.rounds.filter(r=>r.s>=36).length;
  const bestTour=C.finishes.length?C.finishes.reduce((a,b)=>b.total>a.total?b:a):null;

  const hcps=C.rounds.map(r=>r.h).filter(x=>typeof x==="number");
  const loH=Math.min(...hcps), hiH=Math.max(...hcps);
  let cut=null, rise=null, odo=0;
  Object.keys(DATA).sort().forEach(y=>{
    if(!DATA[y].players.some(p=>p.id===pid))return;
    const dh=dailyHcps(y,pid);
    for(let k=1;k<dh.length;k++){
      if(typeof dh[k]!=="number"||typeof dh[k-1]!=="number")continue;
      const dl=dh[k]-dh[k-1]; odo+=Math.abs(dl);
      if(!cut||dl<cut.dl)cut={dl,y,day:k+1};
      if(!rise||dl>rise.dl)rise={dl,y,day:k+1};
    }});
  const carry=carryInfo(pid);

  const oppAgg={};
  C.matches.forEach(m=>{ if(!m.res)return;
    const o=oppAgg[m.opp]=oppAgg[m.opp]||{w:0,h:0,l:0,n:0};
    o.n++; if(m.res==="W")o.w++; else if(m.res==="H")o.h++; else o.l++; });
  const names={}; Object.keys(DATA).forEach(y=>DATA[y].players.forEach(p=>names[p.id]=p.name));
  const nem = Object.entries(oppAgg).filter(([,o])=>o.n>=2).sort((a,b)=> (b[1].l-b[1].w)-(a[1].l-a[1].w) || b[1].n-a[1].n)[0];
  const bun = Object.entries(oppAgg).filter(([,o])=>o.n>=2).sort((a,b)=> (b[1].w-b[1].l)-(a[1].w-a[1].l) || b[1].n-a[1].n)[0];
  const bigWin = C.matches.filter(m=>m.res==="W"&&m.note&&m.note!=="A/S").sort((a,b)=>{
    const v=x=>{const mm=x.note.match(/^(\d+)(?:&(\d+))?/); return mm?[+mm[1],+(mm[2]||0)]:[0,0];};
    const [au,at]=v(a),[bu,bt]=v(b); return bu-au||bt-at; })[0];
  const bigLoss = C.matches.filter(m=>m.res==="L"&&m.note&&m.note!=="A/S").sort((a,b)=>{
    const v=x=>{const mm=x.note.match(/^(\d+)(?:&(\d+))?/); return mm?[+mm[1],+(mm[2]||0)]:[0,0];};
    const [au,at]=v(a),[bu,bt]=v(b); return bu-au||bt-at; })[0];
  const maxGive=C.matches.filter(m=>m.giving).sort((a,b)=>b.shots-a.shots)[0];
  const maxTake=C.matches.filter(m=>!m.giving&&m.shots>0).sort((a,b)=>b.shots-a.shots)[0];

  let curW=0,maxW=0,curL=0,maxL=0;
  C.matches.forEach(m=>{ if(!m.res)return;
    if(m.res==="W"){curW++;curL=0;} else if(m.res==="L"){curL++;curW=0;} else {curW=0;curL=0;}
    maxW=Math.max(maxW,curW); maxL=Math.max(maxL,curL); });

  const dayAvg=Object.entries(C.byDay).map(([d2,v])=>[d2, v.reduce((a,b)=>a+b,0)/v.length]);
  const bestDay=dayAvg.slice().sort((a,b)=>b[1]-a[1])[0];
  const worstDay=dayAvg.slice().sort((a,b)=>a[1]-b[1])[0];
  const courseAvg=Object.entries(C.byCourse).filter(([c])=>c&&c!=="?").map(([c,v])=>[c, v.reduce((a,b)=>a+b,0)/v.length]);
  const bestCourse=courseAvg.slice().sort((a,b)=>b[1]-a[1])[0];
  const partBest=Object.entries(C.partners).filter(([,p])=>p.n>=2).sort((a,b)=>(b[1].w/b[1].n)-(a[1].w/a[1].n))[0];
  const partWorst=Object.entries(C.partners).filter(([,p])=>p.n>=2).sort((a,b)=>(a[1].w/a[1].n)-(b[1].w/b[1].n))[0];
  const dayNames={1:"Day One",2:"Day Two",3:"Day Three",4:"Day Four"};
  const sw = (typeof odo==="number") ? odo : 0;
  const teamSet=[...new Set(C.teams)];
  const net=C.given-C.received;

  function srow(label,val,note){
    return '<div class="srow"><span class="sl">'+label+'</span><span class="sv">'+val+'</span>'
      +(note?'<span class="sn">'+note+'</span>':"")+'</div>';
  }
  function secHead(t,s){ return '<div class="sec"><h2 class="sec-t">'+t+'</h2>'+(s?'<div class="sec-s">'+s+'</div>':'<div style="height:14px"></div>'); }

  const capNow = CAPTAINS.RED===pid ? "RED" : (CAPTAINS.BLUE===pid ? "BLUE" : null);
  const capPast = Object.keys(DATA).sort().filter(y=>+y<EDIT_FROM && (DATA[y].players.find(p=>p.id===pid)||{}).captain);
  let capLine="";
  if (capNow) capLine=' · <b>Captain of the '+(capNow==="RED"?"Reds":"Blues")+', '+NEXT+'</b> — wears the armband, carries the blame'
    +(capPast.length?' (previous spell: '+capPast.join(", ")+')':"");
  else if (capPast.length) capLine=' · former captain ('+capPast.join(", ")+') — relieved of command';
  let out='<h2 class="sec-t">Player Dossiers</h2>'
    +'<div class="sec-s">the full charge sheet, one tourist at a time</div>'
    +picker
    +'<header class="mast" style="margin-top:10px"><h1 style="font-size:clamp(26px,5vw,40px)">'+(capNow?'<span class="capb">C</span> ':"")+flagFor(pid,"flag dos-flag")+esc(name)+starStr(stars)+'</h1>'
    +'<div class="subtitle">'+C.yrs.join(" · ")+' · '
    +(teamSet.length>1 ? "⇄ both colours worn — loyalty negotiable"
      : teamSet.length===1 ? teamSet[0].charAt(0)+teamSet[0].slice(1).toLowerCase()+" loyalist"
      : "played before the colours")
    +(leg&&leg.pre2021?' · '+leg.pre2021+' pre-2021 title'+(leg.pre2021>1?'s':'')+' on the books':'')
    +capLine+'</div></header>'
    +'<div class="quart" style="margin-top:18px">'
    +'<div class="q"><div class="q-n">'+C.yrs.length+'</div><div class="q-l">Tours<br>played</div></div>'
    +'<div class="q"><div class="q-n">'+w+'-'+h+'-'+l+'</div><div class="q-l">Career singles matches<br>'+pct+'% won</div></div>'
    +'<div class="q"><div class="q-n">'+stars+'</div><div class="q-l">Tourist Trophy<br>titles</div></div>'
    +'<div class="q"><div class="q-n">'+spoons+'</div><div class="q-l">Wooden<br>spoon'+(spoons===1?"":"s")+'</div></div>'
    +'</div>';

  out+=secHead("Scoring","stableford, career");
  out+='<div class="lb">'
    +srow("Best round", bestR.s, dayNames[bestR.day]+" "+bestR.y+(bestR.course?" · "+esc(bestR.course):""))
    +srow("Worst round", worstR.s, dayNames[worstR.day]+" "+worstR.y+" — "
      +((folkloreFor(pid, worstR.y, worstR.day)[0]||{}).short || "a day best forgotten"))
    +srow("Career average", avg, C.rounds.length+" rounds recorded")
    +srow("Played to handicap or better", to36+" of "+C.rounds.length, Math.round(100*to36/C.rounds.length)+"% — the committee is watching")
    +(bestTour?srow("Best tour", bestTour.total+" ("+bestTour.y+")", "finished "+bestTour.pos+(bestTour.pos===1?"st — champion":bestTour.pos===2?"nd":bestTour.pos===3?"rd":"th")):"")
    +(bestFin?srow("Best Trophy finish", bestFin.pos===1?"Champion":"#"+bestFin.pos, bestFin.y+(brides?" · bridesmaid ×"+brides:"")):"")
    +'</div></div>';

  out+=secHead("The Handicap Rap Sheet","what the nightly algorithm has done to this man");
  out+='<div class="lb">'
    +srow("Lowest playing handicap", loH, "peak fitness")
    +srow("Highest playing handicap", hiH, hiH-loH>=10?"a different sport entirely":"")
    +(cut&&cut.dl<0?srow("Harshest overnight cut", cut.dl, dayNames[cut.day]+" "+cut.y+" — punished for playing well"):"")
    +(rise&&rise.dl>0?srow("Kindest overnight gift", "+"+rise.dl, dayNames[rise.day]+" "+rise.y+" — rewarded for failure"):"")
    +srow("The Odometer", sw+" shots", "total handicap moved, career — the algorithm never sleeps")
    +(carry?srow("Carries into "+NEXT, carry.hcp, "from "+carry.year+(carry.raw!==carry.hcp?" (raw "+carry.raw+")":"")):"")
    +'</div></div>';

  out+=secHead("Match Play","singles matches, career");
  out+='<div class="lb">'
    +(bigWin?srow("Biggest win", esc(bigWin.note), "v "+esc((names[bigWin.opp]||bigWin.opp).split(" ").slice(-1)[0])+", "+bigWin.y):"")
    +(bigLoss?srow("Heaviest defeat", esc(bigLoss.note), "v "+esc((names[bigLoss.opp]||bigLoss.opp).split(" ").slice(-1)[0])+", "+bigLoss.y+" — still not spoken of"):"")
    +srow("Longest win streak", maxW||"–", maxW>=3?"a genuine hot streak":"")
    +srow("Longest losing streak", maxL||"–", maxL>=3?"character-building stuff":"")
    +srow("2-ball duty", C.twoBalls+" time"+(C.twoBalls===1?"":"s"), "sent out alone, no partner to blame")
    +'</div></div>';

  out+=secHead("The Shots Ledger","strokes given and received, career");
  out+='<div class="lb">'
    +srow("Shots given", C.given, "")
    +srow("Shots received", C.received, "")
    +srow(net>=0?"Net philanthropist":"Net beneficiary", Math.abs(net), net>=0?"the tour thanks its sponsor":"living comfortably off the field")
    +(maxGive?srow("Most given in one match", maxGive.shots, "v "+esc((names[maxGive.opp]||"").split(" ").slice(-1)[0])+", "+maxGive.y+" — "+(maxGive.res==="W"?"and STILL won":maxGive.res==="L"?"and duly lost":"halved, somehow")):"")
    +(maxTake?srow("Most received in one match", maxTake.shots, "v "+esc((names[maxTake.opp]||"").split(" ").slice(-1)[0])+", "+maxTake.y+" — "+(maxTake.res==="W"?"and cashed them in":maxTake.res==="L"?"and lost anyway, which takes talent":"halved")):"")
    +'</div></div>';

  out+=secHead("Company Kept","who to avoid at the draw");
  out+='<div class="lb">'
    +(nem&&nem[1].l>nem[1].w?srow("Nemesis", esc(names[nem[0]]||nem[0]), nem[1].w+"-"+nem[1].h+"-"+nem[1].l+" against — crosses the street to avoid him"):srow("Nemesis","none found","nobody owns this man. Yet."))

/* ---------- draw generator ---------- */
/* One draw creates BOTH the singles opponents and the 4BBB partners (the two same-team
   players sharing a 4-ball are partners). Optimises across ALL days at once:
   repeat opponents (heavy) · repeat partners (heavy) · same-group repeats (medium)
   · repeat 2-balls · tee-slot fairness · last-year rematches (light) · extreme hcp gaps (light).
   Supports pinned pairings; pinned matches keep their day. */
let proposal = null;
let pins = [];   // [{day, red, blue}]
/* Fixed pairings for a year, keyed by day. Only one per day is supported, because
   the thing being reserved is a single place in the running order: the first tee. */
function fixedFor(y){
  const m={};
  (DRAW_FIXED||[]).forEach(f=>{ if(String(f.year)===String(y) && !m[f.day]) m[f.day]=f; });
  return m;
}
function fixedOn(y,dn){ return fixedFor(y)[dn]||null; }
function isFixedMatch(y,dn,red,blue){
  const f=fixedOn(y,dn); return !!(f && f.red===red && f.blue===blue);
}
/* ---- the reveal & lock schedule -------------------------------------------
   Each day's draw goes public at 20:00 the evening before ("the reveal"), and
   is then still re-drawable until 06:00 that morning — so the group get their
   moan, and Justin can answer it, right up until they tee off. After that the
   day is set in stone. Days already played are never touched again.          */
const REVEAL_HOUR = 20, LOCK_HOUR = 6;
function todayISO(){ const t=new Date();
  return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }
function dayMeta(y,dn){ return ((DATA[y]||{}).days||[]).find(x=>x.day===dn)||null; }
function atHour(iso,h,offsetDays){
  const d=new Date(iso+"T00:00:00");
  if (offsetDays) d.setDate(d.getDate()+offsetDays);
  d.setHours(h,0,0,0); return d;
}
function lockAt(y,dn){ const m=dayMeta(y,dn); return m&&m.date?atHour(m.date,LOCK_HOUR,0):null; }
function revealAt(y,dn){ const m=dayMeta(y,dn); return m&&m.date?atHour(m.date,REVEAL_HOUR,-1):null; }
function dayLocked(y,dn){
  if (sealed(y)) return true;
  const t=lockAt(y,dn); if(!t) return false;          // no date -> nothing to lock against
  return new Date() >= t;
}
function dayRevealed(y,dn){
  if (!READONLY) return true;                          // Justin always sees the lot
  const t=revealAt(y,dn); if(!t) return true;

}
function drawableDays(y){ return ((DATA[y]||{}).days||[]).filter(x=>!dayLocked(y,x.day)); }
function tourStarted(y){
  const d=DATA[y]; if(!d||!d.days||!d.days.length) return false;
  const d1=d.days[0].date; if(!d1) return false;
  return todayISO() >= d1;                    // ISO dates compare lexicographically
}
function hasFixture(y){ const d=DATA[y]; return !!(d&&d.matches&&d.matches.length); }
/* the PARTY still locks for the whole tour once it starts — players can't change mid-tour */
function drawLocked(y){ return sealed(y) || (tourStarted(y) && hasFixture(y)); }
function fmtWhen(dt){
  if(!dt) return "";
  const D2=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()];
  const h=dt.getHours();
  return D2+" "+(h%12===0?12:h%12)+(h<12?"am":"pm");
}
function fmtDate(iso){
  if(!iso) return "";
  const p=iso.split("-"), M=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const n=+p[2], s=(n%10===1&&n%100!==11)?"st":(n%10===2&&n%100!==12)?"nd":(n%10===3&&n%100!==13)?"rd":"th";

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function priorMeets(){
  const s={}; const y=String(EDIT_FROM-1);
  if (DATA[y]) DATA[y].matches.forEach(m=>m.singles.forEach(x=>{ s[[x.red,x.blue].sort().join("|")]=1; }));
  return s;
}
function drawBlocks(n){
  const b=[]; let i=0;
  if (n%2===1){ b.push([0]); i=1; }          // odd pair-count: the 2-ball goes out first
  while(i<n){ b.push([i,i+1]); i+=2; }

function genDraw(y){
  const d=DATA[y];
  const reds=d.players.filter(p=>p.team==="RED").map(p=>p.id);
  const blues=d.players.filter(p=>p.team==="BLUE").map(p=>p.id);
  if (!reds.length || reds.length!==blues.length)
    return {error:"Teams are uneven ("+reds.length+" v "+blues.length+"). The ghost-player rule is still to be agreed — even up the teams first."};
  const n=reds.length, D=d.days.length;
  const blocks=drawBlocks(n);
  const prior=priorMeets();
  const hcp={}; d.players.forEach(p=>hcp[p.id]=p.startHcp||0);
  const pinsByDay={}; pins.forEach(p=>{ (pinsByDay[p.day]=pinsByDay[p.day]||[]).push(p); });
  /* Hand-set pairings the week is built around (DRAW_FIXED). Validated hard rather

      return {error:"Fixed pairing: there is no day "+f.day+" in "+y+"."};
    if (!reds.includes(f.red) || !blues.includes(f.blue))
      return {error:"The fixed day-"+f.day+" pairing can't be honoured. It needs "+nm(y,f.red)
        +" on RED and "+nm(y,f.blue)+" on BLUE, and that is not how the teams are set."
        +" Sort the party out, or remove the pairing from DRAW_FIXED in build_app.py."};
  }
  /* days already locked (played, or teeing off today) are FIXED — we optimise the
     rest of the week around them, so who you've already had counts against a repeat. */
  const dayNums=d.days.map(x=>x.day);

  const openDays=dayNums.filter(dn=>!isLocked[dn]);

    return {error:"Every day is locked in. The fixture is final."};
  function existingOrder(dn){                  // reconstruct ro/bo from a committed day
    const gs=d.matches.filter(m=>m.day===dn);
    if(!gs.length) return null;
    const ro=[], bo=[];
    gs.forEach(g=>g.singles.forEach(s=>{ ro.push(s.red); bo.push(s.blue); }));
    return (ro.length===n && bo.length===n) ? {ro,bo} : null;
  }
  const fixed={}; dayNums.forEach(dn=>{ if(isLocked[dn]) fixed[dn]=existingOrder(dn); });

  function newState(){
    const st=[];
    dayNums.forEach(dn=>{
      if (isLocked[dn] && fixed[dn]){ st.push({ro:fixed[dn].ro.slice(), bo:fixed[dn].bo.slice()}); return; }
      const ro=shuffle(reds.slice()), bo=shuffle(blues.slice());

         which park at the tail, can never displace it. */
      const fx=fixedPairs[dn];
      if (fx){
        const ri=ro.indexOf(fx.red); if(ri>=0) [ro[0],ro[ri]]=[ro[ri],ro[0]];
        const bi=bo.indexOf(fx.blue); if(bi>=0) [bo[0],bo[bi]]=[bo[bi],bo[0]];

        const tgt=n-1-k;
        if (fx && tgt<=0) return;               // never over the top of the fixed pairing
        const ri=ro.indexOf(pn.red); if(ri>=0) [ro[tgt],ro[ri]]=[ro[ri],ro[tgt]];
        const bi=bo.indexOf(pn.blue); if(bi>=0) [bo[tgt],bo[bi]]=[bo[bi],bo[tgt]];

          const pk=[ro[bl[0]],ro[bl[1]]].sort().join("|"); part[pk]=(part[pk]||0)+1;
          const bk=[bo[bl[0]],bo[bl[1]]].sort().join("|"); part[bk]=(part[bk]||0)+1;

    for(const k in opp) if(opp[k]>1) oppR+=opp[k]-1;
    for(const k in part) if(part[k]>1) partR+=part[k]-1;
    for(const k in grp) if(grp[k]>1) grpR+=grp[k]-1;
    for(const k in two) if(two[k]>1) twoR+=two[k]-1;
    for(const k in slot) if(slot[k]>1) slotR+=slot[k]-1;
    const cost = 100*oppR + 80*partR + 30*grpR + 40*twoR + 5*slotR + 10*priorHits + 2*gapPen;
    return {cost, oppR, partR, grpR, twoR, slotR, priorHits};
  }
  let best=null, bestT=null;
  for(let r0=0;r0<6;r0++){
    const st=newState();
    let t=tally(st);
    for(let it=0; it<14000; it++){
      const dd=openDays[Math.floor(Math.random()*openDays.length)];   // never disturb a locked day
      const fz=frozen(dd);
      const side=Math.random()<0.5?"ro":"bo";
      const arr=st[dayNums.indexOf(dd)][side];
      const i=Math.floor(Math.random()*n), j=Math.floor(Math.random()*n);
      if(i===j||fz(i)||fz(j)) continue;
      [arr[i],arr[j]]=[arr[j],arr[i]];
      const t2=tally(st);
      if(t2.cost<=t.cost) t=t2;
      else [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    if(!bestT || t.cost<bestT.cost){ bestT=t; best=JSON.parse(JSON.stringify(st)); }
  }
  const tees=["1000h","1010h","1020h","1030h","1040h","1050h","1100h","1110h"];
  const days = d.days.map((meta,di)=>{
    const {ro,bo}=best[di];
    const keepTees=d.matches.filter(m=>m.day===meta.day).map(m=>m.tee);
    const fx=fixedPairs[meta.day];
    return { day:meta.day, meta, locked:isLocked[meta.day],
      groups: blocks.map((bl,slotIdx)=>{
        const g={
          tee: keepTees[slotIdx] || tees[slotIdx] || ("t"+slotIdx),
          format: bl.length===1?"2ball":"4ball",
          matches: bl.map(ix=>({red:ro[ix], blue:bo[ix]}))
        };
        /* The reason rides along with the group, so once the day is revealed the team
           can see why this pair went out first without being told separately. It lives
           in the fixture, which means it is sealed until the day is, like everything else. */
        if (fx && g.matches.some(m=>m.red===fx.red && m.blue===fx.blue)) g.note=fx.note;
        return g;
      }) };
  });

}

/* ---------- the kitty ledger ---------- */
function kittyOf(y){
  const d=DATA[y]; if(!d) return null;
  /* Everything is sent to Justin in sterling, so that is what the kitty is kept in.
     The euro figure beside each payment is a conversion, not the ledger. */
  if (!d.kitty) d.kitty={currency:"£", start:null, days:{}};
  if (!d.kitty.days) d.kitty.days={};
  if (!d.kitty.paid) d.kitty.paid={};
  /* Where the pot came from, before a penny of it is spent:
       rollover  — what was left over from last year
       interest  — what that earned, thanks to the men who paid up front
       earlyN    — how many of them there were
       stake     — what a man puts in for the whole tour (assumption, editable)
     `start` remains the TOTAL opening pot, which is what the ledger runs down. */
  if (d.kitty.rollover===undefined) d.kitty.rollover=null;
  if (d.kitty.interest===undefined) d.kitty.interest=null;
  if (d.kitty.earlyN===undefined) d.kitty.earlyN=null;
  if (d.kitty.stake===undefined) d.kitty.stake=250;
  if (d.kitty.aer===undefined) d.kitty.aer=2.75;
  /* Money owed back to the men who paid for fuel and cars out of their own pockets.
     It leaves the kitty after the last balance is posted, so it comes off what
     rolls into next year. */
  if (d.kitty.extras===undefined) d.kitty.extras=null;
  return d.kitty;
}
/* What we start the year holding, before a single deposit for this tour: last
   year's leftovers plus what they earned. */
function kittyOpening(y){
  const k=kittyOf(y);

  const i=(typeof k.interest==="number")?k.interest:null;
  if (r==null && i==null) return null;

}
/* The full pot once every man has paid his stake in. Derived, not typed — the

function kittyStake(y){ const k=kittyOf(y);

/* running ledger: closing balance is what Justin posts each night; spend is derived */
function kittyLedger(y){
  const d=DATA[y], k=kittyOf(y);
  const rows=[]; const potStart=kittyTotal(y); let prev=potStart;
  const nP=(d.players||[]).length||0;
  (d.days||[]).forEach(x=>{
    const rec=k.days[x.day]||{};
    const bal=(typeof rec.bal==="number")?rec.bal:null;
    const spend=(bal!=null && prev!=null)?Math.round((prev-bal)*100)/100:null;
    rows.push({day:x.day, meta:x, bal, spend, note:rec.note||"", perPlayer:(spend!=null&&nP)?spend/nP:null});
    if (bal!=null) prev=bal;
  });
  const latest=prev;
  const start=potStart;
  const spentTotal=(start!=null&&latest!=null)?Math.round((start-latest)*100)/100:null;
  const daysWith=rows.filter(r=>r.spend!=null);
  return { rows, start, latest, spentTotal, nP,
    avgDay: daysWith.length?spentTotal/daysWith.length:null,
    perPlayerTotal:(spentTotal!=null&&nP)?spentTotal/nP:null,
    perPlayerDay:(daysWith.length&&nP)?(spentTotal/daysWith.length)/nP:null,
    daysLeft:(d.days||[]).length-daysWith.length, daysDone:daysWith.length };
}
