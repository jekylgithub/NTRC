     penny is spent. Only bow out when there is genuinely nothing to show. */
  const anyPaid=Object.keys(k.paid||{}).length>0;
  const anyBal=Object.keys(k.days||{}).some(n=>k.days[n] && typeof k.days[n].bal==="number");
  const anyKitty = L.start!=null || k.rollover!=null || k.interest!=null || anyPaid || anyBal;
  /* For the tour being played, the page earns its place even with an empty pot:
     "who has paid" reads 0 of 14 and that is exactly what people want to see in
     the weeks beforehand. Only a finished year with no kitty bows out. */
  const upcoming = +y>=EDIT_FROM && (d.players||[]).length>0;
  if (!anyKitty && !editable && !upcoming)
    return '<h2 class="sec-t">The Kitty</h2>'
      +'<div class="sec-s">'+y+'</div>'
      +'<div class="empty">No kitty was recorded for '+y+'.</div>'+kittyPanel();

  let out='<h2 class="sec-t">The Kitty</h2>'
    +'<div class="sec-s">'+y+' · what went in, what went out, and who owes what</div>';

  /* Who has paid, in their colours. Tap a man to mark his money in; the euro value
     underneath is what his stake was worth on the day it arrived. */
  if (editable) refreshFx(false);
  {
    const k2=kittyOf(y), paid=k2.paid||{}, T=kittyPaidTotals(y);
    const cols={RED:[],BLUE:[]};
    (d.players||[]).forEach(p=>{ (cols[p.team]||cols.BLUE).push(p); });
    const grp=t=>{
      const men=cols[t]; if(!men.length) return "";
      men.sort((a,b)=>surLabel(y,a.id).localeCompare(surLabel(y,b.id)));
      return '<div class="pp-group"><div class="pp-lab '+(t==="RED"?"r":"b")+'">'
        +(t==="RED"?"Red":"Blue")+'</div><div class="kpay">'
        +men.map(p=>{
          const rec=paid[p.id], on=!!rec;
          const eur=(rec&&typeof rec.eur==="number")?eurStr(rec.eur):"";
          return '<button class="kpp'+(on?" on k-"+t.toLowerCase():"")+'"'
            +(editable?' onclick="togglePaid(\''+p.id+'\')"':' disabled')
            +' title="'+esc(p.name)+(rec?" · paid "+esc(rec.at):" · not yet in")+'">'
            +'<span class="kpp-n">'+flagFor(p.id,"flag kpp-f")+esc(surLabel(y,p.id))+'</span>'
            +(on?'<span class="kpp-v">'+esc(money(y,typeof rec.gbp==="number"?rec.gbp:kittyStake(y)))
                +(eur?' <i>'+esc(eur)+'</i>':"")+'</span>':"")
            +'</button>';
        }).join("")+'</div></div>';
    };
    const fx=kittyFx(y);
    out+='<div class="sec" style="margin-top:20px">'
      +'<div class="sec-s" style="margin-bottom:12px">Who has paid &middot; '
      +T.n+' of '+T.of+' in'+(T.gbp?' &middot; '+esc(money(y,T.gbp)):"")
      +(T.eur?' &middot; '+eurStr(T.eur)+' at the rates on the day':"")+'</div>'
      +grp("RED")+grp("BLUE")
      +(fx?'<div class="note" style="margin-top:10px">£1 = '+eurStr(0).replace(/[\d.,]/g,'')+fx.rate.toFixed(4)
        +' &middot; '+esc(fx.at)+(fx.src?' &middot; '+esc(fx.src):"")
        +(editable?' &middot; <a href="#" onclick="refreshFxNow();return false">refresh</a>':"")+'</div>'
        :(editable?'<div class="note" style="margin-top:10px">No exchange rate yet &mdash; '
          +'<a href="#" onclick="refreshFxNow();return false">fetch today&rsquo;s</a> '
          +'(needs a signal; payments still record without it)</div>':""))
      +'</div>';
  }

  // the balance plaque
  const runningOut = L.latest!=null && L.avgDay && L.daysLeft>0 && L.latest < L.avgDay*L.daysLeft;
  /* The headline is the pot as it actually stands — it climbs as the money comes
     in, then becomes the running balance once the spending starts. The opening
     figure before deposits has its own row in the table below. */
  const TP=kittyPaidTotals(y);
  const headline=L.daysDone ? L.latest : L.start;
  out+='<section class="plaque"><div class="plq-in">'
    +'<div class="plq-label">'+(L.daysDone?"Balance after "+(dayNames[L.daysDone]||("day "+L.daysDone)):"The tour pot")+'</div>'
    +'<div class="plq-row" style="justify-content:center">'
    +'<span class="plq-score"><b style="font-size:clamp(44px,11vw,86px)">'+esc(money(y,headline))+'</b></span>'
    +'</div>'
    +(!L.daysDone&&TP.of?'<div class="plq-sub">'+TP.n+' of '+TP.of+' paid in'
      +(TP.n<TP.of?' &middot; '+esc(money0(y,(TP.of-TP.n)*kittyStake(y)))+' still to come':' &middot; everyone is square')
      +'</div>':"")
    +(L.spentTotal!=null?'<div class="plq-verdict">'+esc(money(y,L.spentTotal))+' spent of '+esc(money(y,L.start))+'</div>':"")
    +(runningOut?'<div class="plq-sub">At this rate the pot is dry before Sunday</div>'
      :(L.daysLeft>0&&L.avgDay?'<div class="plq-sub">Comfortable — '+esc(money(y,L.latest-L.avgDay*L.daysLeft))+' to spare at this rate</div>':""))
    +'</div></section>';

  /* Where the pot came from. The third line is the interesting one: what the
     interest would have been had everyone paid up front, scaled from what the
     early payers actually earned. */
  const nP=(d.players||[]).length||0;
  const stake=kittyStake(y);
  const T2=kittyPaidTotals(y);                 // how many have actually paid in
  const earlyN=(typeof k.earlyN==="number"&&k.earlyN>0)?k.earlyN:null;
  const inter=(typeof k.interest==="number")?k.interest:null;
  const opening=kittyOpening(y);
  const couldHave=(inter!=null&&earlyN&&nP)?Math.round((inter*nP/earlyN)*100)/100:null;
  const missed=(couldHave!=null&&inter!=null)?Math.round((couldHave-inter)*100)/100:null;
  const aer=(typeof k.aer==="number")?k.aer:null;
  const orig=[];
  if (k.rollover!=null)
    orig.push({lab:"Rollover from "+(+y-1), val:money(y,k.rollover)});
  if (inter!=null)
    orig.push({lab:"Interest gained since last year", val:money(y,inter),
      sub:[earlyN ? "from "+earlyN+" tourer"+(earlyN===1?"":"s")+" who paid in early ("
             +money0(y,stake)+"pp)" : "",
           aer!=null ? "+ the rollover @ "+aer+"% AER" : ""].filter(Boolean).join(" ")});
  // not money we hold — what the interest would have been. Set apart deliberately.
  if (couldHave!=null)
    orig.push({lab:"Had all "+nP+" paid up front", val:money(y,couldHave), hyp:true,
      sub:(missed>0?money(y,missed)+" left on the table":"nothing left on the table")});
  if (opening!=null)
    orig.push({lab:"Opening pot", val:money(y,opening), sub:"what we start from, before this year's deposits", sub2:true});
  if (L.start!=null)
    orig.push({lab:"Total starting tour pot", val:money(y,L.start), tot:true,
      sub:"rollover + interest + "+T2.n+" × "+money0(y,stake)
          +(T2.n<nP?" \u00b7 "+(nP-T2.n)+" still to pay":"")});   // esc()'d later, so no entity
  if (orig.length){
    out+='<div class="sec"><h2 class="sec-t" style="font-size:clamp(20px,3.8vw,26px)">'
      +'Where The Pot Came From</h2>'
      +'<div class="sec-s">before a penny of it was spent</div><div class="lb">'
      +orig.map(o=>'<div class="orow'+(o.tot?" orow-t":"")+(o.hyp?" orow-hyp":"")
        +(o.sub2?" orow-s":"")+'">'
        +'<div><b>'+esc(o.lab)+'</b>'+(o.sub?'<span class="kd">'+esc(o.sub)+'</span>':"")+'</div>'
        +'<div class="oval">'+esc(o.val)+'</div></div>').join("")
      +'</div></div>';
  }

  // headline stats
  out+='<div class="quart" style="margin-top:26px">'
    +'<div class="q"><div class="q-n">'+esc(money(y,L.start))+'</div><div class="q-l">Starting<br>pot</div></div>'
    +'<div class="q"><div class="q-n">'+esc(money(y,L.spentTotal))+'</div><div class="q-l">Spent<br>so far</div></div>'
    +'<div class="q"><div class="q-n">'+esc(money(y,L.avgDay))+'</div><div class="q-l">Average<br>per day</div></div>'
    +'<div class="q"><div class="q-n">'+esc(money(y,L.perPlayerTotal))+'</div><div class="q-l">Per player<br>'+(L.nP?"of "+L.nP:"")+'</div></div>'
    +'</div>';

  // the nightly ledger
  out+='<div class="sec"><h2 class="sec-t">The Ledger</h2>'
    +'<div class="sec-s">closing balance posted each night · daily spend calculated</div>'
    +'<div class="lb"><div class="krow hd"><div>Day</div><div>Spent</div><div>Per player</div><div>Balance</div></div>';
  L.rows.forEach(r=>{
    out+='<div class="krow"><div><b>'+(dayNames[r.day]||("Day "+r.day))+'</b>'
      +'<span class="kd">'+esc((r.meta.weekday||"")+(r.note?" · "+r.note:""))+'</span></div>'
      +'<div>'+(r.spend!=null?esc(money(y,r.spend)):"—")+'</div>'
      +'<div>'+(r.perPlayer!=null?esc(money(y,r.perPlayer)):"—")+'</div>'
      +'<div class="kbal">'+(r.bal!=null?esc(money(y,r.bal)):"—")+'</div></div>';
  });
  out+='</div>'
    +(L.perPlayerDay!=null?'<p class="note">That is '+esc(money(y,L.perPlayerDay))+' per player per day so far.</p>':"")
    +'</div>';

  /* What survives the week. The last posted balance, less whatever is owed back to
     the drivers, is what gets locked away until next September. */
  {
    const finalBal=L.latest;
    const extras=(typeof k.extras==="number")?k.extras:null;
    const rollNext=(finalBal!=null)?Math.round((finalBal-(extras||0))*100)/100:null;
    if (finalBal!=null || editable){
      const lastDay=L.daysDone?(dayNames[L.daysDone]||("Day "+L.daysDone)):null;
      const rows=[
        {lab:"Closing balance"+(lastDay?", "+lastDay:""), val:money(y,finalBal)},
        {lab:"Extras", sub:"fuel, cars and anything the drivers paid for themselves",
         val:(extras!=null&&extras!==0)?"−"+money(y,Math.abs(extras)):money(y,extras!=null?0:null)},
        {lab:"Rollover into "+(+y+1), val:money(y,rollNext), tot:true,
         sub:"locked away until next September"}
      ];
      out+='<div class="sec"><h2 class="sec-t" style="font-size:clamp(20px,3.8vw,26px)">'
        +'What Rolls Over</h2><div class="sec-s">what is left when everyone has gone home</div>'
        +'<div class="lb">'+rows.map(o=>'<div class="orow'+(o.tot?" orow-t":"")+'">'
          +'<div><b>'+esc(o.lab)+'</b>'+(o.sub?'<span class="kd">'+esc(o.sub)+'</span>':"")+'</div>'
          +'<div class="oval">'+esc(o.val)+'</div></div>').join("")+'</div>'
        +(rollNext!=null?'<p class="note">That becomes the '+(+y+1)+' rollover, and starts '
          +'earning again the moment it is put away.</p>':"")
        +'</div>';
    }
  }

  // admin controls
  if (editable){
    out+='<div class="panel" style="margin-top:22px"><div class="sec-s" style="margin:2px 0 12px">Keeper of the purse</div>'
      +'<div class="ksub">Last year&rsquo;s money</div>'
      +'<div class="erow"><span class="en">Rollover from '+(+y-1)+'</span>'
      +'<input inputmode="decimal" style="width:104px" value="'+cash(k.rollover)+'" onchange="setKittyNum(\'rollover\',this)">'
      +'<input style="width:46px;text-align:center" value="'+esc(k.currency||"€")+'" onchange="setKittyCur(this)" title="Currency"></div>'
      +'<div class="erow"><span class="en">Interest gained on it</span>'
      +'<input inputmode="decimal" style="width:104px" value="'+cash(k.interest)+'" onchange="setKittyNum(\'interest\',this)"></div>'
      +'<div class="erow"><span class="en">Paid in early <i>(tourers)</i></span>'
      +'<input inputmode="numeric" style="width:104px" value="'+(k.earlyN!=null?k.earlyN:"")+'" onchange="setKittyNum(\'earlyN\',this)"></div>'
      +'<div class="erow"><span class="en">Rate <i>(% AER)</i></span>'
      +'<input inputmode="decimal" style="width:104px" value="'+(k.aer!=null?k.aer:"")+'" onchange="setKittyNum(\'aer\',this)"></div>'
      +'<div class="ksub">This year&rsquo;s deposits</div>'
      +'<div class="erow"><span class="en">Stake per man</span>'
      +'<input inputmode="decimal" style="width:104px" value="'+cash(k.stake)+'" onchange="setKittyNum(\'stake\',this)"></div>'
      +'<div class="erow"><span class="en">Tourers in the party</span>'
      +'<span class="kcalc">'+nP+' <i>from the roster</i></span></div>'
      +'<div class="erow erow-tot"><span class="en">Total starting tour pot</span>'
      +'<span class="kcalc kcalc-t">'+esc(money(y,L.start))+'</span></div>'
      +'<div class="ksub">Each night</div>';
    d.days.forEach(x=>{
      const rec=k.days[x.day]||{};
      out+='<div class="erow"><span class="en">'+(dayNames[x.day]||("Day "+x.day))+' closing balance</span>'
        +'<input inputmode="decimal" style="width:110px" value="'+cash(rec.bal)+'" onchange="setKittyBal('+x.day+',this)">'
        +'</div>'
        +'<div class="erow" style="border:0;padding-top:0"><input style="flex:1;width:auto;text-align:left;font-size:13px" '
        +'placeholder="what it went on (optional)" value="'+esc(rec.note||"")+'" onchange="setKittyNote('+x.day+',this)"></div>';
    });
    out+='<div class="ksub">When everyone has gone home</div>'
      +'<div class="erow"><span class="en">Extras <i>(fuel, cars, drivers)</i></span>'
      +'<input inputmode="decimal" style="width:104px" value="'+cash(k.extras)+'" onchange="setKittyNum(\'extras\',this)"></div>'
      +'<div class="erow erow-tot"><span class="en">Rollover into '+(+y+1)+'</span>'
      +'<span class="kcalc kcalc-t">'+esc(money(y,(L.latest!=null)
        ? Math.round((L.latest-((typeof k.extras==="number")?k.extras:0))*100)/100 : null))+'</span></div>'
      +'<div class="note">Post the balance at the end of each night; the spend works itself out.</div></div>'
      +publishBar();
  }
  return out+kittyPanel();
}

/* ---------- share-image export ---------- */
window.shareBoard = async () => {
  const y=curYear, d=DATA[y], ds=dayScores(y);
  const W=1080, H=1440;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const x=cv.getContext("2d");
  const SER='Charter, "Iowan Old Style", Palatino, Georgia, serif';
  const SAN='-apple-system, "Helvetica Neue", Arial, sans-serif';
  const IVORY="#f7f4ec", NAVY="#122341", NAVY2="#1a2f54", GOLD="#a8863c", GOLDP="#d9c89a",
        RED="#a32636", BLUE="#1e4f8f", MUT="#7a7466", HAIR="#e2dccb";
  function rr(x0,y0,w,h,r){ x.beginPath(); x.moveTo(x0+r,y0); x.arcTo(x0+w,y0,x0+w,y0+h,r);
    x.arcTo(x0+w,y0+h,x0,y0+h,r); x.arcTo(x0,y0+h,x0,y0,r); x.arcTo(x0,y0,x0+w,y0,r); x.closePath(); }
  const C=t=>{x.textAlign="center"; return t;};
  x.fillStyle=IVORY; x.fillRect(0,0,W,H);
  // masthead
  x.textAlign="center";
  x.fillStyle=GOLD; x.font="600 22px "+SAN;
  x.fillText((d.event.venue||"").toUpperCase().split(",")[0], W/2, 92);
  x.fillStyle=NAVY; x.font="700 84px "+SER;
  x.fillText("Not the Ryder Cup", W/2, 190);
  x.strokeStyle=HAIR; x.lineWidth=2;
  x.beginPath(); x.moveTo(200,240); x.lineTo(W/2-70,240); x.moveTo(W/2+70,240); x.lineTo(W-200,240); x.stroke();
  x.fillStyle=GOLD; x.font="600 30px "+SER; x.fillText(y, W/2, 251);
  const dd=d.days.filter(q=>q.date);
  x.fillStyle=MUT; x.font="600 21px "+SAN;
  const tal=tallyAfter(y);
  const sub = "TOUR "+(LEGACY.tourNumbering[y]||"")+" · TROPHIES  BLUE "+tal.BLUE+" — RED "+tal.RED;
  x.fillText(sub, W/2, 300);
  // plaque
  const P0=110, PW=W-220, PY=350, PH=430;
  x.save(); x.shadowColor="rgba(18,35,65,.25)"; x.shadowBlur=40; x.shadowOffsetY=14;
  const grad=x.createLinearGradient(0,PY,0,PY+PH); grad.addColorStop(0,NAVY2); grad.addColorStop(1,NAVY);
  rr(P0,PY,PW,PH,12); x.fillStyle=grad; x.fill(); x.restore();
  rr(P0+8,PY+8,PW-16,PH-16,8); x.strokeStyle="rgba(217,200,154,.55)"; x.lineWidth=2; x.stroke();
  x.fillStyle=GOLDP; x.font="600 20px "+SAN; x.textAlign="center";
  const total=ds.red+ds.blue;
  x.fillText(total?"FINAL SCORE":"SCOREBOARD", W/2, PY+64);
  const capR=d.players.find(p=>p.captain&&p.team==="RED"), capB=d.players.find(p=>p.captain&&p.team==="BLUE");
  const lx=P0+PW*0.19, rx2=P0+PW*0.81;
  x.font="600 17px "+SAN;
  x.fillStyle="rgba(244,241,232,.6)";
  if (capR) x.fillText("C · "+capR.name.toUpperCase(), lx, PY+150);
  if (capB) x.fillText("C · "+capB.name.toUpperCase(), rx2, PY+150);
  x.font="700 40px "+SER;
  x.fillStyle="#e4a9a9"; x.fillText("RED", lx, PY+205);
  x.fillStyle="#a9c2e8"; x.fillText("BLUE", rx2, PY+205);
  { const tl=tallyAfter(y);
    x.fillStyle=GOLDP; x.font="16px "+SAN; x.globalAlpha=.8;
    x.fillText("★".repeat(tl.RED), lx, PY+238);
    x.fillText("★".repeat(tl.BLUE), rx2, PY+238);
    x.globalAlpha=1; }
  const sTxt=half(ds.red)+"  –  "+half(ds.blue);
  x.fillStyle="#f4f1e8"; x.font="700 "+(sTxt.length>9?96:120)+"px "+SER;
  x.fillText(sTxt, W/2, PY+250);
  x.fillStyle=GOLDP; x.font="600 24px "+SAN;
  let verdict="AWAITING FIRST BLOOD";
  if (total>0){
    if (ds.red===ds.blue) verdict=((d.event.holdersBefore||"BLUE")==="BLUE"?"BLUES":"REDS")+" RETAIN THE TROPHY";
    else verdict=(ds.blue>ds.red?"BLUE":"RED")+" LEAD";
    const doneAll = d.days.every(q=>{const s=ds.days[q.day];return s.RED+s.BLUE>0;});
    if (doneAll && ds.red!==ds.blue) verdict=(ds.blue>ds.red?"BLUE":"RED")+" WIN THE TROPHY";
  }
  x.fillText(verdict, W/2, PY+350);
  // day cards 2x2
  const DYY=PY+PH+60, CW=(PW-30)/2, CH=150;
  d.days.forEach((q,i)=>{
    const cx=P0+(i%2)*(CW+30), cy=DYY+Math.floor(i/2)*(CH+26);
    rr(cx,cy,CW,CH,8); x.fillStyle="#fdfcf8"; x.fill(); x.strokeStyle=HAIR; x.lineWidth=2; x.stroke();
    const s=ds.days[q.day];
    x.textAlign="left";
    x.fillStyle=NAVY; x.font="700 26px "+SER; x.fillText("Day "+q.day, cx+26, cy+48);
    x.fillStyle=MUT; x.font="600 17px "+SAN;
    x.fillText(((q.weekday||"")+" · "+cName(q.course)).toUpperCase(), cx+26, cy+78);
    x.textAlign="right";
    if (s.RED+s.BLUE>0){
      x.font="700 40px "+SER;
      const rw=x.measureText(half(s.BLUE)).width;
      x.fillStyle=BLUE; x.fillText(half(s.BLUE), cx+CW-26, cy+62);
      x.fillStyle=MUT;  x.fillText("–", cx+CW-26-rw-14, cy+62);
      const dw=x.measureText("–").width;
      x.fillStyle=RED;  x.fillText(half(s.RED), cx+CW-26-rw-14-dw-14, cy+62);
      const w2=s.BLUE>s.RED?"BLUE DAY":(s.RED>s.BLUE?"RED DAY":"HALVED");
      x.fillStyle=s.BLUE>s.RED?BLUE:(s.RED>s.BLUE?RED:MUT);
      x.font="700 16px "+SAN; x.fillText(w2, cx+CW-26, cy+108);
    } else { x.fillStyle="#a49d8d"; x.font="600 17px "+SAN; x.fillText("TO PLAY", cx+CW-26, cy+62); }
  });
  // Tourist Trophy top 3
  const {ord}=ttRanks(y);
  const mvs=ttMoves(y);
  const played3=ord.filter(i=>played(y,i).length>0).slice(0,3);
  let ty=DYY+2*(CH+26)+66;
  if (played3.length){
    x.textAlign="center"; x.fillStyle=NAVY; x.font="700 40px "+SER;
    x.fillText("The Tourist Trophy", W/2, ty);
    x.textAlign="left"; ty+=54;
    played3.forEach((i,k)=>{
      x.fillStyle=k===0?GOLD:MUT; x.font="700 26px "+SER;
      x.fillText((k+1)+".", P0+40, ty);
      x.fillStyle=k===0?GOLD:"#1c2740"; x.fillText(nm(y,i), P0+90, ty);
      const nw=x.measureText(nm(y,i)).width;
      cvMove(x, P0+108+nw, ty-3, mvs&&mvs[i], SAN, 15);   // climbed or slipped overnight
      x.textAlign="right"; x.font="700 26px "+SER; x.fillStyle=k===0?GOLD:"#1c2740";
      x.fillText(String(best3(y,i)), W-P0-40, ty);
      x.textAlign="left"; ty+=44;
    });
  }
  x.textAlign="center"; x.fillStyle="#a49d8d"; x.font="600 16px "+SAN;
  x.fillText("OFFICIAL RECORD OF NOT THE RYDER CUP · TOUR "+(LEGACY.tourNumbering[y]||""), W/2, H-46);
  // share or download
  const done = m => { const el=document.getElementById("shareStatus"); if (el) el.textContent=m; };
  cv.toBlob(async blob=>{
    const file=new File([blob],"ntrc-"+y+"-board.png",{type:"image/png"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:"NTRC "+y}); done("Shared."); return; } catch(e){}
    }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="ntrc-"+y+"-board.png"; a.click();
    done("Image saved — send it to the WhatsApp group.");
  },"image/png");
};

/* ---------- full-site report image (all tabs, hand-drawn: reliable everywhere) ---------- */
window.shareFull = () => {

/* ---------- sealing the draw ----------
   The 🤫 panels only ever hid unrevealed days in the INTERFACE — the pairings were
   still sitting in data.json for anyone who opened it. These lock them properly:
   the fixture for any day that has not reached its reveal time is encrypted before
   publishing, so the file itself gives nothing away.

   AES-GCM, key derived from a passphrase with PBKDF2. The passphrase lives only in
   the organiser's own browsers — it is never published and never in the build.

   OPT-IN BY DESIGN: with no passphrase set, publishing behaves exactly as it always
   has and nothing anywhere changes. */
const SEAL_KEY="ntrc.seal";
function sealPass(){ try{ return localStorage.getItem(SEAL_KEY)||null; }catch(e){ return null; } }
window.setSealPass = v => { try{
  const s=String(v||"").trim();
  if(s) localStorage.setItem(SEAL_KEY,s); else localStorage.removeItem(SEAL_KEY);
  render();
}catch(e){} };
const b64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function sealKey(pass, salt){
  const km=await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function sealBlob(obj, pass){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await sealKey(pass, salt);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, key,
    new TextEncoder().encode(JSON.stringify(obj)));
  return {v:1, salt:b64(salt), iv:b64(iv), ct:b64(ct)};
}
async function openBlob(blob, pass){
  const key=await sealKey(pass, unb64(blob.salt));
  const out=await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(blob.iv)}, key, unb64(blob.ct));
  return JSON.parse(new TextDecoder().decode(out));
}
/* Take the fixture for every not-yet-revealed day out of the clear data. */
async function sealYear(yearObj, y, pass){
  const hide=(yearObj.days||[]).filter(x=>{ const r=revealAt(y,x.day); return r && new Date()<r; })
                               .map(x=>x.day);
  if(!hide.length || !pass) return yearObj;
  const keep=[], hidden=[];
  (yearObj.matches||[]).forEach(m=>{ (hide.indexOf(m.day)>=0 ? hidden : keep).push(m); });
  if(!hidden.length) return yearObj;
  const out=Object.assign({}, yearObj);
  out.matches=keep;
  out.sealed=await sealBlob({days:hide, matches:hidden}, pass);
  return out;
}
/* …and put it back, on a device that knows the passphrase. */
async function unsealAll(pass){
  if(!pass) return false;
  let any=false;
  for (const y of Object.keys(BASE)){
    const b=BASE[y] && BASE[y].sealed;
    if(!b) continue;
    try{
      const got=await openBlob(b, pass);
      BASE[y]=Object.assign({}, BASE[y], {matches:(BASE[y].matches||[]).concat(got.matches||[])});
      delete BASE[y].sealed;
      any=true;
    }catch(e){ /* wrong passphrase — leave it sealed, the UI simply shows nothing */ }
  }
  if(any){ rebuildData(); }
  return any;
}

      {headers:{Authorization:"Bearer "+tok, Accept:"application/vnd.github+json"}});
    if(r.status===401) st(shape+"<br><b>401 — GitHub rejected that token.</b> "
      +"A fine-grained token is normally 90-100 characters and starts <b>github_pat_11</b>. "
      +"If the length or the start look wrong above, something overwrote the box — clear it, "
      +"paste again, Save, then Test without touching anything else.");
    else if(r.status===404) st("<b>404 — GitHub can't see that repository.</b> Either the "
      +"account/repository names are wrong, or the token wasn't given access to this "
      +"repo (Repository access → Only select repositories → pick it).");
    else if(r.status===403) st("<b>403 — the token can see the repo but may not write to it.</b> "
      +"Check Repository permissions → <b>Contents</b> → <b>Read and write</b>.");
    else if(!r.ok) st("GitHub said "+r.status+" — show me that number.");
    else {
      const j=await r.json();
      const perm=(j.permissions&&j.permissions.push);
      st(perm ? "&#10003; Connected to <b>"+esc(j.full_name)+"</b> with write access. Ready to publish."
              : "Connected to <b>"+esc(j.full_name)+"</b>, but this token cannot write. "
                +"Set Repository permissions → <b>Contents</b> → <b>Read and write</b>.");
    }
  }catch(e){ st("No connection — try again when there's signal."); }
};
window.publishNow = async () => {
  const cfg=pubCfg();
  const st=m=>{const el=document.getElementById("pubStatus"); if(el) el.textContent=m;};
  if(!cfg){ st("Set up GitHub first (open the settings above)."); return; }
  /* last line of defence: never let this machine quietly bury the phone's work */
  if (siteNewer && !confirm("The team site has newer data than this machine.\n\n"
      +"Publishing now will overwrite it. Cancel, then press "
      +"\u201cLoad what\u2019s on the site\u201d instead.")) return;
  st("Publishing…");
  try{
    const payload={ publishedAt:new Date().toISOString(), build:BUILD };
    const pass=sealPass();
    for (const k of Object.keys(DATA)){
      if(+k<EDIT_FROM) continue;
      // with no passphrase this is a no-op and the payload is exactly as it always was
      payload[k]= pass ? await sealYear(DATA[k], k, pass) : DATA[k];
    }
    if (pass) st("Sealing the unrevealed days…");
    const body=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    const url="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/data.json";
    const hdr={ "Authorization":"Bearer "+cfg.token, "Accept":"application/vnd.github+json" };
    let sha=null;
    const g=await fetch(url,{headers:hdr});
    if (g.ok){ sha=(await g.json()).sha; }
    const put=await fetch(url,{ method:"PUT", headers:hdr,
      body:JSON.stringify({ message:"NTRC publish "+new Date().toISOString().slice(0,16),
        content:body, ...(sha?{sha}:{}) }) });
    if (put.ok){
      try{ localStorage.setItem("ntrc.lastPublish", new Date().toISOString()); }catch(e){}
      siteNewer=null;
      render();                                        // clears the "unpublished" warning
      st("\u2713 Published — the team site updates within a minute or two.");
    }
    else if (put.status===401)
      st("The token isn't valid — most often it was pasted short. Press <b>Test</b> above "
        +"for the exact reason. Nothing is lost; the scores are safe on this device.");
    else if (put.status===403)
      st("The token can see the repo but cannot write to it. On GitHub set Repository "
        +"permissions → <b>Contents</b> → <b>Read and write</b>. Press <b>Test</b> to confirm.");
    else if (put.status===404)
      st("GitHub can't find that repository. Check the account and repository names above.");
    else st("Publish failed ("+put.status+") — check the settings, or show me this number.");
  } catch(e){ st("No connection — try again when there's signal. The WhatsApp image never fails."); }
};

/* ---------- in-app photo library + review-reel generator ---------- */
const PHDB="ntrc-photos";
let photoCache=[], photosLoaded=false, genMsg="";
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(PHDB,1);
  r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains("p")) db.createObjectStore("p",{keyPath:"id"}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function photoAll(){ return idb().then(db=>new Promise(res=>{ const q=db.transaction("p").objectStore("p").getAll();
  q.onsuccess=()=>res((q.result||[]).sort((a,b)=>a.ord-b.ord)); q.onerror=()=>res([]); })).catch(()=>[]); }
function photoPut(rec){ return idb().then(db=>new Promise(res=>{ const tx=db.transaction("p","readwrite"); tx.objectStore("p").put(rec); tx.oncomplete=()=>res(); })).catch(()=>{}); }
function photoDelDB(id){ return idb().then(db=>new Promise(res=>{ const tx=db.transaction("p","readwrite"); tx.objectStore("p").delete(id); tx.oncomplete=()=>res(); })).catch(()=>{}); }
function loadPhotos(){ return photoAll().then(a=>{ photoCache=a; photosLoaded=true; }); }
/* grade + 16:9 blurred-fill frame, entirely in-canvas */
function gradeFile(file){ return new Promise((res,rej)=>{
  const img=new Image(); img.onload=()=>{ try{
    const W=1280,H=720, cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d");
    const s=Math.max(W/img.width,H/img.height), cw=img.width*s, ch=img.height*s;
    x.save(); try{ x.filter="blur(26px) brightness(0.6)"; }catch(e){} x.drawImage(img,(W-cw)/2,(H-ch)/2,cw,ch); x.restore();
    const f=Math.min(W*0.98/img.width,H*0.98/img.height), fw=img.width*f, fh=img.height*f;
    x.drawImage(img,(W-fw)/2,(H-fh)/2,fw,fh);
    x.globalCompositeOperation="overlay"; x.fillStyle="rgba(255,178,90,0.05)"; x.fillRect(0,0,W,H);
    x.globalCompositeOperation="source-over";
    const g=x.createRadialGradient(W/2,H/2,H*0.32,W/2,H/2,H*0.9); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(18,24,40,0.42)");
    x.fillStyle=g; x.fillRect(0,0,W,H);
    res(cv.toDataURL("image/jpeg",0.82));
  }catch(e){ rej(e); } }; img.onerror=()=>rej(new Error("bad image")); img.src=URL.createObjectURL(file); }); }
window.onPhotoPick = async input => {
  const files=Array.prototype.slice.call(input.files); if(!files.length) return;
  genMsg="Adding "+files.length+" photo"+(files.length>1?"s":"")+"…"; render();
  await loadPhotos(); let ord=photoCache.length;
  for(const f of files){ try{ const src=await gradeFile(f);
    await photoPut({id:"p"+(ord)+"_"+Math.round(Math.random()*1e9), src, cap:"", ord:ord++}); }catch(e){} }
  input.value=""; genMsg=""; await loadPhotos(); render();
};
window.setPhotoCap = async (id,el)=>{ await loadPhotos(); const r=photoCache.find(p=>p.id===id); if(r){ r.cap=el.value.slice(0,48); await photoPut(r); } };
window.delPhoto = async id=>{ if(!confirm("Remove this photo?"))return; await photoDelDB(id); await loadPhotos(); render(); };
window.movePhoto = async (id,dir)=>{ await loadPhotos(); const i=photoCache.findIndex(p=>p.id===id); const j=i+dir;
  if(i<0||j<0||j>=photoCache.length)return; const a=photoCache[i],b=photoCache[j]; const t=a.ord; a.ord=b.ord; b.ord=t;
  await photoPut(a); await photoPut(b); await loadPhotos(); render(); };
window.clearPhotos = async ()=>{ if(!confirm("Delete ALL uploaded photos? This cannot be undone."))return;

/* the review reel's pages, computed from this year's data + the app's own roast engine */
function reviewPages(y, photos){
  const d=DATA[y], ds=dayScores(y), R=ds.red, B=ds.blue;
  const {ord}=ttRanks(y), champ=ord[0], spoon=ord[ord.length-1], full=tourComplete(y);
  const A=awards(y);                                   // the same computed roasts as the Ammunition tab
  const P=[]; let pi=0;
  const stmt=(h,t)=>P.push({type:"stmt",t:t||4200,h});
  const photo=(t)=>{ if(pi<photos.length) P.push({type:"photo",i:pi++,t:t||4400}); };
  const strip=s=>String(s).replace(/<[^>]+>/g,"");
  const awCard=a=>({h:"<div class='cl'>"+strip(a[0])+"</div><div class='nm2'>"+esc(a[1])+"</div>"
      +"<div class='cl' style='margin-top:7px;color:var(--gold)'>"+strip(a[3])+"</div><div class='cq'>“"+strip(a[4])+"”</div>", pos:"c", an:"an-fade"});
  const montage=cards=>{ cards=cards.filter(Boolean); if(!cards.length)return;
    P.push({type:"montage",t:(cards.length-1)*2300+7000,life:6400,stagger:2300,cards}); };
  const verdict = R===B ? (((d.event.holdersBefore||"BLUE")==="BLUE"?"Blues":"Reds")+" retain the trophy")
    : ((B>R?"Blue":"Red")+" win the trophy");
  const venue=(d.event.venue||"").split(",")[0];
  stmt("<div class='ey fade'>"+esc(venue)+" · "+y+"</div><div class='big grand d2'>THE TOUR<br>IN REVIEW</div>", 4200);
  photo();
  stmt("<div class='ey fade'>The final reckoning</div><div class='big grand d2'><span class='red'>"+half(R)+"</span> <span style='color:var(--faint)'>–</span> <span class='blue'>"+half(B)+"</span></div><div class='sub fade d4'>"+esc(verdict)+"</div>", 4800);
  photo(); photo();
  const champCard = full ? {h:"<div class='cl'>Champion of the Tourist Trophy</div><div class='nm2 gold'>"+esc(nm(y,champ))+"</div><div class='sc2' style='font-size:clamp(24px,5vw,40px)'>"+best3(y,champ)+" pts</div><div class='cq'>The name on everyone's lips, whether they like it or not.</div>", pos:"c", an:"an-fade"} : null;
  montage([champCard].concat(A.slice(0,2).map(awCard)));
  photo(); photo();
  montage(A.slice(2,5).map(awCard));
  photo();
  montage(A.slice(5,8).map(awCard));
  photo(); photo();
  let dtxt=""; d.days.forEach(x=>{ const s=ds.days[x.day], w=s.BLUE>s.RED?"blue":(s.RED>s.BLUE?"red":"gold");
    dtxt+="<div style='font-family:var(--serif);font-weight:700;font-size:clamp(19px,3.6vw,30px);color:var(--navy)'>Day "+x.day+" · <span class='"+w+"'>"+half(s.RED)+"–"+half(s.BLUE)+"</span></div>"; });
  stmt("<div class='ey fade'>Day by day</div><div class='rise d2'>"+dtxt+"</div>", 4600);
  photo();
  stmt("<div class='title'><div class='l1 fade'>"+esc(venue)+" · "+y+"</div><div class='rule growR d2'></div><div class='l2 grand d2'>UNTIL<br>NEXT YEAR</div><div class='rule growR d4'></div><div class='l3 fade d5'>"+esc(verdict)+"</div></div>", 5400);
  photo();
  stmt("<div class='big rise gold'>Same time,<br>same tee.</div>", 3400);
  return P;
}
window.generateReview = async () => {
  const y=curYear;
  if (!REEL_TPL){ genMsg="Reel engine unavailable in this build."; render(); return; }
  if (!Object.keys(DATA[y].rounds||{}).some(i=>played(y,i).length)){ genMsg="No scores entered for "+y+" yet."; render(); return; }
  genMsg="Building the "+y+" review reel…"; render();

/* ---------- clock & weather strip ----------
   Time comes from the device, so it is right in the UK and right in Spain.
   When the two differ, the venue clock is shown alongside. Weather is the
   VENUE's (what matters for golf), from Open-Meteo — no API key, so nothing
   secret sits in a public repo. Cached 15 min; silently absent when offline. */
const VENUE={name:"Empordà", lat:42.03, lon:3.09, tz:"Europe/Madrid"};
let WX=null;
function wmo(c){
  const m={0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",
    51:"Drizzle",53:"Drizzle",55:"Drizzle",56:"Freezing drizzle",57:"Freezing drizzle",
    61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",
    71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",
    80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",
    95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"};
  const i={0:"☀",1:"🌤",2:"⛅",3:"☁",45:"🌫",48:"🌫",51:"🌦",53:"🌦",55:"🌦",56:"🌦",57:"🌦",
    61:"🌧",63:"🌧",65:"🌧",66:"🌧",67:"🌧",71:"🌨",73:"🌨",75:"🌨",77:"🌨",
    80:"🌦",81:"🌦",82:"⛈",85:"🌨",86:"🌨",95:"⛈",96:"⛈",99:"⛈"};
  return {t:m[c]||"", i:i[c]||""};
}
function wxCached(){
  try{ const c=JSON.parse(localStorage.getItem("ntrc.wx")||"null");
    return (c&&c.d)?c:null; }catch(e){ return null; }
}
async function loadWeather(force){
  const c=wxCached();
  if (c){ WX=c.d; if(!force && (Date.now()-c.t)<15*60*1000){ paintBar(); return; } }
  paintBar();
  try{
    const u="https://api.open-meteo.com/v1/forecast?latitude="+VENUE.lat+"&longitude="+VENUE.lon
      +"&current=temperature_2m,weather_code,wind_speed_10m"
      +"&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1";
    const r=await fetch(u); if(!r.ok) return;
    const j=await r.json();
    WX={ temp:Math.round(j.current.temperature_2m), code:j.current.weather_code,
         wind:Math.round(j.current.wind_speed_10m),
         hi:Math.round((j.daily.temperature_2m_max||[])[0]),
         lo:Math.round((j.daily.temperature_2m_min||[])[0]) };
    try{ localStorage.setItem("ntrc.wx", JSON.stringify({t:Date.now(), d:WX})); }catch(e){}
    paintBar();
  }catch(e){ /* no signal — the strip just shows the clock */ }
}
function barHTML(){
  const now=new Date();
  let devTz=""; try{ devTz=Intl.DateTimeFormat().resolvedOptions().timeZone||""; }catch(e){}
  const date=now.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  const time=now.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  // group 1 — the clocks (local, and venue time if you're elsewhere)
  let times='<b>'+esc(date)+'</b><span class="sep">·</span><b>'+esc(time)+'</b>';
  let named=false;                                   // has the venue been named yet?
  if (devTz && devTz!==VENUE.tz){
    let vt=""; try{ vt=now.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",timeZone:VENUE.tz}); }catch(e){}
    if (vt && vt!==time){ times+='<span class="sep">·</span>'+esc(VENUE.name)+' <b>'+esc(vt)+'</b>'; named=true; }
  }
  // group 2 — weather + countdown (drops to its own line on a phone)
  let env=[];
  if (WX && typeof WX.temp==="number"){
    const w=wmo(WX.code);
    const here=(devTz===VENUE.tz);                   // standing on the course
    env.push('<span class="wx">'+((named||here)?"":esc(VENUE.name)+" ")
      +w.i+' '+WX.temp+'°'+(w.t?' '+esc(w.t):"")+'</span>');
  }
  // countdown to first tee (Thu 1 Oct 2026)
  const teeOff=new Date(2026,9,1,0,0,0), last=new Date(2026,9,4,23,59,59);
  const dLeft=Math.ceil((teeOff-now)/86400000);
  if (dLeft>0) env.push('<span class="cd">'+dLeft+' day'+(dLeft===1?"":"s")+' to go</span>');
  else if (now<=last){ const dayN=Math.floor((now-teeOff)/86400000)+1; env.push('<span class="cd cd-live">Tour day '+dayN+' 🏌</span>'); }
  let out='<span class="bar-times">'+times+'</span>';
  if (env.length) out+='<span class="bar-sep sep">·</span><span class="bar-env">'+env.join('<span class="sep">·</span>')+'</span>';
  return out;
}
function paintBar(){
  const el=document.getElementById("wxbar");

    // and a controller change means a new build took over: reload once into it.
    let swReloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(swReloaded) return; swReloaded=true; location.reload();

/* ---------- shell ---------- */
/* Every tour that has a Winners page: all the way back to 2014, because the
   individual Stableford — and now the photographs — survive for all of them. */
function winnerYears(){
  return Object.keys(DATA).sort().filter(y=>tourComplete(y) || +y>=EDIT_FROM);
}
function render(){
  /* The Winners tab is the ONE place a vault year is selectable. Everywhere else
     the pills stay 2021+, because Board / TT Singles / Ammunition still assume a
     team on every player and throw on 2014–16. Leaving the tab therefore snaps the
     year back to a live one rather than carrying a vault year into a view that
     cannot render it. */
  const winTab = curTab==="winners" || curTab==="album";
  const yrs = winTab ? winnerYears() : liveYears();
  if (!DATA[curYear] || (isVault(curYear) && !winTab)) curYear=liveYears().slice(-1)[0];
  const yearless = curTab==="records" || curTab==="setup" || curTab==="players"
                || curTab==="stats" || curTab==="origins" || curTab==="rules" || curTab==="home";
  document.getElementById("yearPills").innerHTML = yearless ? "" :
    yrs.map(v=>'<button class="yr-pill'+(v===curYear?" on":"")+'" onclick="setYr(\''+v+'\')">'+v+'</button>').join("");
  document.getElementById("tabbar").innerHTML = TABS.map(([k,l])=>
    '<button class="tab'+(k===curTab?" on":"")+'" onclick="go(\''+k+'\')">'+l+'</button>').join("");
  wireTabFades(); requestAnimationFrame(updateTabFades);
  const v=document.getElementById("view");
  try{
    if (curTab==="board") v.innerHTML=vBoard(curYear);
    else if (curTab==="match") v.innerHTML=vMatch(curYear);
    else if (curTab==="trophy") v.innerHTML=vTrophy(curYear);
    else if (curTab==="ammo") v.innerHTML=vAmmo(curYear);
    else if (curTab==="records") v.innerHTML=vRecords();
    else if (curTab==="winners") v.innerHTML=vWinners(curYear);
    else if (curTab==="album") v.innerHTML=vAlbum(curYear);
    else if (curTab==="origins") v.innerHTML=vOrigins();
    else if (curTab==="rules") v.innerHTML=vRules();
    else if (curTab==="live") v.innerHTML=vLive(curYear);
    else if (curTab==="home") v.innerHTML=vHome();
    else if (curTab==="players") v.innerHTML=vPlayers();
    else if (curTab==="stats") v.innerHTML=vStats();
    else if (curTab==="photos") v.innerHTML=vPhotos();
    else if (curTab==="kitty") v.innerHTML=vKitty(curYear);
    else if (curTab==="setup") v.innerHTML=vSetup();
    else if (curTab==="draw") v.innerHTML=vDraw(curYear);
    else v.innerHTML=vEnter(curYear);
  }catch(e){ v.innerHTML='<div class="empty">Something went wrong rendering this view: '+esc(e.message)+'</div>'; }
  v.innerHTML += '<footer class="foot">Official record of Not the Ryder Cup · Tour '+(LEGACY.tourNumbering[curYear]||"")+'<br><span style="opacity:.55">'+(READONLY?'team edition':'admin')+' · build '+BUILD+'</span>'
    +'<div class="foot-c">'+CREDIT+'</div></footer>';
}
window.go = t => { curTab=t; render(); window.scrollTo(0,0); };
/* ---------- the landing page ----------
   Built from the tour data rather than typed, so it can never disagree with the
   app behind it. Any click, tap or key dismisses it. */
/* ---------- the landing page ----------
   Built from the tour data rather than typed, so it can never disagree with the
   app behind it. It stays in the DOM after the first dismissal so that coming
   back to the app can show it again — tapping a home-screen icon resumes a PWA
   rather than reloading it, so a cold start is not the only arrival. */
const SPLASH_AWAY_MS = 8000;   // ignore a glance at a notification; greet a real return
const splashEl=document.getElementById("splash");
let splashArmed=false, awaySince=0;
function buildSplash(){
  if(!splashEl) return;
  const y=liveYears().slice(-1)[0], d=DATA[y]||{};
  const venue=((d.event||{}).venue)||"";
  const dr=(function(){ try{ return dateRange(y)||""; }catch(e){ return ""; } })();
  // each name kept whole — "Chris / Wright" across a line break reads as two men
  const party=(d.players||[]).map(p=>'<span class="sp-n">'+esc(p.name)+'</span>');
  splashEl.innerHTML='<div class="sp-k">'+esc(venue)+'</div>'
    +'<div class="sp-t">Not the<br>Ryder Cup</div>'
    +'<div class="sp-r"><span></span><em>'+y+'</em><span></span></div>'
    +(dr?'<div class="sp-v">'+esc(dr)+'</div>':"")
    +(party.length?'<div class="sp-p">'+party.join(' &middot; ')+'</div>':"")
    +'<button class="sp-tr" onclick="splashTrailer(event)">&#9654; Watch the trailer'
    +'<span>3 min 36</span></button>'
    +'<div class="sp-e"><i>&hellip;or click anywhere to go straight in</i></div>'
    +'<div class="sp-c">'+CREDIT+'</div>';
}
function showSplash(returning){
  if(!splashEl) return;
  buildSplash();                                  // restarts the staggered entrances
  splashEl.classList.remove("gone");
  if (returning){                                 // coming back: fade over the app
    splashEl.classList.add("arriving");
    void splashEl.offsetWidth;
    splashEl.classList.remove("arriving");
  }                                               // first load: already covering, stay covering
  splashArmed=true;
  try{ splashEl.focus({preventScroll:true}); }catch(e){}
}
window.splashTrailer = e => {
  if(e){ e.stopPropagation(); e.preventDefault(); }   // don't also count as "enter"
  location.href="trailer.html";
};
function leaveSplash(){
  if(!splashArmed || !splashEl) return;
  splashArmed=false;
  splashEl.classList.add("gone");                 // stays in the DOM, ready to return
}
if (splashEl){
  splashEl.addEventListener("click", leaveSplash);
  splashEl.addEventListener("keydown", e=>{
    if(e.key==="Enter"||e.key===" "||e.code==="Space"){ e.preventDefault(); leaveSplash(); } });
  document.addEventListener("keydown", ()=>{ if(splashArmed) leaveSplash(); });
  /* Coming back to the app: greet them again, and on the published team site pull
     the freshest scores at the same time — "auto-refresh" in the sense that matters. */
  document.addEventListener("visibilitychange", ()=>{
    if (document.visibilityState==="hidden"){ awaySince=Date.now(); return; }
    if (!awaySince || Date.now()-awaySince < SPLASH_AWAY_MS) return;
    awaySince=0;
    if (READONLY && location.protocol.indexOf("http")===0){
      fetch("data.json?t="+Date.now()).then(r=>r.ok?r.json():null).then(j=>{
        if(!j) return;
        let got=false;
        Object.keys(j).forEach(k=>{ if(/^\d{4}$/.test(k) && j[k]){ BASE[k]=j[k]; got=true; } });
        if(got){ rebuildData(); render(); }
      }).catch(()=>{});
    }
    curTab="home"; render(); window.scrollTo(0,0);
    showSplash(true);
  });
  showSplash(false);
}
window.setYr = y => { curYear=y; render(); };
render();
paintBar();
if (typeof setInterval==="function"){
  setInterval(paintBar, 20000);                 // clock ticks without touching the view
  setInterval(()=>loadWeather(true), 15*60*1000);
}
loadWeather(false);
</script>
